<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>格鬥遊戲原型</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='2' y='2' width='5' height='12' fill='%233b82f6'/><rect x='9' y='2' width='5' height='12' fill='%23ef4444'/></svg>" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;               /* 阻止瀏覽器手勢(捲動/縮放)搶走觸控 */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    #game {
      width: 100%;
      height: 100%;
    }
    #game canvas {
      display: block;
    }

    /* 直向遮罩:偵測到 portrait 時蓋住畫面提示轉橫向 */
    #rotate-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(0, 0, 0, 0.94);
      color: #fff;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      font-family: system-ui, -apple-system, 'Noto Sans TC', sans-serif;
      font-size: 20px;
      text-align: center;
    }
    #rotate-overlay .icon {
      font-size: 64px;
      animation: rotate-hint 1.8s ease-in-out infinite;
    }
    @keyframes rotate-hint {
      0%, 25%  { transform: rotate(0deg); }
      65%, 100% { transform: rotate(90deg); }
    }
    @media (orientation: portrait) {
      #rotate-overlay { display: flex; }
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate-overlay">
    <div class="icon">📱</div>
    <div>請將手機轉為橫向</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
