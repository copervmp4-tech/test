<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2f1f6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="天神祭">
<title>大阪天神祭 · 祭典導航</title>
<link rel="stylesheet" href="leaflet/leaflet.css"/>
<style>
/* ============ Base ============ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f2f1f6; --surface:#ffffff; --surface2:#ffffff; --line:rgba(60,60,67,.12);
  --text:#1c1c1e; --muted:#6d6d72;
  --accent:#24407c; --gold:#b8720a;
  --green:#34c759; --yellow:#ffcc33; --red:#ff3b30; --blue:#007aff;
  --route:#3dd7ee;
  /* ── glass materials（iOS 淺色系統材質） ── */
  --glass:saturate(180%) blur(22px);
  --glass-strong:saturate(180%) blur(30px);
  --pane:rgba(255,255,255,.68);
  --pane-strong:rgba(252,251,255,.86);
  --card:rgba(120,120,128,.08);
  --hair:rgba(60,60,67,.14);
  --hi:inset 0 1px 0 rgba(255,255,255,.65);
  --shadow:0 8px 30px rgba(30,26,20,.12);
  --shadow-lg:0 22px 55px rgba(30,26,20,.18);
  --spring:cubic-bezier(.32,.72,0,1);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  --tabbar-h:66px;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  background:var(--bg); color:var(--text); line-height:1.55;
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
}
button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none}
.hidden{display:none!important}

/* ============ Top bar ============ */
#topbar{
  position:fixed; top:0; left:0; right:0; z-index:1200;
  background:linear-gradient(180deg,rgba(245,244,250,.86),rgba(245,244,250,.38) 82%,rgba(245,244,250,0));
  backdrop-filter:var(--glass); -webkit-backdrop-filter:var(--glass);
  padding:calc(var(--safe-top) + 11px) 14px 16px;
}
#topbar .row1{display:flex;align-items:center;gap:10px}
#clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.2rem;letter-spacing:.5px;white-space:nowrap}
#clock .day{font-size:.72rem;color:var(--gold);font-weight:700;margin-left:5px;background:rgba(184,114,10,.12);padding:2px 6px;border-radius:6px}
#topRight{margin-left:auto;display:flex;gap:7px;align-items:center}
.tbtn{height:38px;padding:0 12px;border-radius:19px;background:var(--pane);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--hair);box-shadow:var(--hi);display:flex;align-items:center;gap:6px;font-size:.84rem;font-weight:700;color:var(--text);transition:transform .12s var(--spring)}
.tbtn svg{width:19px;height:19px}
.tbtn:active{transform:scale(.9)}
.tbtn .n{color:var(--gold);font-variant-numeric:tabular-nums}
#taskChip{
  margin-top:10px; display:flex; align-items:center; gap:9px;
  background:var(--pane); backdrop-filter:var(--glass); -webkit-backdrop-filter:var(--glass);
  border:1px solid var(--hair); border-radius:15px;
  padding:9px 13px; font-size:.82rem; box-shadow:var(--shadow),var(--hi);
}
#taskChip .tg{font-size:.66rem;background:var(--accent);color:#fff;padding:3px 8px;border-radius:7px;font-weight:800;flex-shrink:0;letter-spacing:.5px}
#taskChip .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#taskChip .cd{flex-shrink:0;color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums;font-size:.78rem}

/* ============ Map ============ */
#map{position:absolute;top:0;bottom:0;left:0;right:0;background:#ece9e2;z-index:1}
.leaflet-container{background:#ece9e2;font-family:inherit}
.leaflet-popup-content-wrapper{background:var(--surface2);color:var(--text);border-radius:14px;box-shadow:var(--shadow)}
.leaflet-popup-tip{background:var(--surface2)}
.leaflet-popup-content{margin:12px 14px;font-size:.85rem;line-height:1.55}
.leaflet-popup-content b{color:var(--gold)}
.leaflet-control-attribution{background:rgba(255,255,255,.75)!important;color:var(--muted)!important;font-size:9px!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-control-zoom{display:none}

/* markers */
.pin{display:flex;align-items:center;justify-content:center;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2.5px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.30);font-weight:700}
.pin span{transform:rotate(45deg);font-size:13px;line-height:1}
.route-dot{width:27px;height:27px;border-radius:50%;background:var(--route);border:3px solid #fff;color:#04222b;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.30)}
.route-dot.active{background:var(--accent);color:#fff;animation:pulse 1.6s infinite}
.route-dot.done{background:var(--green);color:#fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(80,120,200,.6)}70%{box-shadow:0 0 0 15px rgba(80,120,200,0)}100%{box-shadow:0 0 0 0 rgba(80,120,200,0)}}
.gps-dot{width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 7px rgba(0,122,255,.20),0 2px 6px rgba(0,0,0,.32)}
.gps-wrap{position:relative;width:56px;height:56px;display:flex;align-items:center;justify-content:center}
.gps-cone{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from -32deg at 50% 50%,rgba(0,122,255,.42) 0deg,rgba(0,122,255,.14) 56deg,transparent 64deg);opacity:0;transition:opacity .3s}
.gps-cone.on{opacity:1}
.nav-end{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);border:3px solid #fff;box-shadow:0 2px 9px rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center}
.nav-end span{transform:rotate(45deg);font-size:15px}
.zlabel{background:rgba(255,255,255,.92);color:#1c1c1e;font-size:11px;font-weight:800;padding:2px 7px;border-radius:11px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.22);border:1px solid rgba(0,0,0,.08)}

/* ============ Nav banner (during navigation) ============ */
#navBanner{
  position:fixed; left:10px; right:10px; top:calc(var(--safe-top) + 9px); z-index:1250;
  background:linear-gradient(135deg,rgba(0,122,255,.92),rgba(0,90,210,.92)); color:#fff;
  backdrop-filter:var(--glass); -webkit-backdrop-filter:var(--glass);
  border:1px solid rgba(255,255,255,.20);
  border-radius:20px; padding:12px 14px; box-shadow:var(--shadow-lg),var(--hi);
  display:flex; align-items:center; gap:12px; animation:drop .34s var(--spring);
}
@keyframes drop{from{transform:translateY(-16px);opacity:0}to{transform:translateY(0);opacity:1}}
#navBanner .ar{flex-shrink:0;display:flex}
#navBanner .ar svg{width:26px;height:26px}
#navBanner .mid{flex:1;min-width:0}
#navBanner .mid .to{font-weight:800;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#navBanner .mid .meta{font-size:.8rem;opacity:.92;margin-top:1px}
#navBanner .stop{flex-shrink:0;background:rgba(255,255,255,.2);border-radius:10px;padding:8px 11px;font-size:.78rem;font-weight:800}

/* ============ Bottom tab bar ============ */
#tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:1150;
  height:calc(var(--tabbar-h) + var(--safe-bot)); padding-bottom:var(--safe-bot);
  background:var(--pane-strong);
  backdrop-filter:var(--glass); -webkit-backdrop-filter:var(--glass);
  border-top:1px solid var(--hair); box-shadow:0 -1px 0 rgba(255,255,255,.05),var(--shadow);
  display:flex; align-items:stretch;
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:.72rem;font-weight:700;position:relative;transition:color .18s}
.tab .ic{width:25px;height:25px;display:flex;align-items:center;justify-content:center;opacity:.66;transition:transform .22s var(--spring),opacity .18s}
.tab .ic svg{width:25px;height:25px}
.tab.on{color:var(--gold)}
.tab.on .ic{opacity:1;transform:translateY(-1px) scale(1.06)}
.tab.on::before{content:"";position:absolute;top:0;width:24px;height:3px;border-radius:0 0 3px 3px;background:var(--gold);box-shadow:0 0 10px rgba(184,114,10,.35)}
.tab:active .ic{transform:scale(.86)}

/* ============ Floating CTA + GPS ============ */
#ctaWrap{position:fixed;left:0;right:0;bottom:calc(var(--tabbar-h) + var(--safe-bot) + 12px);z-index:1140;display:flex;justify-content:center;pointer-events:none;padding:0 14px}
#ctaBtn{
  pointer-events:auto; background:linear-gradient(180deg,#31549c,#1d3568); color:#fff;
  padding:15px 24px; border-radius:32px; font-weight:800; font-size:.95rem;
  border:1px solid rgba(224,190,90,.40);
  box-shadow:0 12px 34px rgba(29,53,104,.45),var(--hi); display:flex; align-items:center; gap:8px;
  max-width:100%; transition:transform .14s var(--spring);
}
#ctaBtn svg{width:18px;height:18px}
#ctaBtn:active{transform:scale(.94)}
#fabGps{
  position:fixed; right:14px; bottom:calc(var(--tabbar-h) + var(--safe-bot) + 78px); z-index:1141;
  width:50px; height:50px; border-radius:50%; background:var(--pane);
  backdrop-filter:var(--glass); -webkit-backdrop-filter:var(--glass);
  border:1px solid var(--hair); box-shadow:var(--shadow),var(--hi); color:var(--text);
  display:flex; align-items:center; justify-content:center; transition:transform .12s var(--spring);
}
#fabGps svg{width:22px;height:22px}
#fabGps.active{background:var(--blue);border-color:var(--blue);color:#fff}
#fabGps:active{transform:scale(.9)}

/* ============ Alert banner ============ */
#alertBanner{position:fixed;left:8px;right:8px;top:calc(var(--safe-top) + 96px);z-index:1180;background:linear-gradient(135deg,var(--red),#c62a25);color:#fff;border-radius:14px;padding:12px 14px;font-size:.84rem;font-weight:700;box-shadow:var(--shadow);display:flex;gap:9px;align-items:center;animation:drop .4s}
#alertBanner .x{margin-left:auto;font-size:1.2rem;opacity:.9}

/* ============ Bottom sheet ============ */
#sheetMask{position:fixed;inset:0;z-index:1300;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:.25s}
#sheetMask.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:1310;background:var(--pane-strong);backdrop-filter:var(--glass-strong);-webkit-backdrop-filter:var(--glass-strong);border-radius:26px 26px 0 0;border:1px solid var(--hair);border-bottom:none;max-height:90vh;transform:translateY(105%);transition:transform .44s var(--spring);display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
#sheet.show{transform:translateY(0)}
#sheet .grip{width:38px;height:5px;border-radius:5px;background:rgba(0,0,0,.18);margin:10px auto 2px}
#sheet .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 13px;border-bottom:1px solid var(--hair)}
#sheet .sheet-head h2{font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
#sheet .sheet-body{overflow-y:auto;padding:16px 16px calc(var(--safe-bot) + 24px);-webkit-overflow-scrolling:touch}
.closex{width:32px;height:32px;border-radius:50%;background:var(--card);border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
.closex svg{width:15px;height:15px}

/* ============ Reusable cards ============ */
.card{background:var(--card);border:1px solid var(--hair);border-radius:17px;padding:15px 16px;margin-bottom:11px;box-shadow:var(--hi)}
.card h4{font-size:.94rem;margin-bottom:8px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;letter-spacing:-.01em}
.card p,.card li{font-size:.85rem;color:var(--muted)}
.card ul{list-style:none;margin-top:5px}
.card li{padding:4px 0}
.card li b{color:var(--text)}
.badge{font-size:.68rem;padding:3px 9px;border-radius:20px;font-weight:800;color:#fff}
.pill{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:20px;font-weight:800;margin:2px 3px 0 0;color:#fff}

.hero{background:linear-gradient(135deg,rgba(36,64,124,.08),rgba(255,255,255,.40));border:1px solid rgba(36,64,124,.30);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 12px 34px rgba(36,64,124,.10),var(--hi)}
.hero .kick{font-size:.7rem;color:var(--gold);letter-spacing:2px;font-weight:800;text-transform:uppercase}
.hero .title{font-size:1.36rem;font-weight:800;color:var(--text);margin-top:5px;line-height:1.3;letter-spacing:-.01em}
.hero .why{font-size:.84rem;color:var(--muted);margin-top:7px}
.hero .acts{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.bigbtn{flex:1;min-width:120px;text-align:center;padding:13px;border-radius:14px;font-weight:800;font-size:.87rem;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .14s var(--spring)}
.bigbtn.primary{background:linear-gradient(180deg,#31549c,#1d3568);color:#fff;border:1px solid rgba(224,190,90,.35);box-shadow:0 6px 18px rgba(29,53,104,.40),var(--hi)}
.bigbtn.ghost{background:var(--card);border:1px solid var(--hair);color:var(--text);box-shadow:var(--hi)}
.bigbtn:active{transform:scale(.95)}

/* list rows */
.row{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--hair);border-radius:15px;padding:12px;margin-bottom:9px;box-shadow:var(--hi)}
.row.now{border-color:rgba(36,64,124,.40);background:linear-gradient(135deg,rgba(36,64,124,.07),rgba(255,255,255,.35))}
.row.done{opacity:.5}
.row .lead{width:44px;flex-shrink:0;text-align:center;font-weight:800;font-size:.8rem;color:var(--gold);font-variant-numeric:tabular-nums}
.row .lead .em{font-size:1.4rem}
.row .body{flex:1;min-width:0}
.row .body .t{font-weight:700;font-size:.9rem}
.row .body .d{font-size:.8rem;color:var(--muted);margin-top:2px}
.row .go{flex-shrink:0}
.gobtn{background:var(--blue);color:#fff;border-radius:12px;padding:9px 13px;font-size:.78rem;font-weight:800;white-space:nowrap;box-shadow:0 4px 12px rgba(10,132,255,.35)}
.gobtn.ghost{background:var(--card);border:1px solid var(--hair);color:var(--muted);box-shadow:none}
.chkbtn{background:var(--card);border:1px solid var(--hair);border-radius:20px;padding:8px 14px;font-size:.78rem;font-weight:800;color:var(--muted);white-space:nowrap}
.chkbtn.done{background:var(--green);border-color:var(--green);color:#fff}

.mini-h{font-size:.78rem;color:var(--muted);letter-spacing:1px;font-weight:700;margin:16px 0 8px}

/* nav steps */
.navtot{background:linear-gradient(135deg,rgba(0,122,255,.12),rgba(255,255,255,.40));border:1px solid rgba(0,122,255,.35);border-radius:18px;padding:16px;margin-bottom:14px;text-align:center;box-shadow:0 10px 30px rgba(0,122,255,.10),var(--hi)}
.navtot .big{font-size:1.8rem;font-weight:800;color:var(--text);letter-spacing:-.02em}
.navtot .sub{font-size:.8rem;color:#3a6ea8;margin-top:3px}
.origin-sel{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--hair);border-radius:13px;padding:10px 12px;margin-bottom:13px;font-size:.82rem}
.origin-sel select{flex:1;background:var(--surface);color:var(--text);border:1px solid var(--hair);border-radius:10px;padding:9px;font-size:.82rem;font-family:inherit}
.step{display:flex;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border:none}
.step .num{width:26px;height:26px;flex-shrink:0;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem}
.step .num.fin{background:var(--accent)}
.step .sbody{flex:1;min-width:0}
.step .sbody .st{font-weight:700;font-size:.87rem}
.step .sbody .sm{font-size:.8rem;color:var(--muted);margin-top:2px}
.step .sbody .warn{font-size:.8rem;color:var(--gold);margin-top:3px;font-weight:600}

/* achievements */
.achv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.achv{background:var(--card);border:1px solid var(--hair);border-radius:18px;padding:16px 10px;text-align:center;box-shadow:var(--hi)}
.achv.got{border-color:rgba(184,114,10,.45);background:linear-gradient(135deg,rgba(255,159,10,.14),rgba(255,255,255,.35))}
.achv .emoji{font-size:2rem;filter:grayscale(1);opacity:.35}
.achv.got .emoji{filter:none;opacity:1}
.achv .an{font-size:.82rem;font-weight:800;margin-top:6px}
.achv .ad{font-size:.72rem;color:var(--muted);margin-top:3px;line-height:1.35}
.progwrap{background:var(--card);border:1px solid var(--hair);border-radius:15px;padding:14px 16px;margin-bottom:13px;box-shadow:var(--hi)}
.progbar{height:9px;background:rgba(120,120,128,.18);border-radius:9px;overflow:hidden;margin-top:8px}
.progbar .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:9px;transition:.4s}

/* reminders */
.remind-item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);font-size:.87rem}
.remind-item:last-child{border:none}
.remind-item .ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.8rem}
.remind-item.on .ck{background:var(--green);border-color:var(--green)}
.remind-item.on .lbl{text-decoration:line-through;color:var(--muted)}

/* sim */
.simrow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.simbtn{flex:1;min-width:88px;background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:11px 6px;font-size:.78rem;font-weight:700;text-align:center;box-shadow:var(--hi)}
.simbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 5px 14px rgba(36,64,124,.35)}
input[type=range]{width:100%;accent-color:var(--accent);margin:10px 0}

/* menu list */
.menu-item{display:flex;align-items:center;gap:12px;padding:15px 4px;border-bottom:1px solid var(--line);font-size:.92rem;font-weight:600}
.menu-item:last-child{border:none}
.menu-item .mi{font-size:1.3rem;width:26px;text-align:center}
.menu-item .ch{margin-left:auto;color:var(--muted)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + var(--safe-bot) + 130px);transform:translateX(-50%) translateY(20px);z-index:1400;background:var(--pane-strong);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid rgba(184,114,10,.40);color:var(--text);padding:14px 22px;border-radius:18px;font-size:.88rem;font-weight:700;box-shadow:var(--shadow-lg),var(--hi);opacity:0;pointer-events:none;transition:.3s var(--spring);max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast .em{font-size:1.5rem;display:block;margin-bottom:3px}

/* fallback */
#fallback{position:absolute;top:0;bottom:0;left:0;right:0;z-index:5;background:var(--bg);overflow-y:auto;padding:calc(var(--safe-top) + 120px) 0 calc(var(--tabbar-h) + 120px);-webkit-overflow-scrolling:touch}
#fallback .fb-inner{padding:14px}
#fallback .fb-note{background:var(--surface2);border:1px solid var(--accent);border-radius:12px;padding:11px 13px;font-size:.8rem;color:var(--gold);margin-bottom:13px}

/* ============ 深色模式（19:00–06:00 自動，或手動切換） ============ */
html.dark{
  --bg:#0b0a0f; --surface:#16151c; --surface2:#1f1e27; --line:rgba(255,255,255,.09);
  --text:#f3f1f6; --muted:#9d99ab;
  --accent:#5f83cf; --gold:#ffc24d;
  --red:#ff453a; --blue:#0a84ff;
  --pane:rgba(24,23,30,.62); --pane-strong:rgba(18,17,24,.80);
  --card:rgba(255,255,255,.045); --hair:rgba(255,255,255,.10);
  --hi:inset 0 1px 0 rgba(255,255,255,.10);
  --shadow:0 8px 30px rgba(0,0,0,.55); --shadow-lg:0 22px 55px rgba(0,0,0,.62);
}
html.dark #topbar{background:linear-gradient(180deg,rgba(11,10,15,.78),rgba(11,10,15,.28) 82%,rgba(11,10,15,0))}
html.dark #clock .day{background:rgba(255,194,77,.13)}
html.dark #map,html.dark .leaflet-container{background:#0b0a0f}

/* ---------- 時間引擎 ---------- */
const FEST_YEAR=2026;
let simOffset=null;
function now(){ return simOffset?new Date(simOffset):new Date(); }
function festClock(d){ return {mo:d.getMonth()+1,day:d.getDate(),hm:d.getHours()*60+d.getMinutes(),h:d.getHours(),m:d.getMinutes()}; }
function isFestDayF(f){ return f.mo===7&&(f.day===24||f.day===25); }
function isFestDay(d){ return isFestDayF(festClock(d)); }
function pad(n){return String(n).padStart(2,'0')}
function hm2str(h){return pad(Math.floor(h/60))+':'+pad(h%60)}
function toMin(s){const [h,m]=s.split(':').map(Number);return h*60+m}

const TILE_STYLES={light:'rastertiles/voyager',dark:'rastertiles/dark_all'};
function tileUrl(style){ return 'https://{s}.basemaps.cartocdn.com/'+style+'/{z}/{x}/{y}{r}.png'; }
let themeMode=localStorage.getItem('tenjinTheme')||'auto';
let appliedTheme=null;
function effTheme(){ if(themeMode!=='auto')return themeMode; const h=now().getHours(); return (h>=19||h<6)?'dark':'light'; }
function applyTheme(){
  const t=effTheme(); if(t===appliedTheme)return; appliedTheme=t;
  document.documentElement.classList.toggle('dark',t==='dark');
  const m=document.querySelector('meta[name=theme-color]'); if(m)m.content=t==='dark'?'#0b0a0f':'#f2f1f6';
  if(typeof tileLayer!=='undefined'&&tileLayer)tileLayer.setUrl(tileUrl(TILE_STYLES[t]));
  if(typeof mLayers!=='undefined'&&mLayers.matsuri)buildMatsuriMarkers();
}
function updateThemeBtn(){ const el=document.getElementById('themeIc'); if(el)el.textContent=themeMode==='auto'?'🌗':themeMode==='light'?'☀️':'🌙'; }
function cycleTheme(){
  themeMode=themeMode==='auto'?'light':themeMode==='light'?'dark':'auto';
  try{localStorage.setItem('tenjinTheme',themeMode);}catch(e){}
  appliedTheme=null; applyTheme(); updateThemeBtn();
  toast(themeMode==='auto'?'🌗':themeMode==='light'?'☀️':'🌙','外觀：'+(themeMode==='auto'?'自動（晚上 7 點自動深色）':themeMode==='light'?'固定淺色':'固定深色'));
}

function distM(a,b){ const R=6371000,toR=x=>x*Math.PI/180; const dLat=toR(b.lat-a.lat),dLng=toR(b.lng-a.lng); const s=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
function snapNode(p){ let best=null,bd=1e9; Object.keys(NODES).forEach(k=>{ const d=distM(p,NODES[k]); if(d<bd){bd=d;best=k;} }); return best; }
function dijkstra(src,dst){
  const dist={},prev={}; Object.keys(NODES).forEach(k=>dist[k]=1e9); dist[src]=0;
  const pq=new Set(Object.keys(NODES));
  while(pq.size){
    let u=null,ud=1e9; pq.forEach(k=>{ if(dist[k]<ud){ud=dist[k];u=k;} });
    if(u===null)break; pq.delete(u); if(u===dst)break;
    ADJ[u].forEach(a=>{ const w=EDGES[a.ei][2]; if(dist[u]+w<dist[a.to]){ dist[a.to]=dist[u]+w; prev[a.to]={node:u,ei:a.ei}; } });
  }
  if(dist[dst]>=1e9)return null;
  const path=[]; let cur=dst; while(cur!==src){ const p=prev[cur]; if(!p)return null; path.unshift({from:p.node,to:cur,ei:p.ei}); cur=p.node; }
  return path; // 陣列 of edges（含方向）
}
function edgePolyline(seg){
  const e=EDGES[seg.ei];
  const g=EDGE_GEOM[e[0]+'|'+e[1]];            // 實道路幾何（建置時以徒歩路徑API取得）
  if(g&&g.length){ return (seg.from===e[0])?g.slice():g.slice().reverse(); }
  // fallback：直線＋估計中間點
  const via=e[4]||[]; const a=NODES[seg.from],b=NODES[seg.to];
  const mids=(seg.from===e[0])?via:[...via].reverse();
  return [[a.lat,a.lng],...mids.map(m=>[m[0],m[1]]),[b.lat,b.lng]];
}

  });

function rebuildCrowd(){
  if(!mLayers.crowd)return; mLayers.crowd.clearLayers();
  const f=festClock(now());
  CROWD.forEach(z=>{ const lv=crowdLevelAt(z,f),col=LV[lv].c;
    const circle=L.circle([z.lat,z.lng],{radius:z.r,color:col,fillColor:col,fillOpacity:lv==='green'?.05:(z.faint?.10:.22),weight:lv==='green'?1:2,dashArray:z.faint?'6 6':null});
    circle.on('click',()=>openCrowd(z)); mLayers.crowd.addLayer(circle); });
}
function rebuildRoute(){
  if(!mLayers.route)return; mLayers.route.clearLayers();
  const activeIdx=currentRouteIndex();
  const shown=ROUTE.filter(r=>routeDay==='both'||r.d===routeDay);
  const groups=[];
  shown.forEach(r=>{ const last=groups[groups.length-1]; if(last&&last[0].lat===r.lat&&last[0].lng===r.lng)last.push(r); else groups.push([r]); });
  groups.forEach(g=>{
    const gi=ROUTE.indexOf(g[0]); const nums=g.map(x=>ROUTE.indexOf(x)+1);
    const label=g.length>1?nums[0]+'–'+nums[nums.length-1]:String(gi+1);
    const allDone=g.every(x=>isChecked(x.id));
    const activeHere=g.some(x=>ROUTE.indexOf(x)===activeIdx);
    const isHanabiSpot=g.some(x=>x.type==='hanabi'); let mk;
    if(isHanabiSpot){
      mk=L.marker([g[0].lat,g[0].lng],{zIndexOffset:1600,icon:L.divIcon({className:'',html:`<div style="position:relative"><div style="background:#ff453a;border:3px solid #fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 10px rgba(0,0,0,.30)">🎆</div><div style="position:absolute;top:38px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#ff453a;color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:9px;box-shadow:0 1px 4px rgba(0,0,0,.30)">我的觀賞點</div></div>`,iconSize:[36,36],iconAnchor:[18,18]})});
    }else{ let cls='route-dot'; if(activeHere)cls+=' active'; else if(allDone)cls+=' done'; mk=L.marker([g[0].lat,g[0].lng],{zIndexOffset:1000,icon:L.divIcon({className:'',html:`<div class="${cls}">${allDone?'✓':label}</div>`,iconSize:[27,27],iconAnchor:[13,13]})}); }
    mk.on('click',()=>openRouteGroup(g)); mLayers.route.addLayer(mk);
  });
  const days=routeDay==='both'?[24,25]:[routeDay];
  days.forEach(day=>{ const seg=ROUTE.filter(r=>r.d===day).map(r=>[r.lat,r.lng]); if(seg.length>1)mLayers.route.addLayer(L.polyline(seg,{color:'#0a9fbe',weight:3,opacity:.6,dashArray:'6 7'})); });
}

/* =====================================================================
   祭典導航
   ===================================================================== */
function navTo(lat,lng,name,checkinId){
  closeSheet();
  const dst=snapNode({lat,lng});
  const startNodeId=gpsLatLng?snapNode(gpsLatLng):manualOrigin;
  const path=dijkstra(startNodeId,dst);
  // 組合座標與步驟
  const pts=[]; const steps=[]; let totalMin=0;
  const startCoord=gpsLatLng?gpsLatLng:NODES[startNodeId];
  if(gpsLatLng){ pts.push([gpsLatLng.lat,gpsLatLng.lng]); const legM=distM(gpsLatLng,NODES[startNodeId]); totalMin+=Math.max(1,Math.round(legM/75)); steps.push({t:`從你的位置出發，前往 ${NODES[startNodeId].name}`,m:`約 ${fmtM(legM)}`,warn:''}); }
  else { steps.push({t:`從「${NODES[startNodeId].name}」出發`,m:'（未定位，可在下方改起點或開定位更準）',warn:''}); }
  if(path&&path.length){
    path.forEach(seg=>{ const e=EDGES[seg.ei]; const line=edgePolyline(seg); line.forEach(pt=>pts.push(pt)); totalMin+=e[2];
      const note=e[3]||''; const warn=note.indexOf('⚠️')>=0||note.indexOf('★')>=0?note:''; const desc=warn?'':note;
      steps.push({t:`${NODES[seg.from].name} → ${NODES[seg.to].name}`,m:`約 ${e[2]} 分${desc?' · '+desc:''}`,warn}); });
  } else if(startNodeId!==dst){ pts.push([NODES[startNodeId].lat,NODES[startNodeId].lng],[NODES[dst].lat,NODES[dst].lng]); }
  // 終點 leg（節點 → 實際目的地）
  const lastNode=NODES[dst]; const finLeg=distM(lastNode,{lat,lng});
  if(finLeg>40){ pts.push([lat,lng]); totalMin+=Math.max(1,Math.round(finLeg/75)); }
  else { pts.push([lat,lng]); }
  totalMin=Math.max(totalMin,1);
  drawNav(pts,{lat,lng},name);
  navSession={toName:name,toLat:lat,toLng:lng,checkinId,totalMin};
  if(gpsLatLng)followMode=true;
  showNavBanner();
  openNavSheet(steps,name,totalMin,startNodeId,checkinId);
}
function drawNav(pts,dest,name){
  if(!navLayer){ return; }
  navLayer.clearLayers();
  if(fallbackMode)exitFallback();
  // 白色描邊 + 藍線（Apple 導航風）
  navLayer.addLayer(L.polyline(pts,{color:'#ffffff',weight:9,opacity:.9,lineJoin:'round',lineCap:'round'}));
  navLayer.addLayer(L.polyline(pts,{color:'#007aff',weight:5,opacity:1,lineJoin:'round',lineCap:'round'}));
  navLayer.addLayer(L.marker([dest.lat,dest.lng],{zIndexOffset:2200,icon:L.divIcon({className:'',html:`<div class="nav-end"><span>🚩</span></div>`,iconSize:[34,34],iconAnchor:[17,34]})}));
  if(map){ try{ map.fitBounds(L.latLngBounds(pts),{paddingTopLeft:[40,150],paddingBottomRight:[40,220]}); }catch(e){} }
}
function openNavSheet(steps,name,totalMin,startNodeId,checkinId){
  const originOptions=Object.keys(NODES).map(k=>`<option value="${k}" ${k===startNodeId?'selected':''}>${NODES[k].name}</option>`).join('');
  const stepHtml=steps.map((s,i)=>{ const fin=i===steps.length-1; return `<div class="step"><div class="num ${fin?'fin':''}">${i+1}</div><div class="sbody"><div class="st">${s.t}</div>${s.m?`<div class="sm">${s.m}</div>`:''}${s.warn?`<div class="warn">${s.warn}</div>`:''}</div></div>`; }).join('');
  openSheet('🧭 帶我去 · '+name,
   `<div class="navtot"><div class="big">約 ${totalMin} 分</div><div class="sub">🚶 推薦步行路線（祭典特化 · 已避開管制站）</div></div>
    ${gpsLatLng?'':`<div class="origin-sel">📍 你現在在：<select id="originSel">${originOptions}</select></div>`}
    <div class="card"><h4>逐段指引</h4>${stepHtml}</div>
    <p style="font-size:.78rem;color:var(--muted);text-align:center">藍線已畫在地圖上。${gpsLatLng?'抵達目的地 60m 內會自動打卡 ✓':'開啟定位（左下 📍）可即時顯示剩餘距離與自動打卡。'}</p>`);
  const sel=document.getElementById('originSel');
  if(sel)sel.onchange=()=>{ manualOrigin=sel.value; navTo(navSession.toLat,navSession.toLng,navSession.toName,navSession.checkinId); };
}
function showNavBanner(){
  const b=document.getElementById('navBanner'); if(!navSession){ b.classList.add('hidden'); return; }
  let meta='🚶 推薦路線 · 約 '+navSession.totalMin+' 分';
  if(gpsLatLng){ const d=distM(gpsLatLng,{lat:navSession.toLat,lng:navSession.toLng}); meta=`還有 ${fmtM(d)} · 約 ${Math.max(1,Math.round(d/75))} 分`; }
  b.innerHTML=`<span class="ar">${ICONS.navarrow}</span><div class="mid"><div class="to">往 ${navSession.toName}</div><div class="meta">${meta}</div></div><button class="stop" id="navStop">結束</button>`;
  b.classList.remove('hidden');
  document.getElementById('navStop').onclick=stopNav;
  b.querySelector('.mid').onclick=()=>{ if(gpsLatLng&&map){ followMode=true; map.panTo([gpsLatLng.lat,gpsLatLng.lng],{animate:true}); } };
}
function stopNav(){ navSession=null; followMode=false; if(navLayer)navLayer.clearLayers(); document.getElementById('navBanner').classList.add('hidden'); }
function navArrivalCheck(){
  if(!navSession||!gpsLatLng)return;
  const d=distM(gpsLatLng,{lat:navSession.toLat,lng:navSession.toLng});
  if(d<=60){
    toast('🎉','抵達 '+navSession.toName+'！');
    if(navSession.checkinId&&!isChecked(navSession.checkinId)){ setCheck(navSession.checkinId,true); }
    store.flags=store.flags||{}; store.flags.navArrived=1; saveStore();
    checkAchievements(); rebuildRoute(); updateAchvBadge(); stopNav();
  } else showNavBanner();
}

function inAppBrowser(){ const ua=navigator.userAgent||''; return window.self!==window.top||/FBAN|FBAV|Instagram|Line|MicroMessenger|Twitter|KAKAOTALK|snapchat/i.test(ua); }
function toggleGps(){
  const btn=document.getElementById('fabGps');
  if(gpsWatch){ navigator.geolocation.clearWatch(gpsWatch); gpsWatch=null; btn.classList.remove('active'); if(gpsMarker&&map)map.removeLayer(gpsMarker); gpsMarker=null; gpsLatLng=null; gpsCentered=false; followMode=false; stopHeading(); toast('📍','已關閉定位'); return; }
  if(!navigator.geolocation){ toast('⚠️','此裝置不支援定位，可手動打卡'); return; }
  if(!window.isSecureContext){ gpsHelp('insecure'); return; }
  // Chrome 對曾拒絕過的網站會「靜默封鎖」不再跳詢問視窗 — 先查權限狀態直接給解法
  if(navigator.permissions&&navigator.permissions.query){
    navigator.permissions.query({name:'geolocation'}).then(st=>{
      if(st.state==='denied'){ btn.classList.remove('active'); gpsHelp(inAppBrowser()?'inapp':'denied'); }
    }).catch(()=>{});
  }
  btn.classList.add('active'); toast('📡','定位中…請允許位置權限');
  startHeading();
  navigator.geolocation.getCurrentPosition(pos=>{ gpsLatLng={lat:pos.coords.latitude,lng:pos.coords.longitude}; placeGps(); startWatch(); },err=>{ btn.classList.remove('active'); gpsError(err); },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
function startWatch(){ gpsWatch=navigator.geolocation.watchPosition(pos=>{ gpsLatLng={lat:pos.coords.latitude,lng:pos.coords.longitude}; placeGps(); },()=>{},{enableHighAccuracy:true,maximumAge:5000,timeout:20000}); }
function gpsError(err){ if(err.code===1)gpsHelp(inAppBrowser()?'inapp':'denied'); else toast('📍',(err.code===2?'目前收不到定位訊號':'定位逾時')+' — 可改用手動打卡'); }
function gpsHelp(kind){

  let head;
  if(kind==='inapp')head=`<div class="card" style="border-color:var(--gold)"><h4>📲 你可能在 App 內建瀏覽器開啟</h4><p>在 LINE／IG／FB 等 App 內開網頁時，系統會直接擋掉定位。</p><p style="margin-top:6px;color:var(--text)"><b>解法：</b>點右上「⋯」→「在 Safari / Chrome 開啟」，再按一次定位。</p></div>`;
  else if(kind==='insecure')head=`<div class="card" style="border-color:var(--gold)"><h4>🔒 需要 https 網頁</h4><p>目前網址不是 https，瀏覽器會禁止定位。請用 GitHub Pages 的 https 網址開啟。</p></div>`;
  else head=`<div class="card" style="border-color:var(--gold)"><h4>📍 定位被封鎖（沒跳詢問視窗＝之前拒絕過，瀏覽器會記住並靜默封鎖）</h4><ul style="margin-top:6px">
    <li><b>Chrome（Android）</b>：網址列左邊 🔒/⚙ → 權限 → 位置 → 改「允許」→ 重新整理。若選項是灰的：手機 設定 → 應用程式 → Chrome → 權限 → 位置 → 允許</li>
    <li><b>Chrome（iOS）</b>：iPhone 設定 → Chrome → 位置 → 「使用 App 期間」</li>
    <li><b>iOS Safari</b>：設定 → 隱私權 → 定位服務 → 開啟，Safari 設「使用 App 期間」</li>
    <li>改完後回來<b>重新整理頁面</b>，再按一次 📍</li></ul></div>`;
  openSheet('📍 定位無法使用',head+common);

/* ---------- 指北：藍點方向扇形（羅盤） ---------- */
let headingOn=false;
function onHeading(e){
  let h=null;
  if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;           // iOS
  else if(e.absolute&&typeof e.alpha==='number')h=(360-e.alpha)%360;              // Android（絕對方位）
  if(h===null)return;
  const el=document.querySelector('.gps-cone');
  if(el){ el.classList.add('on'); el.style.transform=`rotate(${Math.round(h)}deg)`; }
}
function startHeading(){
  if(headingOn||!window.DeviceOrientationEvent)return; headingOn=true;
  if(typeof DeviceOrientationEvent.requestPermission==='function'){               // iOS 13+ 需在手勢中請求
    DeviceOrientationEvent.requestPermission().then(s=>{ if(s==='granted')window.addEventListener('deviceorientation',onHeading,true); }).catch(()=>{});
  } else {
    window.addEventListener('deviceorientationabsolute',onHeading,true);
    window.addEventListener('deviceorientation',onHeading,true);
  }
}
function stopHeading(){
  if(!headingOn)return; headingOn=false;
  window.removeEventListener('deviceorientation',onHeading,true);
  window.removeEventListener('deviceorientationabsolute',onHeading,true);
}
function autoCheckinNearby(){ if(!gpsLatLng)return; ROUTE.forEach(r=>{ if(!isChecked(r.id)&&distM(gpsLatLng,{lat:r.lat,lng:r.lng})<=100){ setCheck(r.id,true); toast('✓','自動打卡：'+r.title); checkAchievements(); rebuildRoute(); updateAchvBadge(); } }); }

/* ---------- 離線地圖：預先下載祭典區域圖磚（淺色＋深色 z13–17） ---------- */
const OFF_KEY='tenjinOfflineAt';
const OFF_BBOX={minLat:34.684,maxLat:34.712,minLng:135.496,maxLng:135.538}; // 淀屋橋～京橋～桜ノ宮
const TILE_CACHE_NAME='tenjin-tiles-v1';
let offRunning=false,offCancel=false;
function lng2x(lng,z){ return Math.floor((lng+180)/360*Math.pow(2,z)); }
function lat2y(lat,z){ const r=lat*Math.PI/180; return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*Math.pow(2,z)); }
function offlineTileUrls(){
  // 一律用 a. 子網域當快取鍵；service worker 會把 b/c/d 的請求正規化成 a. 再比對
  const urls=[],r=(L.Browser&&L.Browser.retina)?'@2x':'';
  [13,14,15,16,17].forEach(z=>{
    const x0=lng2x(OFF_BBOX.minLng,z),x1=lng2x(OFF_BBOX.maxLng,z);
    const y0=lat2y(OFF_BBOX.maxLat,z),y1=lat2y(OFF_BBOX.minLat,z);
    for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)
      [TILE_STYLES.light,TILE_STYLES.dark].forEach(stl=>urls.push(`https://a.basemaps.cartocdn.com/${stl}/${z}/${x}/${y}${r}.png`));
  });
  return urls;
}
async function downloadOffline(){
  if(!window.caches){ toast('⚠️','此開啟方式不支援離線儲存 — 請用 https 網站網址開啟'); return; }
  if(offRunning)return; offRunning=true; offCancel=false;
  const urls=offlineTileUrls(); let done=0,fail=0;
  const bar=document.getElementById('offFill'),lbl=document.getElementById('offLbl'),btn=document.getElementById('offGo');
  if(btn){btn.textContent='⏸ 取消下載';btn.onclick=()=>{offCancel=true;};}
  const cache=await caches.open(TILE_CACHE_NAME);
  const upd=()=>{ if(bar)bar.style.width=Math.round((done+fail)/urls.length*100)+'%'; if(lbl)lbl.textContent=offCancel?'已取消':`下載中 ${done+fail}/${urls.length}（失敗 ${fail}）`; };
  const worker=async()=>{ while(urls.length&&!offCancel){ const u=urls.shift(); try{ if(!await cache.match(u)){ const resp=await fetch(u,{mode:'cors'}); if(resp.ok)await cache.put(u,resp); else fail++; done++; } else done++; }catch(e){ fail++; } upd(); } };
  await Promise.all([0,1,2,3,4,5,6,7].map(worker));
  offRunning=false;
  if(!offCancel){ try{localStorage.setItem(OFF_KEY,String(Date.now()));}catch(e){} toast('🗺️','離線地圖下載完成！現場沒網路也能看地圖'); openOfflineMap(); }
}
function openOfflineMap(){
  if(!window.caches){ openSheet('🗺️ 離線地圖',`<div class="card" style="border-color:var(--red)"><h4>⚠️ 此開啟方式不支援離線地圖</h4><p style="color:var(--text)">你目前是以「本機檔案」開啟本頁（網址不是 https）。瀏覽器在這種模式下會停用離線儲存、定位、加到主畫面等功能。<b>請改用 GitHub Pages 的 https 網址開啟</b>，一切就能正常運作。</p></div>`); return; }
  const at=parseInt(localStorage.getItem(OFF_KEY)||'0',10);
  const status=at?`✅ 已於 ${new Date(at).getMonth()+1}/${new Date(at).getDate()} 下載完成`:'尚未下載';
  openSheet('🗺️ 離線地圖',
   `<div class="card" style="border-color:var(--gold)"><h4>為什麼要先下載</h4><p style="color:var(--text)">祭典當天百萬人擠爆基地台，地圖圖磚常載不出來。<b>出發前在飯店 Wi-Fi 按一次</b>，把會場一帶（淀屋橋～京橋～桜ノ宮）的日夜兩套地圖存進手機，現場斷網照樣能看。</p></div>
    <div class="progwrap"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>${status}</b></div><div class="progbar"><div class="fill" id="offFill" style="width:${at?100:0}%"></div></div><p id="offLbl" style="font-size:.78rem;color:var(--muted);margin-top:6px">約 500 張圖磚 · 10–20 MB · 建議在 Wi-Fi 下進行</p></div>
    <button class="bigbtn primary" id="offGo" style="width:100%">${at?'🔄 重新下載':'⬇️ 開始下載'}</button>`);
  document.getElementById('offGo').onclick=downloadOffline;
}
