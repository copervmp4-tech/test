<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1117">
<title>大阪天神祭 情報地圖</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
/* ── Reset & Base ── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0e1117; --surface:#161b22; --surface2:#1f2630; --line:#2a323d;
  --text:#e8edf2; --muted:#8b98a8; --accent:#e8552f; --accent2:#ffb84d;
  --green:#2ea043; --yellow:#d9a520; --red:#e5484d;
  --blue:#3b82f6; --purple:#a855f7; --route:#22d3ee;
  --shadow:0 4px 18px rgba(0,0,0,.45);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  background:var(--bg); color:var(--text); line-height:1.5;
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
}
button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none}
.hidden{display:none!important}

/* ── Top status bar ── */
#topbar{
  position:fixed; top:0; left:0; right:0; z-index:1200;
  background:var(--surface); border-bottom:1px solid var(--line);
  padding:calc(var(--safe-top) + 8px) 12px 8px; box-shadow:var(--shadow);
}
#topbar .row1{display:flex;align-items:center;gap:8px;justify-content:space-between}
#clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.15rem;letter-spacing:.5px}
#clock .day{font-size:.72rem;color:var(--accent2);font-weight:600;margin-left:6px}
#taskLine{margin-top:5px;display:flex;align-items:center;gap:8px;font-size:.86rem}
#taskLine .tag{font-size:.64rem;background:var(--accent);color:#fff;padding:2px 7px;border-radius:5px;font-weight:700;flex-shrink:0}
#taskLine .txt{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#countdown{margin-top:4px;font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
#countdown b{color:var(--accent2);font-variant-numeric:tabular-nums}
#topTools{display:flex;gap:6px}
.iconbtn{width:34px;height:34px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1rem}
.iconbtn:active{background:var(--accent)}

/* ── Map ── */
#map{position:absolute;top:0;bottom:0;left:0;right:0;background:#e7e5e0;z-index:1}
.leaflet-container{background:#e7e5e0;font-family:inherit}
.leaflet-popup-content-wrapper{background:var(--surface2);color:var(--text);border-radius:12px;box-shadow:var(--shadow)}
.leaflet-popup-tip{background:var(--surface2)}
.leaflet-popup-content{margin:12px 14px;font-size:.85rem;line-height:1.55}
.leaflet-popup-content b{color:var(--accent2)}
.leaflet-bar a{background:var(--surface2);color:var(--text);border-color:var(--line)}
.leaflet-control-attribution{background:rgba(15,18,24,.7)!important;color:var(--muted)!important;font-size:9px!important}
.leaflet-control-attribution a{color:var(--muted)!important}

/* custom markers */
.pin{display:flex;align-items:center;justify-content:center;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5);font-weight:700}
.pin span{transform:rotate(45deg);font-size:12px;line-height:1}
.route-dot{width:26px;height:26px;border-radius:50%;background:var(--route);border:3px solid #fff;color:#04222b;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.route-dot.active{background:var(--accent);color:#fff;animation:pulse 1.6s infinite}
.route-dot.done{background:var(--green);color:#fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,85,47,.6)}70%{box-shadow:0 0 0 14px rgba(232,85,47,0)}100%{box-shadow:0 0 0 0 rgba(232,85,47,0)}}
.gps-dot{width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 6px rgba(59,130,246,.25),0 2px 6px rgba(0,0,0,.5)}

/* ── Fallback text mode ── */
#fallback{position:absolute;top:0;bottom:0;left:0;right:0;z-index:5;background:var(--bg);overflow-y:auto;padding:0 0 120px;-webkit-overflow-scrolling:touch}
#fallback .fb-inner{padding:14px}
#fallback .fb-note{background:var(--surface2);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:.78rem;color:var(--accent2);margin-bottom:12px}
.fb-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.fb-card h3,.fb-card h4{font-size:.95rem;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.fb-card .badge{font-size:.62rem;padding:2px 7px;border-radius:20px;font-weight:700}
.fb-card ul{list-style:none;font-size:.82rem}
.fb-card li{padding:3px 0;border-bottom:1px dashed var(--line);color:var(--muted)}
.fb-card li:last-child{border:none}
.fb-card li b{color:var(--text)}
.fb-card p{font-size:.82rem;color:var(--muted)}

/* ── Layer control panel (bottom) ── */
#layerBar{
  position:fixed; left:0; right:0; bottom:0; z-index:1150;
  background:var(--surface); border-top:1px solid var(--line);
  padding:8px 8px calc(var(--safe-bot) + 8px); box-shadow:0 -4px 18px rgba(0,0,0,.4);
}
#layerScroll{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#layerScroll::-webkit-scrollbar{display:none}
.layer-chip{flex-shrink:0;display:flex;align-items:center;gap:6px;background:var(--surface2);border:1.5px solid var(--line);border-radius:22px;padding:8px 13px;font-size:.8rem;font-weight:600;white-space:nowrap;transition:.15s}
.layer-chip .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.layer-chip.off{opacity:.4;filter:grayscale(.6)}
.layer-chip:active{transform:scale(.95)}

/* ── Floating action buttons ── */
#fabWrap{position:fixed;right:12px;z-index:1140;bottom:calc(var(--safe-bot) + 74px);display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.fab{border-radius:28px;box-shadow:var(--shadow);font-weight:700;display:flex;align-items:center;gap:7px;justify-content:center}
.fab.main{background:var(--accent);color:#fff;padding:14px 18px;font-size:.92rem}
.fab.round{width:48px;height:48px;background:var(--surface2);border:1px solid var(--line);font-size:1.2rem;padding:0}
.fab.round.active{background:var(--blue)}
.fab:active{transform:scale(.94)}

/* ── Bottom sheet / modal ── */
#sheetMask{position:fixed;inset:0;z-index:1300;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.25s}
#sheetMask.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:1310;background:var(--surface);border-radius:20px 20px 0 0;max-height:86vh;transform:translateY(105%);transition:transform .3s cubic-bezier(.25,.9,.3,1);display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.5)}
#sheet.show{transform:translateY(0)}
#sheet .grip{width:42px;height:5px;border-radius:5px;background:var(--line);margin:10px auto 4px}
#sheet .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px;border-bottom:1px solid var(--line)}
#sheet .sheet-head h2{font-size:1.05rem}
#sheet .sheet-body{overflow-y:auto;padding:14px 16px calc(var(--safe-bot) + 20px);-webkit-overflow-scrolling:touch}
.closex{width:32px;height:32px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--muted)}

/* generic components inside sheet */
.rec-card{background:linear-gradient(135deg,#1f2630,#161b22);border:1px solid var(--accent);border-radius:14px;padding:15px;margin-bottom:12px}
.rec-card .why{font-size:.8rem;color:var(--muted);margin-top:6px}
.rec-card .title{font-size:1.15rem;font-weight:800;color:var(--accent2)}
.rec-card .go{margin-top:10px;background:var(--accent);color:#fff;padding:8px 14px;border-radius:8px;font-weight:700;font-size:.82rem;display:inline-block}
.mini-h{font-size:.72rem;color:var(--muted);letter-spacing:1px;margin:14px 0 7px}

.route-item{display:flex;gap:10px;padding:11px;border-radius:12px;background:var(--surface2);margin-bottom:8px;border:1px solid var(--line)}
.route-item.now{border-color:var(--accent);background:linear-gradient(135deg,#241a17,#1f2630)}
.route-item.done{opacity:.6}
.route-item .rtime{font-weight:800;font-size:.82rem;color:var(--accent2);flex-shrink:0;width:52px;font-variant-numeric:tabular-nums}
.route-item .rmain{flex:1;min-width:0}
.route-item .rmain .rt{font-weight:700;font-size:.9rem}
.route-item .rmain .rd{font-size:.76rem;color:var(--muted);margin-top:2px}
.route-item .rchk{flex-shrink:0}
.chkbtn{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:6px 11px;font-size:.72rem;font-weight:700;color:var(--muted)}
.chkbtn.done{background:var(--green);border-color:var(--green);color:#fff}

.achv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.achv{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
.achv.got{border-color:var(--accent2);background:linear-gradient(135deg,#2a2418,#1f2630)}
.achv .emoji{font-size:1.9rem;filter:grayscale(1);opacity:.4}
.achv.got .emoji{filter:none;opacity:1}
.achv .an{font-size:.82rem;font-weight:700;margin-top:5px}
.achv .ad{font-size:.66rem;color:var(--muted);margin-top:3px;line-height:1.35}
.achv .prog{font-size:.66rem;color:var(--accent2);margin-top:4px;font-weight:700}

.remind-item{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.86rem}
.remind-item:last-child{border:none}
.remind-item .ck{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.8rem}
.remind-item.on .ck{background:var(--green);border-color:var(--green)}
.remind-item.on .lbl{text-decoration:line-through;color:var(--muted)}

.info-block{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.info-block h4{font-size:.9rem;margin-bottom:6px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.info-block .badge{font-size:.6rem;padding:2px 7px;border-radius:20px;font-weight:700}
.info-block p,.info-block li{font-size:.82rem;color:var(--muted)}
.info-block ul{list-style:none;margin-top:4px}
.info-block li{padding:3px 0}
.info-block li b{color:var(--text)}
.pill{display:inline-block;font-size:.62rem;padding:2px 8px;border-radius:20px;font-weight:700;margin:2px 3px 0 0}

/* time simulator */
#simPanel .simrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.simbtn{flex:1;min-width:70px;background:var(--surface2);border:1.5px solid var(--line);border-radius:10px;padding:9px 6px;font-size:.72rem;font-weight:700;text-align:center}
.simbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
#simSlider{width:100%;margin:8px 0}
input[type=range]{accent-color:var(--accent)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--safe-bot) + 150px);transform:translateX(-50%) translateY(20px);z-index:1400;background:var(--surface2);border:1px solid var(--accent2);color:var(--text);padding:12px 18px;border-radius:14px;font-size:.86rem;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.3s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast .em{font-size:1.4rem;display:block;margin-bottom:3px}

/* alert banner */
#alertBanner{position:fixed;left:8px;right:8px;top:calc(var(--safe-top) + 142px);z-index:1180;background:linear-gradient(135deg,var(--red),#b02a2f);color:#fff;border-radius:12px;padding:11px 14px;font-size:.82rem;font-weight:600;box-shadow:var(--shadow);display:flex;gap:9px;align-items:center;animation:slidein .4s}
@keyframes slidein{from{transform:translateY(-14px);opacity:0}to{transform:translateY(0);opacity:1}}
#alertBanner .x{margin-left:auto;font-size:1.2rem;opacity:.9}

/* route day segmented control */
#routeDayCtl{position:fixed;left:8px;top:calc(var(--safe-top) + 96px);z-index:1160;display:flex;align-items:center;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 5px;box-shadow:var(--shadow);font-size:.72rem}
#routeDayCtl .rdlabel{color:var(--muted);font-weight:700;padding:0 3px}
#routeDayCtl button{padding:5px 9px;border-radius:14px;font-weight:700;color:var(--muted)}
#routeDayCtl button.on{background:var(--route);color:#04222b}
</style>
</head>
<body>

<!-- ── TOP BAR ── -->
<div id="topbar">
  <div class="row1">
    <div id="clock">--:--<span class="day"></span></div>
    <div id="topTools">
      <button class="iconbtn" id="btnSim" title="時間模擬">🕒</button>
      <button class="iconbtn" id="btnRemind" title="提醒清單">🎒</button>
      <button class="iconbtn" id="btnAchv" title="成就集章">🏅</button>
    </div>
  </div>
  <div id="taskLine"><span class="tag">任務</span><span class="txt">載入中…</span></div>
  <div id="countdown"></div>
</div>

<!-- ── MAP ── -->
<div id="map"></div>

<!-- ── FALLBACK TEXT MODE ── -->
<div id="fallback" class="hidden"><div class="fb-inner">
  <div class="fb-note">📡 地圖圖磚載入失敗（現場網路壅塞）— 已切換為<b>文字情報模式</b>。以下依<b id="fbTime">目前時刻</b>提供重點。<button id="fbRetry" style="margin-left:6px;color:var(--accent2);text-decoration:underline">重試地圖</button></div>
  <div id="fbContent"></div>
</div></div>

<!-- ── ROUTE DAY CONTROL ── -->
<div id="routeDayCtl">
  <span class="rdlabel">🧭 路線</span>
  <button data-rd="24">7/24</button>
  <button data-rd="25">7/25</button>
  <button data-rd="both">兩日</button>
</div>

<!-- ── ALERT BANNER ── -->
<div id="alertBanner" class="hidden"></div>

<!-- ── LAYER BAR ── -->
<div id="layerBar"><div id="layerScroll"></div></div>

<!-- ── FABs ── -->
<div id="fabWrap">
  <button class="fab round" id="fabGps" title="定位">📍</button>
  <button class="fab round" id="fabRoute" title="我的路線">🧭</button>
  <button class="fab main" id="fabWhere">現在去哪 ➜</button>
</div>

<!-- ── BOTTOM SHEET ── -->
<div id="sheetMask"></div>
<div id="sheet">
  <div class="grip"></div>
  <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="closex" id="sheetClose">✕</button></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<!-- ── TOAST ── -->
<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
/* ============================================================
   大阪天神祭 情報地圖  —  單檔 webapp
   ============================================================ */

/* ---------- 時間引擎（支援模擬） ---------- */
const FEST_YEAR = 2026;
let simOffset = null; // 若非 null，以此毫秒作為「現在」

function now(){ return simOffset ? new Date(simOffset) : new Date(); }
function festClock(d){
  return { mo:d.getMonth()+1, day:d.getDate(), hm:d.getHours()*60+d.getMinutes(), h:d.getHours(), m:d.getMinutes() };
}
function isFestDay(d){ const f=festClock(d); return f.mo===7 && (f.day===24||f.day===25); }
function isFestDayF(f){ return f.mo===7 && (f.day===24||f.day===25); }
function pad(n){return String(n).padStart(2,'0')}
function hm2str(h){return pad(Math.floor(h/60))+':'+pad(h%60)}
function toMin(s){const [h,m]=s.split(':').map(Number);return h*60+m}

/* ---------- 圖層定義 ---------- */
const LAYERS = {
  matsuri:{name:'祭事',   emoji:'⛩️', color:'#e8552f', on:true},
  yatai:  {name:'屋台',   emoji:'🍢', color:'#ffb84d', on:false},
  hanabi: {name:'花火觀賞',emoji:'🎆', color:'#a855f7', on:true},
  station:{name:'車站',   emoji:'🚉', color:'#3b82f6', on:false},
  crowd:  {name:'人潮預警',emoji:'🔥', color:'#e5484d', on:false},
  route:  {name:'我的路線',emoji:'🧭', color:'#22d3ee', on:true},
};

/* ---------- 祭事層 ---------- */
const MATSURI = [
  {id:'tenmangu', name:'大阪天滿宮', lat:34.6956, lng:135.5127, emoji:'⛩️',
   sched:[
     {d:24,t:'18:40',x:'催太鼓 宮入'},
     {d:24,t:'19:00',x:'獅子舞 宮入'},
     {d:24,t:'~19:30',x:'宵宮結束（散場）'},
     {d:25,t:'14:00',x:'本宮祭'},
     {d:25,t:'15:30',x:'陸渡御 出發'},
   ], note:'神事主場。7/24 宵宮 18:30–19:45 境內爆滿。'},
  {id:'okawa-fune', name:'大川 · 船渡御', lat:34.6985, lng:135.5188, emoji:'⛵',
   sched:[{d:25,t:'18:00–21:00',x:'船渡御（約 100 艘）'}],
   note:'御鳳輦與供奉船沿大川往返，與花火同時進行。'},
  {id:'hanabi-zone', name:'花火施放帶', lat:34.6975, lng:135.5205, emoji:'🎆',
   sched:[{d:25,t:'19:30–20:50',x:'奉納花火 約 3000 發'}],
   note:'施放帶：櫻之宮公園～川崎公園（造幣局旁）大川一帶。⚠️ 7/24 沒有花火。'},
];

/* ---------- 屋台層（範圍色塊） ---------- */
const YATAI = [
  {id:'y-shoutengai', name:'天滿宮境內＋天神橋筋商店街',
   poly:[[34.6916,135.5102],[34.6916,135.5113],[34.6952,135.5119],[34.6962,135.5134],[34.6972,135.5124],[34.7005,135.5114],[34.7005,135.5103]],
   color:'#ffb84d', level:'密度最高',
   info:'僅天三以南有屋台（本圖沿天神橋筋商店街一丁目～三丁目＋天滿宮境內示意）。宵宮 15:00 起／本宮 12:00–22:00，尖峰 17:00–20:00。'},
  {id:'y-okawa', name:'大川沿岸（東岸最密）',
   poly:[[34.6968,135.5165],[34.7050,135.5195],[34.7060,135.5210],[34.6975,135.5185]],
   color:'#e8a33d', level:'邊吃邊看花火',
   info:'東岸最密、櫻之宮公園南側。下午開張，可邊吃邊等花火。'},
  {id:'y-minamitemma', name:'南天滿公園（天滿橋旁）',
   poly:[[34.6905,135.5148],[34.6905,135.5170],[34.6922,135.5172],[34.6922,135.5148]],
   color:'#d98a2d', level:'規模較小',
   info:'天滿橋旁，規模較小，人潮相對緩和。'},
];

/* ---------- 花火觀賞層（三級） ---------- */
const HANABI = [
  {id:'h-temmabashi',name:'天滿橋（付費會場）',lat:34.6892,lng:135.5158,tier:'paid',view:'中～遠景',arrive:'憑票入場',crowd:'有座位'},
  {id:'h-zoheikyoku',name:'造幣局對岸（付費）',lat:34.6952,lng:135.5195,tier:'paid',view:'中景',arrive:'憑票',crowd:'有座位'},
  {id:'h-sempokan',name:'泉布觀東側（付費）',lat:34.6990,lng:135.5185,tier:'paid',view:'頭頂近景',arrive:'憑票',crowd:'有座位'},

function crowdLevelAt(zone,f){
  if(!isFestDayF(f)) return 'green';
  let lv='green';
  for(const w of zone.win){
    if(w.d!==f.day) continue;
    if(f.hm>=toMin(w.from) && f.hm<toMin(w.to)){
      if(w.lv==='red') return 'red';
      if(w.lv==='yellow') lv='yellow';
    }
  }
  return lv;
}
function activeWindowNote(zone,f){
  for(const w of zone.win){ if(w.d===f.day && f.hm>=toMin(w.from)&&f.hm<toMin(w.to)) return w.note||null; }
  return null;
}

const LS_KEY='tenjin2026';
let store = loadStore();
function loadStore(){
  try{ const s=JSON.parse(localStorage.getItem(LS_KEY)); return s||{checkins:{},reminds:{},achv:{}}; }
  catch(e){ return {checkins:{},reminds:{},achv:{}}; }
}
function saveStore(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(store)); }catch(e){} }

let map, tileLayer, fallbackMode=false, gpsMarker=null, gpsLatLng=null, gpsWatch=null;
let routeDay=24, gpsCentered=false;

const mLayers={};

function initMap(){
  try{
    map = L.map('map',{zoomControl:true,attributionControl:true,tap:true}).setView([34.6975,135.5150],14);
    tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
      maxZoom:20, minZoom:11, subdomains:'abcd',
      attribution:'© OpenStreetMap © CARTO', crossOrigin:true
    });
    let tileErrors=0, tileOk=false;
    tileLayer.on('tileerror',()=>{ tileErrors++; if(!tileOk && tileErrors>=4) enterFallback(); });
    tileLayer.on('tileload',()=>{ tileOk=true; });
    tileLayer.addTo(map);
    setTimeout(()=>{ if(!tileOk) enterFallback(); },6000);

    Object.keys(LAYERS).forEach(k=> mLayers[k]=L.layerGroup().addTo(map));
    buildStaticMarkers();
    rebuildCrowd();
    rebuildRoute();
    applyLayerVisibility();
  }catch(e){ enterFallback(); }
}

function enterFallback(){
  if(fallbackMode) return;
  fallbackMode=true;
  document.getElementById('fallback').classList.remove('hidden');
  renderFallback();
}
function exitFallback(){
  fallbackMode=false;
  document.getElementById('fallback').classList.add('hidden');
  if(map){ setTimeout(()=>map.invalidateSize(),120); }
}

/* ---------- markers ---------- */
function divPin(color,emoji){
  return L.divIcon({className:'',html:`<div class="pin" style="background:${color};width:24px;height:24px"><span>${emoji}</span></div>`,
    iconSize:[24,24],iconAnchor:[12,24],popupAnchor:[0,-24]});
}
function buildStaticMarkers(){
  MATSURI.forEach(p=>{
    const mk=L.marker([p.lat,p.lng],{icon:divPin(LAYERS.matsuri.color,p.emoji)});
    mk.on('click',()=>openMatsuri(p)); mLayers.matsuri.addLayer(mk);
  });
  YATAI.forEach(p=>{
    const poly=L.polygon(p.poly,{color:p.color,fillColor:p.color,fillOpacity:.28,weight:2});
    poly.on('click',()=>openYatai(p)); mLayers.yatai.addLayer(poly);
    const c=poly.getBounds().getCenter();
    const lbl=L.marker(c,{icon:L.divIcon({className:'',html:`<div style="background:${p.color};color:#111;font-size:10px;font-weight:800;padding:2px 6px;border-radius:10px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.5)">🍢 ${p.level}</div>`,iconSize:[10,10]})});
    lbl.on('click',()=>openYatai(p)); mLayers.yatai.addLayer(lbl);
  });
  HANABI.forEach(p=>{
    const t=HTIER[p.tier];
    const mk=L.marker([p.lat,p.lng],{icon:divPin(t.color,t.emoji)});
    mk.on('click',()=>openHanabi(p)); mLayers.hanabi.addLayer(mk);
  });
  STATION.forEach(p=>{
    const s=SSTAT[p.status];
    const mk=L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:`<div class="pin" style="background:${s.c};width:24px;height:24px"><span>🚉</span></div>`,iconSize:[24,24],iconAnchor:[12,24],popupAnchor:[0,-24]})});
    mk.on('click',()=>openStation(p)); mLayers.station.addLayer(mk);
  });
}
function rebuildCrowd(){
  if(!mLayers.crowd) return;
  mLayers.crowd.clearLayers();
  const f=festClock(now());
  CROWD.forEach(z=>{
    const lv=crowdLevelAt(z,f), col=LV[lv].c;
    const circle=L.circle([z.lat,z.lng],{radius:z.r,color:col,fillColor:col,
      fillOpacity: lv==='green'?.05:(z.faint?.10:.22), weight: lv==='green'?1:2, dashArray:z.faint?'6 6':null});
    circle.on('click',()=>openCrowd(z));
    mLayers.crowd.addLayer(circle);
  });
}
function rebuildRoute(){
  if(!mLayers.route) return;
  mLayers.route.clearLayers();
  const activeIdx=currentRouteIndex();
  const shown = ROUTE.filter(r=> routeDay==='both' || r.d===routeDay);
  // 把「同一地點的連續時段」合併成一個地圖標記（清單仍分開列）
  const groups=[];
  shown.forEach(r=>{
    const last=groups[groups.length-1];
    if(last && last[0].lat===r.lat && last[0].lng===r.lng) last.push(r);
    else groups.push([r]);
  });
  groups.forEach(g=>{
    const gi=ROUTE.indexOf(g[0]);
    const nums=g.map(x=>ROUTE.indexOf(x)+1);
    const label=g.length>1 ? nums[0]+'–'+nums[nums.length-1] : String(gi+1);
    const allDone=g.every(x=>isChecked(x.id));
    const activeHere=g.some(x=>ROUTE.indexOf(x)===activeIdx);
    const isHanabiSpot=g.some(x=>x.type==='hanabi');
    let mk;
    if(isHanabiSpot){
      // 你的花火觀賞點：醒目標記
      mk=L.marker([g[0].lat,g[0].lng],{zIndexOffset:1600,icon:L.divIcon({className:'',html:
        `<div style="position:relative"><div style="background:#e5484d;border:3px solid #fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 10px rgba(0,0,0,.5)">🎆</div>
         <div style="position:absolute;top:38px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#e5484d;color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:9px;box-shadow:0 1px 4px rgba(0,0,0,.5)">我的觀賞點</div></div>`,
        iconSize:[36,36],iconAnchor:[18,18]})});
    }else{
      let cls='route-dot'; if(activeHere) cls+=' active'; else if(allDone) cls+=' done';
      mk=L.marker([g[0].lat,g[0].lng],{zIndexOffset:1000,icon:L.divIcon({className:'',html:`<div class="${cls}">${allDone?'✓':label}</div>`,iconSize:[26,26],iconAnchor:[13,13],popupAnchor:[0,-16]})});
    }
    mk.on('click',()=>openRouteGroup(g)); mLayers.route.addLayer(mk);
  });
  const days = routeDay==='both'?[24,25]:[routeDay];
  days.forEach(day=>{
    const seg=ROUTE.filter(r=>r.d===day).map(r=>[r.lat,r.lng]);
    if(seg.length>1) mLayers.route.addLayer(L.polyline(seg,{color:LAYERS.route.color,weight:3,opacity:.6,dashArray:'6 7'}));
  });
}
function openRouteGroup(g){
  if(g.length===1){ openRoutePoint(g[0],ROUTE.indexOf(g[0])); return; }
  const body=g.map(r=>{
    const done=isChecked(r.id);
    return `<div class="route-item ${done?'done':''}" data-id="${r.id}"><div class="rtime">${r.t}</div>
      <div class="rmain"><div class="rt">${r.title}</div><div class="rd">${r.desc}</div></div>
      <div class="rchk"><button class="chkbtn ${done?'done':''}" data-chk="${r.id}">${done?'✓':'打卡'}</button></div></div>`;
  }).join('');
  openSheet('🧭 同一地點的行程',
    `<div class="info-block"><p>這個位置在你的行程裡有 <b>${g.length}</b> 個時段（同一地點、不同時間）：</p></div>${body}`);
  bindRouteItems();
}
function applyLayerVisibility(){
  if(!map) return;
  Object.keys(LAYERS).forEach(k=>{
    if(LAYERS[k].on){ if(!map.hasLayer(mLayers[k])) map.addLayer(mLayers[k]); }
    else{ if(map.hasLayer(mLayers[k])) map.removeLayer(mLayers[k]); }
  });
}

function buildLayerChips(){
  const wrap=document.getElementById('layerScroll'); wrap.innerHTML='';
  Object.keys(LAYERS).forEach(k=>{
    const L_=LAYERS[k];
    const chip=document.createElement('button');
    chip.className='layer-chip'+(L_.on?'':' off');
    chip.innerHTML=`<span class="dot" style="background:${L_.color}"></span>${L_.emoji} ${L_.name}`;
    chip.onclick=()=>{ L_.on=!L_.on; chip.classList.toggle('off',!L_.on); applyLayerVisibility(); if(k==='route') updateRouteDayCtl(); if(fallbackMode) renderFallback(); };
    wrap.appendChild(chip);
  });
}

function currentRouteIndex(){
  const f=festClock(now());
  if(!isFestDayF(f)) return -1;
  const today=ROUTE.filter(r=>r.d===f.day);
  let idx=-1;
  for(let i=0;i<today.length;i++){ if(f.hm>=toMin(today[i].t)) idx=i; }
  if(idx<0) return -1;
  return ROUTE.indexOf(today[idx]);
}
function nextRoutePoint(){
  const f=festClock(now());
  if(!isFestDayF(f)) return null;
  for(const r of ROUTE.filter(r=>r.d===f.day)){ if(toMin(r.t)>f.hm) return r; }
  return null;
}
function updateTaskBar(){
  const d=now(), f=festClock(d);
  const dayName = (f.mo===7&&f.day===24)?'7/24 宵宮':(f.mo===7&&f.day===25)?'7/25 本宮':'';
  document.getElementById('clock').innerHTML=`${pad(d.getHours())}:${pad(d.getMinutes())}<span class="day">${dayName}${simOffset?' · 模擬':''}</span>`;
  document.getElementById('btnSim').textContent = simOffset?'🟣':'🕒';
  const taskEl=document.querySelector('#taskLine .txt');
  const cdEl=document.getElementById('countdown');
  const idx=currentRouteIndex();
  if(idx<0){
    taskEl.textContent = isFestDay(d)?'祭典行程尚未開始':'非祭典日 — 點 🕒 可模擬時間預覽';
    const nx=nextRoutePoint();
    if(nx){ cdEl.innerHTML=`下一步：${nx.t} ${nx.title} · <b>${toMin(nx.t)-f.hm} 分後</b>`; } else cdEl.textContent='';
  }else{
    const cur=ROUTE[idx];
    taskEl.textContent=`${cur.t} ${cur.title}`;
    const nx=nextRoutePoint();
    if(nx){ cdEl.innerHTML=`下一步：<b>${nx.t}</b> ${nx.title.split('→')[0].trim()} · <b>${toMin(nx.t)-f.hm} 分後</b>`; }

function inAppBrowser(){
  const ua=navigator.userAgent||'';
  return window.self!==window.top || /FBAN|FBAV|Instagram|Line|MicroMessenger|Twitter|KAKAOTALK|snapchat/i.test(ua);
}
function toggleGps(){
  const btn=document.getElementById('fabGps');
  if(gpsWatch){ navigator.geolocation.clearWatch(gpsWatch); gpsWatch=null; btn.classList.remove('active'); if(gpsMarker&&map){map.removeLayer(gpsMarker);} gpsMarker=null; gpsLatLng=null; gpsCentered=false; toast('📍','已關閉定位'); updateTaskBar(); return; }
  if(!navigator.geolocation){ toast('⚠️','此裝置/瀏覽器不支援定位，可手動打卡'); return; }
  if(!window.isSecureContext){ gpsHelp('insecure'); return; }
  btn.classList.add('active');
  toast('📡','定位中…請允許位置權限');
  navigator.geolocation.getCurrentPosition(
    pos=>{ gpsLatLng={lat:pos.coords.latitude,lng:pos.coords.longitude}; placeGps(); startWatch(); },
    err=>{ btn.classList.remove('active'); gpsError(err); },
    {enableHighAccuracy:true,timeout:15000,maximumAge:0}
  );
}
function startWatch(){
  gpsWatch=navigator.geolocation.watchPosition(
    pos=>{ gpsLatLng={lat:pos.coords.latitude,lng:pos.coords.longitude}; placeGps(); },
    ()=>{}, {enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
function gpsError(err){
  if(err.code===1){ gpsHelp(inAppBrowser()?'inapp':'denied'); }
  else{ toast('📍',(err.code===2?'目前收不到定位訊號':'定位逾時')+' — 可改用手動打卡'); }
}
function gpsHelp(kind){

    <p style="color:var(--text)">所有打卡都能<b>手動</b>按；行程、倒數、現在去哪、情報圖層都不受影響。定位只是「自動打卡＋顯示你到下一站的距離方位」的加分功能。</p></div>`;
  let head;
  if(kind==='inapp'){
    head=`<div class="info-block" style="border-color:var(--accent2)"><h4>📲 你可能在「App 內建瀏覽器」開啟</h4>
      <p>在 LINE／IG／FB／Messenger 等 App 內開網頁時，系統會直接擋掉定位（不會跳出詢問）。</p>
      <p style="margin-top:6px;color:var(--text)"><b>解法：</b>點右上角「⋯」→ 選「<b>在 Safari / Chrome 開啟</b>」，再按一次定位即可。</p></div>`;
  }else if(kind==='insecure'){
    head=`<div class="info-block" style="border-color:var(--accent2)"><h4>🔒 需要 https 網頁</h4>
      <p>目前網址不是 https，瀏覽器會禁止定位。請用 GitHub Pages 的 https 網址開啟。</p></div>`;
  }else{
    head=`<div class="info-block" style="border-color:var(--accent2)"><h4>📍 定位被系統擋住（你不一定按了拒絕）</h4>
      <p>「權限被拒」常常不是你手動按的，多半是下列設定：</p>
      <ul style="margin-top:6px">
        <li><b>iOS</b>：設定 → 隱私與安全性 → 定位服務 → 要<b>開啟</b>，且下方「Safari 網站」設為「詢問」或「使用 App 期間」</li>
        <li><b>網站權限</b>：網址列旁 ⓐＡ 或 ⓘ → 網站設定 → 位置 → 改為<b>允許</b>，再重新整理</li>
        <li><b>Android Chrome</b>：⋮ → 設定 → 網站設定 → 位置 → 允許</li>
      </ul></div>`;
  }
  const diag=`<div class="info-block"><h4>🔧 定位診斷（截圖給我即可判斷）</h4><ul>
     <li>網址協定：<b>${location.protocol}</b></li>
     <li>安全連線 https：<b>${window.isSecureContext?'是 ✓':'否 ✗（定位會被禁止）'}</b></li>
     <li>App內建瀏覽器/內嵌框架：<b>${inAppBrowser()?'是 ← 很可能是主因':'否'}</b></li>
     <li>系統權限狀態：<b id="permState">查詢中…</b></li>
   </ul></div>`;
  openSheet('📍 定位無法使用',head+diag+common);

  }else{ const e=document.getElementById('permState'); if(e) e.textContent='此瀏覽器不支援查詢'; }

function placeGps(){
  if(!gpsLatLng) return;
  if(map){
    if(!gpsMarker) gpsMarker=L.marker([gpsLatLng.lat,gpsLatLng.lng],{icon:L.divIcon({className:'',html:'<div class="gps-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:2000}).addTo(map);
    else gpsMarker.setLatLng([gpsLatLng.lat,gpsLatLng.lng]);
    if(!gpsCentered){
      gpsCentered=true;
      const d=distM(gpsLatLng,FEST_CENTER);
      if(d<5000){ map.setView([gpsLatLng.lat,gpsLatLng.lng],16); toast('📍','已定位到你的位置'); }
      else{ map.setView([FEST_CENTER.lat,FEST_CENTER.lng],14); toast('📍','你距會場約 '+Math.round(d/1000)+' km（地圖仍停在會場）'); }
    }
  }
  autoCheckinNearby(); updateNextDistance();
}
function distM(a,b){
  const R=6371000,toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat),dLng=toR(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function autoCheckinNearby(){
  if(!gpsLatLng) return;
  ROUTE.forEach(r=>{
    if(!isChecked(r.id) && distM(gpsLatLng,{lat:r.lat,lng:r.lng})<=100){
      setCheck(r.id,true); toast('✓','自動打卡：'+r.title); checkAchievements(); rebuildRoute();
    }
  });
}
function bearing(a,b){
  const toR=x=>x*Math.PI/180,toD=x=>x*180/Math.PI;
  const y=Math.sin(toR(b.lng-a.lng))*Math.cos(toR(b.lat));
  const x=Math.cos(toR(a.lat))*Math.sin(toR(b.lat))-Math.sin(toR(a.lat))*Math.cos(toR(b.lat))*Math.cos(toR(b.lng-a.lng));
  return (toD(Math.atan2(y,x))+360)%360;
}
function compass(deg){const d=['北','東北','東','東南','南','西南','西','西北'];return d[Math.round(deg/45)%8];}
function updateNextDistance(){
  const nx=nextRoutePoint(); const cdEl=document.getElementById('countdown');
  if(gpsLatLng && nx){
    const dm=Math.round(distM(gpsLatLng,{lat:nx.lat,lng:nx.lng}));
    const dir=compass(bearing(gpsLatLng,{lat:nx.lat,lng:nx.lng}));
    const f=festClock(now());
    cdEl.innerHTML=`下一步：<b>${nx.t}</b> ${nx.title.split('→')[0].trim()} · 距 <b>${dm>=1000?(dm/1000).toFixed(1)+'km':dm+'m'}</b> ${dir}方 · <b>${toMin(nx.t)-f.hm} 分後</b>`;
  }
}

      <div id="remindList">${REMIND_LIST.map(r=>`<div class="remind-item ${store.reminds[r.id]?'on':''}" data-id="${r.id}"><div class="ck">${store.reminds[r.id]?'✓':''}</div><div class="lbl">${r.t}</div></div>`).join('')}</div></div>
    <div class="info-block" style="border-color:var(--red)"><h4>🎆 花火結束提醒</h4>
      <p style="color:var(--text)">原地等 <b>15 分鐘</b>，往<b>京橋</b>走，<b style="color:var(--red)">勿衝桜ノ宮駅</b>。散場第一波（20:50–21:10）原地等待最快；21:00 後計程車叫不到。</p></div>`);
  document.querySelectorAll('#remindList .remind-item').forEach(el=>{
    el.onclick=()=>{ const id=el.dataset.id; store.reminds[id]=!store.reminds[id]; saveStore(); el.classList.toggle('on',store.reminds[id]); el.querySelector('.ck').textContent=store.reminds[id]?'✓':''; };
  });
}

/* 花火結束 alert banner */
let bannerShown=false, bannerDismissed=false;
function checkAlertBanner(){
  const f=festClock(now());
  const b=document.getElementById('alertBanner');
  const inWindow = f.mo===7&&f.day===25&&f.hm>=20*60+50&&f.hm<=21*60+30;
  if(inWindow && !bannerDismissed){
    if(!bannerShown){
      b.innerHTML=`<span style="font-size:1.3rem">🎆</span><div>花火結束！<b>原地等 15 分鐘</b>再走 → 往<b>京橋</b>，<b>勿衝桜ノ宮駅</b>。</div><span class="x" id="bx">✕</span>`;
      b.classList.remove('hidden'); bannerShown=true;
      document.getElementById('bx').onclick=()=>{ b.classList.add('hidden'); bannerDismissed=true; };
    }
  }else{ b.classList.add('hidden'); if(!inWindow) bannerShown=false; }
}

/* ============================================================
   時間模擬器
   ============================================================ */
const SIM_PRESETS=[
  {l:'即時',v:null},
  {l:'7/24 17:00 屋台',v:[24,17,0]},
  {l:'7/24 18:40 催太鼓',v:[24,18,40]},
  {l:'7/24 19:30 散場',v:[24,19,30]},
  {l:'7/25 14:00 尖峰前',v:[25,14,0]},
  {l:'7/25 17:30 卡位',v:[25,17,30]},
  {l:'7/25 19:30 花火',v:[25,19,30]},
  {l:'7/25 20:55 散場',v:[25,20,55]},
];
function simVal(){ if(!simOffset) return null; const f=festClock(new Date(simOffset)); return [f.day,f.h,f.m]; }
function openSim(){
  const f = simOffset?festClock(new Date(simOffset)):null;
  openSheet('🕒 時間模擬',
   `<div id="simPanel">
    <div class="info-block"><p>祭典在 7/24–7/25。今天可能還沒到，用模擬時間預覽「依時刻變化」的功能：熱區變色、目前任務、現在去哪推薦、花火結束提醒。</p></div>
    <div class="mini-h">快速跳到</div>
    <div class="simrow">${SIM_PRESETS.map((p,i)=>`<button class="simbtn ${JSON.stringify(p.v)===JSON.stringify(simVal())?'on':''}" data-i="${i}">${p.l}</button>`).join('')}</div>
    <div class="mini-h">微調（模擬中才可用）</div>
    <div class="simrow">
      <button class="simbtn ${f&&f.day===24?'on':''}" id="simDay24">7/24 宵宮</button>
      <button class="simbtn ${f&&f.day===25?'on':''}" id="simDay25">7/25 本宮</button>
    </div>
    <div style="font-size:.9rem;text-align:center;font-weight:800;margin-top:4px" id="simTimeLbl">${f?pad(f.h)+':'+pad(f.m):'即時模式'}</div>
    <input type="range" id="simSlider" min="0" max="1439" step="5" value="${f?f.hm:1050}" ${simOffset?'':'disabled'}>
    <button class="chkbtn" id="simLive" style="width:100%;padding:11px;margin-top:6px;${simOffset?'':'background:var(--green);border-color:var(--green);color:#fff'}">${simOffset?'↩ 回到即時模式':'目前為即時模式'}</button>
   </div>`);
  document.querySelectorAll('.simbtn[data-i]').forEach(b=>b.onclick=()=>{ const p=SIM_PRESETS[+b.dataset.i]; if(p.v===null) setSimLive(); else setSim(p.v[0],p.v[1],p.v[2]); openSim(); });
  document.getElementById('simDay24').onclick=()=>{ const c=simOffset?festClock(new Date(simOffset)):{h:17,m:0}; setSim(24,c.h,c.m); openSim(); };
  document.getElementById('simDay25').onclick=()=>{ const c=simOffset?festClock(new Date(simOffset)):{h:17,m:0}; setSim(25,c.h,c.m); openSim(); };
  const sl=document.getElementById('simSlider');
  sl.oninput=()=>{ const c=simOffset?festClock(new Date(simOffset)):{day:25}; const v=+sl.value; setSim(c.day||25,Math.floor(v/60),v%60); document.getElementById('simTimeLbl').textContent=hm2str(v); };
  document.getElementById('simLive').onclick=()=>{ setSimLive(); openSim(); };
}
function setSim(day,h,m){ simOffset=new Date(FEST_YEAR,6,day,h,m,0).getTime(); onTimeChanged(); }
function setSimLive(){ simOffset=null; bannerDismissed=false; onTimeChanged(); }
function onTimeChanged(){
  const f=festClock(now());
  if(isFestDayF(f)){ routeDay=f.day; updateRouteDayCtl(); }
  updateTaskBar(); rebuildCrowd(); rebuildRoute(); checkAlertBanner();
  if(fallbackMode) renderFallback();
}
function updateRouteDayCtl(){
  document.querySelectorAll('#routeDayCtl button').forEach(b=>{
    b.classList.toggle('on', String(routeDay)===b.dataset.rd);
  });
  document.getElementById('routeDayCtl').style.display = LAYERS.route.on?'flex':'none';
}

/* ============================================================
   Toast
   ============================================================ */
let toastT=null;
function toast(em,msg){
  const t=document.getElementById('toast');
  t.innerHTML=`<span class="em">${em}</span>${msg}`;
  t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600);
}

/* ============================================================
   我的路線 sheet
   ============================================================ */
function openRouteSheet(){
  openSheet('🧭 我的路線',
   `<div class="mini-h">7/24（五）宵宮</div>
    ${ROUTE.filter(r=>r.d===24).map(routeItemHtml).join('')}
    <div class="mini-h">7/25（六）本宮</div>
    ${ROUTE.filter(r=>r.d===25).map(routeItemHtml).join('')}`);
  bindRouteItems();
}
function routeItemHtml(r){
  const done=isChecked(r.id); const idx=currentRouteIndex(); const isNow=ROUTE[idx]&&ROUTE[idx].id===r.id;
  return `<div class="route-item ${isNow?'now':''} ${done?'done':''}" data-id="${r.id}">
    <div class="rtime">${r.t}</div>
    <div class="rmain"><div class="rt">${r.title}</div><div class="rd">${r.desc}</div></div>
    <div class="rchk"><button class="chkbtn ${done?'done':''}" data-chk="${r.id}">${done?'✓':'打卡'}</button></div>
  </div>`;
}
function bindRouteItems(){
  document.querySelectorAll('[data-chk]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation(); const id=b.dataset.chk; const nv=!isChecked(id); setCheck(id,nv);
    b.classList.toggle('done',nv); b.textContent=nv?'✓':'打卡';
    if(nv){toast('✓','已打卡');checkAchievements();} rebuildRoute(); if(fallbackMode)renderFallback();
  });
  document.querySelectorAll('.route-item').forEach(el=>el.onclick=()=>{
    const r=ROUTE.find(x=>x.id===el.dataset.id); const i=ROUTE.indexOf(r);
    if(!fallbackMode&&map){ closeSheet(); map.flyTo([r.lat,r.lng],16); setTimeout(()=>openRoutePoint(r,i),350); }
    else openRoutePoint(r,i);
  });
}

/* ============================================================
   綁定 & 啟動
   ============================================================ */
document.getElementById('fabWhere').onclick=openRecommend;
document.getElementById('fabGps').onclick=toggleGps;
document.getElementById('fabRoute').onclick=openRouteSheet;
document.getElementById('btnSim').onclick=openSim;
document.getElementById('btnRemind').onclick=openRemind;
document.getElementById('btnAchv').onclick=openAchv;
document.getElementById('fbRetry').onclick=()=>{ exitFallback(); if(tileLayer) tileLayer.redraw(); };

// 路線日切換
document.querySelectorAll('#routeDayCtl button').forEach(b=>b.onclick=()=>{
  routeDay = b.dataset.rd==='both'?'both':(+b.dataset.rd);
  if(!LAYERS.route.on){ LAYERS.route.on=true; applyLayerVisibility(); buildLayerChips(); }
  updateRouteDayCtl(); rebuildRoute();
});

buildLayerChips();
// 依今天（或即時）預設路線日
(function(){ const f=festClock(now()); routeDay=(f.mo===7&&f.day===25)?25:24; })();
initMap();
updateRouteDayCtl();
updateTaskBar();
checkAlertBanner();

setInterval(()=>{ updateTaskBar(); }, 15000);
setInterval(()=>{ if(!simOffset){ rebuildCrowd(); rebuildRoute(); checkAlertBanner(); if(fallbackMode)renderFallback(); } }, 60000);

setTimeout(()=>{ if(!localStorage.getItem(LS_KEY+'_seen')){ toast('⛩️','歡迎！點下方圖層開關切換情報，右下「現在去哪」看即時建議'); localStorage.setItem(LS_KEY+'_seen','1'); } },1400);
</script>
