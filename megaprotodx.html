    const x = this.facing > 0 ? this.x + this.w - 1 : this.x - spr.w + 1;
    const y = this.y + (charged ? 2 : 5);
    const speed = charged ? CHARGE_SPEED : BULLET_SPEED;
    let vx = this.facing * speed, vy = 0;
    // 玩家在空中時朝其座標瞄準射擊，讓分身不再只會平射打空。
    if (aimed) {
      const p = game.player;
      const dx = (p.x + p.w / 2) - (x + spr.w / 2);
      const dy = (p.y + p.h / 2) - (y + spr.h / 2);
      const d = Math.hypot(dx, dy) || 1;
      vx = (dx / d) * speed; vy = (dy / d) * speed;
      this.facing = dx < 0 ? -1 : 1;
    }
    game.enemyBullets.push(new Bullet(x, y, vx, vy, sprite,
      { damage: charged ? 5 : 2, life: charged ? 150 : 100, tint: SHADOW_BULLET_TINT }));
    this.attacksUsed.add(charged ? 'chargedBuster' : 'buster');
    if (charged) this.bigCannonFrames.push(game.frame);
    SFX.play(charged ? 'bigShot' : 'shoot');
  }

  // 火盾：自動維持的護盾，被打破後需冷卻。玩家火盾道具的鏡像招式。
  raiseFireShield() {
    this.fireShieldHits = 4;
    this.fireShieldT = 1;   // 僅作「有盾」旗標；不再逐格倒數消失
    SFX.play('flame');
  }
  onShieldBlock() {
    if (this.fireShieldHits > 0 && --this.fireShieldHits <= 0) {
      this.fireShieldT = 0;
      this.fireShieldCd = 180;  // 被打破 → 約 3 秒後才會重新升盾
      SFX.play('crack');
    }
  }

  fireSpecial(game, weapon) {
    this.facePlayer(game);
    const dir = this.facing;
    const p = game.player;
    const tint = SHADOW_BULLET_TINT;
    if (weapon === 'bolt') {
      // 與玩家相同的天降閃電（加強＋暗黑）：城市 Boss 式三連落雷覆蓋玩家附近，
      // 短暫預警後落下、貫穿地形（不會卡天花板），偏亮的暗紫色確保看得見。
      const px = p.x + p.w / 2;
      for (const ox of [-26, 0, 26]) {
        const tx = Math.max(8, Math.min(px + ox, game.map.widthPx - 8));
        game.enemyBullets.push(new Bullet(tx - SPRITES.boltStrike.w / 2, 4, 0, 11, 'boltStrike',
          { damage: 4, warn: 12, noTerrain: true, tint: '#a878e8' }));
      }
      SFX.play('thunderWarn');
    } else if (weapon === 'seed') {
      // 近、遠兩顆種子炸彈，各自爆出貼地藤苗形成兩片封鎖區。
      const x = dir > 0 ? this.x + this.w - 2 : this.x - SPRITES.seed.w + 2;
      for (const sx of [1.5, 2.9]) {
        game.enemyBullets.push(new Bullet(x, this.y, dir * sx, -4, 'seed',
          { damage: 3, gravity: 0.22, sprouts: true, life: 180, tint }));
      }
      SFX.play('lob');
    } else if (weapon === 'ice') {
      // 貼地冰波（凍住玩家）＋ 一發瞄準手炮，跳過冰波也會挨打。
      const x = dir > 0 ? this.x + this.w - 2 : this.x - SPRITES.iceWave.w + 2;
      game.enemyBullets.push(new Bullet(x, this.y + this.h - SPRITES.iceWave.h,
        dir * 2.5, 0, 'iceWave', {
          damage: 3, life: 150, freezePlayer: true, tint,
          surfaceCrawl: true, crawlFacing: dir, crawlSpeed: 2.5,
        }));
      const bx = dir > 0 ? this.x + this.w - 1 : this.x - SPRITES.bulletSmall.w + 1;
      const by = this.y + 4;
      const ddx = (p.x + p.w / 2) - bx, ddy = (p.y + p.h / 2) - by;
      const d = Math.hypot(ddx, ddy) || 1;
      game.enemyBullets.push(new Bullet(bx, by, (ddx / d) * BULLET_SPEED, (ddy / d) * BULLET_SPEED,
        'bulletSmall', { damage: 2, life: 100, tint }));
      SFX.play('freeze');
    } else if (weapon === 'time') {
      // 停時本身不再空放：凍結玩家，隨後由 timeStrike 沿地面射線開火。
      game.player.invulnTimer = 0;
      game.timeStopT = this.phase === 3 ? 56 : 46;
      game.timeStopSource = 'shadow';
      this.timeShots = 0;
      game.shake(5);
      SFX.play('charged');
    }
    this.attacksUsed.add(weapon);
  }

  fireRects() {
    if (this.fireShieldHits <= 0) return [];
    const boxes = [];
    const cx = this.x + this.w / 2, cy = this.y + this.h / 2;
    for (let i = 0; i < 4; i++) {
      const a = this.animT * 0.13 + i * Math.PI / 2;
      boxes.push({
        x: Math.round(cx + Math.cos(a) * 16 - SPRITES.fireOrb.w / 2),
        y: Math.round(cy + Math.sin(a) * 12 - SPRITES.fireOrb.h / 2),
        w: SPRITES.fireOrb.w, h: SPRITES.fireOrb.h,
      });
    }
    return boxes;
  }

  hazardRects() { return this.fireRects(); }

  blocksProjectile(projectile) {
    return this.fireShieldHits > 0 && this.fireRects().some((orb) => aabbOverlap(orb, projectile));
  }

  startTransition(game, nextPhase) {
    this.phase = nextPhase;
    this.phaseHistory.push(nextPhase);
    this.transitionT = SHADOW_TRANSITION_FRAMES;
    this.shuffleWeapons();   // 新階段重新洗牌武器順序
    this.currentWeapon = nextPhase === 2 ? this.weaponOrder[0] : 'buster';
    this.weaponIndex = 0;
    this.busterInterleave = true;
    this.phase2ActionCount = 0;
    this.phase3ActionCount = 0;
    this.queuedPlayerJump = false;
    this.queuedSlideEvade = false;
    this.fireShieldT = 0; this.fireShieldHits = 0; this.fireShieldCd = 0;
    this.vx = 0; this.vy = 0;
    this.setState('transition');
    game.enemyBullets = [];
    game.shake(10);
    SFX.play('rage');
  }

  takeHit(game, dmg, weapon, projectile = null) {
    if (this.hitCd > 0 || this.transitionT > 0 || this.dead || game.state !== 'play') return;
    const smallBuster = weapon === 'buster' && !(projectile && projectile.big);
    let dealt = smallBuster ? 1 : dmg;
    const isWeak = weapon && weapon === this.currentWeapon && !smallBuster;
    if (isWeak) dealt *= this.weakMult;

    const target = this.hp - dealt;
    this.hitCd = isWeak ? 14 : 9;
    // 第三階段受擊硬直明顯增加，讓玩家能在狂暴攻勢中取得翻盤窗口。
    this.stunT = this.phase === 3 ? (isWeak ? 28 : 20) : (isWeak ? 14 : 5);
    this.vx = 0;
    this.flashTimer = isWeak ? 10 : 5;
    if (isWeak) {
      this.weakT = 24;
      game.weakFlashT = 24;
      game.shake(7);
    }
    game.hitStop = HITSTOP_FRAMES;
    SFX.play(isWeak ? 'weakHit' : 'bossHit');

    // 傷害跨過門檻時鎖在 18／9，確保任何高傷武器都不會跳過階段。
    if (this.phase === 1 && target <= 18) {
      this.hp = 18;
      this.startTransition(game, 2);
      return;
    }
    if (this.phase === 2 && target <= 9) {
      this.hp = 9;
      this.startTransition(game, 3);
      return;
    }
    this.hp = Math.max(0, target);
    if (this.hp <= 0) {
      this.dead = true;
      game.onBossDefeated(this);
    }
  }

  // 出招之間穿插一次瞄準手炮，讓節奏像真正對戰而不是連續擺特殊武器。
  interleaveBusterOrSpecial(game) {
    this.busterInterleave = !this.busterInterleave;
    this.facePlayer(game);
    if (this.busterInterleave) {
      this.currentWeapon = 'buster';
      this.setState('normalWindup');
    } else {
      this.currentWeapon = this.weaponOrder[this.weaponIndex];
      this.setState('specialWindup');
    }
  }

  chooseAttack(game) {
    // 一有空且冷卻結束就補上火盾（不佔攻擊、不隨換武器消失）。
    if (this.fireShieldHits <= 0 && this.fireShieldCd <= 0) this.raiseFireShield();
    this.facePlayer(game);
    if (this.phase === 1) {
      // 第一階段起就會使用特殊武器（不必等到後段），偶爾放蓄力大砲。
      if (this.cannonCooldown <= 0 && RNG.next() < 0.45) {
        this.currentWeapon = 'buster';
        this.setState('chargeWindup');
      } else {
        this.interleaveBusterOrSpecial(game);
      }
      return;
    }
    if (this.phase === 2) {
      if (this.phase2ActionCount >= 4) {
        this.currentWeapon = 'buster';
        this.setState('chargeWindup');
      } else {
        this.interleaveBusterOrSpecial(game);
      }
      return;
    }
    if (this.phase3ActionCount >= 2) this.startMirrorCombo(game);
    else this.interleaveBusterOrSpecial(game);
  }

  startMirrorCombo(game) {
    const p = game.player;
    const L = this.roomLeft(game) + 8;
    const R = game.map.widthPx - this.w - 8;
    const behind = p.facing > 0 ? p.x - 34 : p.x + p.w + 34;
    this.mirrorTargetX = Math.max(L, Math.min(R, behind));
    this.currentWeapon = 'buster';
    this.vx = 0;
    this.setState('mirrorWarn');
    this.attacksUsed.add('mirrorCombo');
    SFX.play('tick');
  }

  update(game) {
    if (this.dead) return;
    this.tick();
    if (this.attackCooldown > 0) this.attackCooldown--;
    if (this.cannonCooldown > 0) this.cannonCooldown--;
    if (this.fireShieldCd > 0) this.fireShieldCd--;   // 火盾被打破後的重生冷卻
    if (this.jumpEvadeCd > 0) this.jumpEvadeCd--;

    const p = game.player;
    const playerJump = !p.grounded && p.vy < 0;
    const playerSlide = p.slideT > 0;
    const jumpStarted = playerJump && !this.lastPlayerJump;
    const slideStarted = playerSlide && !this.lastPlayerSlide;
    this.lastPlayerJump = playerJump;
    this.lastPlayerSlide = playerSlide;
    // 玩家在分身出招期間起跳／滑鏟也會被記住，回到可行動狀態後立刻模仿，不漏掉輸入。
    if (this.phase === 1 && this.state !== 'transition') {
      this.queuedPlayerJump ||= jumpStarted;
      this.queuedSlideEvade ||= slideStarted;
    }

    if (this.state === 'transition') {
      this.vx = 0;
      this.moveLikePlayer(game);
      if (--this.transitionT <= 0) {
        this.transitionT = 0;
        this.attackCooldown = 36;
        this.setState('idle');
      }
      return;
    }
    if (this.stunT > 0) {
      this.stateT = Math.max(0, this.stateT - 1); // 硬直期間連招計時也暫停
      this.vx = 0;
      this.moveLikePlayer(game);
      return;
    }

    switch (this.state) {
      case 'wait':
        this.moveLikePlayer(game);
        break;
      case 'idle': {
        this.facePlayer(game);
        if (this.phase === 1 && this.queuedSlideEvade && this.grounded) {
          const pc = p.x + p.w / 2, bc = this.x + this.w / 2;
          this.facing = bc < pc ? -1 : 1; // 玩家滑鏟時往反方向拉開距離
          this.queuedSlideEvade = false;
          this.setState('evade');
          SFX.play('slide');
          break;
        }
        if (this.phase === 1 && this.queuedPlayerJump && this.grounded) {
          this.queuedPlayerJump = false;
          this.vy = PLAYER_JUMP_VY;
          this.grounded = false;
          SFX.play('jump');
        }
        // 第一、二階段主動跳起閃避逼近的水平玩家彈，讓分身看起來更靈活。
        if (this.phase < 3 && this.grounded && this.vy === 0 && this.jumpEvadeCd <= 0 &&
            this.dodgeIncomingBullet(game)) {
          this.vy = PLAYER_JUMP_VY;
          this.grounded = false;
          this.jumpEvadeCd = 42;
          SFX.play('jump');
        }
        const dx = (p.x + p.w / 2) - (this.x + this.w / 2);
        const dist = Math.abs(dx);
        let dir = 0;
        if (dist < 52) dir = dx < 0 ? 1 : -1;
        else if (dist > 92) dir = dx < 0 ? -1 : 1;
        // 各階段貼身速度都高於玩家，收窄「站著不動」的死區。
        const chase = this.phase === 3 ? 1.4 : 1.22;
        this.vx = dir * PLAYER_RUN_SPEED * chase;
        const r = this.moveLikePlayer(game);
        if (r.hitWall) this.vx = 0;
        if (this.grounded && this.attackCooldown <= 0) this.chooseAttack(game);
        break;
      }
      case 'evade': { // 與玩家相同的滑鏟速度，階段一專門回應玩家滑鏟
        this.vx = this.facing * PLAYER_SLIDE_SPEED;
        const r = this.moveLikePlayer(game);
        if (r.hitWall || this.stateT >= PLAYER_SLIDE_FRAMES) {
          this.vx = 0; this.restDuration = 18; this.attackCooldown = 18; this.setState('rest');
        }
        break;
      }
      case 'normalWindup':
        this.vx = 0; this.moveLikePlayer(game);
        if (this.stateT >= 8) { // 前搖縮短，玩家在空中時改成瞄準射擊
          this.shootBuster(game, false, !game.player.grounded);
          this.restDuration = this.phase === 3 ? 10 : 16;
          this.attackCooldown = this.phase === 3 ? 12 : 20;
          this.setState('rest');
        }
        break;
      case 'chargeWindup':
        this.vx = 0; this.moveLikePlayer(game);
        if (this.stateT === 1) SFX.play('charged');
        if (this.stateT >= 30) { // 大砲仍保留明確 0.5 秒蹲低＋槍口發光前搖
          this.shootBuster(game, true);
          this.cannonCooldown = 150;
          if (this.phase === 2) this.phase2ActionCount = 0;
          this.restDuration = this.phase === 3 ? 18 : 24;
          this.attackCooldown = this.phase === 3 ? 16 : 22;
          this.pendingAdvance = this.phase >= 2;
          this.setState('rest');
        }
        break;
      case 'specialWindup': {
        this.vx = 0; this.moveLikePlayer(game);
        const warn = this.phase === 3 ? 20 : 22;
        if (this.stateT === 1 || this.stateT === ((warn / 2) | 0)) SFX.play('tick');
        if (this.stateT >= warn) {
          const used = this.currentWeapon;
          this.fireSpecial(game, used);
          this.weaponIndex = (this.weaponIndex + 1) % this.weaponOrder.length;
          if (this.phase === 2) this.phase2ActionCount++;
          else this.phase3ActionCount++;
          this.pendingAdvance = true;
          if (used === 'time') { this.setState('timeStrike'); break; } // 停時期間主動開火
          this.restDuration = this.phase === 3 ? 16 : 22;
          this.attackCooldown = this.phase === 3 ? 12 : 18;
          this.setState('rest');
        }
        break;
      }
      case 'timeStrike': {
        // 玩家凍結期間，沿地面射線發射固定水平快彈：站著會被打穿，
        // 但停時前（前搖階段）起跳的玩家會被凍在半空，子彈從腳下掠過。
        this.vx = 0; this.moveLikePlayer(game);
        const period = this.phase === 3 ? 10 : 13;
        const maxShots = this.phase === 3 ? 4 : 3;
        if (this.stateT % period === 1 && this.timeShots < maxShots) {
          const spr = SPRITES.bulletSmall;
          const gx = this.facing > 0 ? this.x + this.w - 1 : this.x - spr.w + 1;
          const gy = this.floorY(game) - spr.h - 2;
          game.enemyBullets.push(new Bullet(gx, gy, this.facing * (BULLET_SPEED + 1.6), 0,
            'bulletSmall', { damage: 3, life: 90, tint: SHADOW_BULLET_TINT }));
          SFX.play('shoot');
          this.timeShots++;
        }
        if (game.timeStopT <= 0) {
          this.restDuration = this.phase === 3 ? 14 : 20;
          this.attackCooldown = this.phase === 3 ? 12 : 18;
          this.setState('rest');
        }
        break;
      }
      case 'mirrorWarn':
        this.vx = 0; this.moveLikePlayer(game);
        if (this.stateT === 10) SFX.play('charged');
        if (this.stateT >= 24) {
          for (let i = 0; i < 8; i++) {
            game.particles.push(new Particle(this.x + this.w / 2, this.y + this.h / 2,
              (i - 3.5) * 0.25, -1 + (i & 1) * 0.4, 20, i & 1 ? '#a848b8' : '#f83800', 2));
          }
          this.x = this.mirrorTargetX;
          this.y = this.floorY(game) - this.h;
          this.mirrorDir = (p.x + p.w / 2) < (this.x + this.w / 2) ? -1 : 1;
          this.facing = this.mirrorDir;
          SFX.play('zap');
          this.setState('mirrorSlide');
        }
        break;
      case 'mirrorSlide': {
        this.vx = this.mirrorDir * PLAYER_SLIDE_SPEED * 1.3;
        const r = this.moveLikePlayer(game);
        if (r.hitWall || this.stateT >= 22) {
          this.vx = 0; this.facePlayer(game); this.setState('mirrorCannonWindup'); SFX.play('charged');
        }
        break;
      }
      case 'mirrorCannonWindup':
        this.vx = 0; this.moveLikePlayer(game);
        if (this.stateT === 12) SFX.play('tick');
        if (this.stateT >= 24) {
          this.shootBuster(game, true);
          this.cannonCooldown = 150;
          this.phase3ActionCount = 0;
          this.restDuration = 18; this.attackCooldown = 12; this.setState('rest');
        }
        break;
      case 'rest':
        this.vx = 0; this.moveLikePlayer(game);
        if (this.stateT >= this.restDuration) {
          if (this.pendingAdvance) {
            this.currentWeapon = this.phase === 3 && this.phase3ActionCount >= 2
              ? 'buster' : this.weaponOrder[this.weaponIndex];
            this.pendingAdvance = false;
          }
          this.setState('idle');
        }
        break;
    }
  }

  frameName() {
    if (this.state === 'evade' || this.state === 'mirrorSlide' || this.state === 'chargeWindup') return 'slide';
    if (this.state === 'mirrorCannonWindup') return 'idle';
    if (this.state === 'timeStrike') return 'climb';
    if (this.state === 'specialWindup') {
      return { bolt: 'jump', seed: 'run2', ice: 'slide', fire: 'idle', time: 'climb' }[this.currentWeapon] || 'idle';
    }
    if (!this.grounded) return 'jump';
    if (Math.abs(this.vx) > 0.1) return ['run1', 'run2', 'run3', 'run2'][(this.animT >> (this.phase === 3 ? 2 : 3)) & 3];
    return 'idle';
  }

  draw(ctx, camera) {
    if (this.dead) return;
    if (this.state === 'mirrorWarn' && ((this.stateT >> 2) & 1)) return;
    const frame = this.frameName();
    let override = null;
    if (this.transitionT > 0 && ((this.transitionT >> 2) & 1)) override = '#f8f8f8';
    else if (this.weakT > 0 && ((this.weakT >> 1) & 1)) override = '#f8d820';
    else if (this.flashTimer > 0) override = '#f8f8f8';
    const sx = this.x - camera.x;
    drawSprite(ctx, 'player', sx, this.y, {
      frame, flip: this.facing < 0, override, remap: override ? null : SHADOW_REMAP,
    });

    const warning = ['chargeWindup', 'specialWindup', 'mirrorCannonWindup'].includes(this.state);
    if (warning) {
      const pulse = 2 + ((this.stateT >> 2) & 1) * 2;
      const gx = sx + (this.facing > 0 ? this.w + 1 : -pulse - 1);
      const gy = this.y + (this.state === 'chargeWindup' ? 7 : 5);
      ctx.fillStyle = this.weaponColor();
      ctx.fillRect(Math.round(gx), Math.round(gy), pulse, pulse);
      ctx.fillStyle = '#f8f8f8'; ctx.fillRect(Math.round(gx + 1), Math.round(gy + 1), 1, 1);
    }

    if (this.fireShieldHits > 0) {
      const orbFrame = (this.animT >> 2) & 1 ? 'f1' : 'f2';
      // 暗黑火盾：火焰球染成暗紫，與其他暗黑武器一致。
      for (const orb of this.fireRects()) drawSprite(ctx, 'fireOrb', orb.x - camera.x, orb.y, { frame: orbFrame, override: SHADOW_BULLET_TINT });
    }
  }
}

const BOSS_TYPES = { bat: VoltBat, kong: MechaKong, wraith: FrostWraith, djinn: MagmaDjinn, chrono: ChronoMarshal, shadow: ShadowClone };
const BOSS_NAMES = { bat: 'VOLT BAT', kong: 'MECHA KONG', wraith: 'FROST WRAITH', djinn: 'MAGMA DJINN', chrono: 'CHRONO MARSHAL', shadow: 'DARK MIRROR' };

// ── Boss Rush（最後決戰）資料 ──
// 6 個膠囊的左欄座標（各佔 2 格），對應 LEVELS[0..5] 的 Boss，正中央 16 欄為通道。
const RUSH_CAPSULE_COLS = [4, 8, 12, 20, 24, 28];
const RUSH_PORTAL_COL = 16;
// 各 Boss 復刻房的生成列（沿用原 Boss 房高度：飛行系在半空、地面系直接站地）。
const RUSH_ARENA_ROW = { bat: 9, kong: 9, wraith: 9, djinn: 9, chrono: 12, shadow: 12 };
const RUSH_RETURN_FRAMES = 200;    // 擊敗復刻 Boss 後停留領補給、再自動送回傳送房
const RUSH_BOSSES = LEVELS.slice(0, 6).map((lv) => ({
  style: lv.bossConfig.style,
  sprite: lv.bossConfig.sprite,
  weakness: lv.bossConfig.weakness || null,
  theme: lv.theme,
  name: BOSS_NAMES[lv.bossConfig.style] || 'BOSS',
  arenaRow: RUSH_ARENA_ROW[lv.bossConfig.style] || 9,
}));

// 5×7 點陣字型：不依賴作業系統字型，任何瀏覽器都維持同樣像素。
const PIXEL_FONT = {
  'A':[14,17,17,31,17,17,17],'B':[30,17,17,30,17,17,30],'C':[14,17,16,16,16,17,14],
  'D':[30,17,17,17,17,17,30],'E':[31,16,16,30,16,16,31],'F':[31,16,16,30,16,16,16],
  'G':[14,17,16,23,17,17,15],'H':[17,17,17,31,17,17,17],'I':[31,4,4,4,4,4,31],
  'J':[7,2,2,2,18,18,12],'K':[17,18,20,24,20,18,17],'L':[16,16,16,16,16,16,31],
  'M':[17,27,21,21,17,17,17],'N':[17,25,21,19,17,17,17],'O':[14,17,17,17,17,17,14],
  'P':[30,17,17,30,16,16,16],'Q':[14,17,17,17,21,18,13],'R':[30,17,17,30,20,18,17],
  'S':[15,16,16,14,1,1,30],'T':[31,4,4,4,4,4,4],'U':[17,17,17,17,17,17,14],
  'V':[17,17,17,17,17,10,4],'W':[17,17,17,21,21,21,10],'X':[17,17,10,4,10,17,17],
  'Y':[17,17,10,4,4,4,4],'Z':[31,1,2,4,8,16,31],
  '0':[14,17,19,21,25,17,14],'1':[4,12,4,4,4,4,14],'2':[14,17,1,2,4,8,31],
  '3':[30,1,1,14,1,1,30],'4':[2,6,10,18,31,2,2],'5':[31,16,16,30,1,1,30],
  '6':[14,16,16,30,17,17,14],'7':[31,1,2,4,8,8,8],'8':[14,17,17,14,17,17,14],
  '9':[14,17,17,15,1,1,14],
  ' ':[0,0,0,0,0,0,0],'>':[16,8,4,2,4,8,16],'!':[4,4,4,4,4,0,4],
  ':':[0,4,4,0,4,4,0],'/':[1,2,2,4,8,8,16],'-':[0,0,0,31,0,0,0],
  '.':[0,0,0,0,0,12,12],'?':[14,17,1,2,4,0,4],
};

function bitmapText(ctx, text, cx, y, color) {
  const chars = String(text).toUpperCase();
  const width = Math.max(0, chars.length * 6 - 1);
  const x0 = Math.round(cx - width / 2);
  ctx.fillStyle = color;
  for (let i = 0; i < chars.length; i++) {
    const rows = PIXEL_FONT[chars[i]] || PIXEL_FONT['?'];
    for (let row = 0; row < 7; row++) {
      const bits = rows[row];
      for (let col = 0; col < 5; col++) {
        if (bits & (1 << (4 - col))) ctx.fillRect(x0 + i * 6 + col, Math.round(y) - 7 + row, 1, 1);
      }
    }
  }
}

/* ================================================================
 * MODULE: game — 狀態機、互動判定、鏡頭、HUD、Boss 進場演出
 * ================================================================ */
class Game {
  constructor() {
    this.stageIndex = null;
    this.levelData = null;
    this.theme = 'city';
    this.cleared = this.loadProgress(); // 已通關關卡會跨重新整理保存
    this.state = 'select';      // 開場即選關畫面
    this.selCursor = 0;
    this.frame = 0;
    this.worldT = 0;
    this.hitStop = 0;
    this.respawnPoint = { x: 0, y: 0 };
    this.weaponIdx = 0;                          // 目前武器(unlockedWeapons 的索引)
    this.weaponMenuCursor = 0;
    this.pauseCursor = 0;
    this.weakFlashT = 0;
    this.lives = STARTING_LIVES;
    this.timeStopT = 0;       // 敵方停時：玩家凍結，敵人與敵彈照常
    this.playerTimeStopT = 0; // 玩家能力：敵人、Boss 與敵彈凍結
    this.timeStopSource = null;
    this.rush = null;         // Boss Rush（最後決戰）狀態
    this.capsules = null;
    this.rushReturnT = 0;
    this.ammo = this.fullAmmo();
  }

  loadProgress() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      const data = raw ? JSON.parse(raw) : null;
      return new Set(Array.isArray(data && data.cleared) ? data.cleared.filter((n) => n >= 0 && n < LEVELS.length) : []);
    } catch (e) { return new Set(); }
  }

  saveProgress() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ cleared: [...this.cleared] })); } catch (e) {}
  }

  fullAmmo() {
    return {
      bolt: WEAPON_AMMO_MAX, seed: WEAPON_AMMO_MAX, ice: WEAPON_AMMO_MAX,
      fire: WEAPON_AMMO_MAX, time: WEAPON_AMMO_MAX,
    };
  }

  // ── 武器系統:打倒 Boss 解鎖 ──
  unlockedWeapons() {
    const list = ['buster'];
    LEVELS.forEach((lv, i) => { if (this.cleared.has(i) && lv.weapon) list.push(lv.weapon); });
    return list;
  }
  currentWeaponId() {
    const list = this.unlockedWeapons();
    return list[this.weaponIdx % list.length];
  }
  cycleWeapon() {
    const list = this.unlockedWeapons();
    if (list.length < 2) return;
    this.weaponIdx = (this.weaponIdx + 1) % list.length;
    if (this.player) { this.player.chargeT = 0; this.player.chargedNotified = false; }
    SFX.play('wswitch');
  }
  addAmmo(n) {
    const id = this.currentWeaponId();
    if (id === 'buster' || this.ammo[id] >= WEAPON_AMMO_MAX) return false;
    this.ammo[id] = Math.min(WEAPON_AMMO_MAX, this.ammo[id] + n);
    SFX.play('pickup');
    return true;
  }

  openWeaponMenu() {
    const list = this.unlockedWeapons();
    if (list.length < 2 || this.state !== 'play') { SFX.play('empty'); return; }
    this.weaponMenuCursor = this.weaponIdx % list.length;
    this.state = 'weaponMenu';
    this.inputLocked = true;
    SFX.play('wswitch');
  }

  returnToSelect() {
    this.state = 'select';
    this.inputLocked = false;
    this.bossActive = false;
    Music.reset();
  }

  startStage(i) {
    const target = LEVELS[i];
    if (!target) { SFX.play('empty'); return; }
    if (target.fortress && !this.fortressUnlocked()) { SFX.play('empty'); return; }
    if (target.requiresClear !== undefined && !this.cleared.has(target.requiresClear)) { SFX.play('empty'); return; }
    if (this.lives <= 0) this.lives = STARTING_LIVES;
    this.stageIndex = i;
    this.levelData = LEVELS[i];
    this.theme = this.levelData.theme || 'city';
    RNG.seed(this.levelData.seed);
    this.ammo = this.fullAmmo(); // 進關補滿彈藥
    this.fullReset();
  }

  fullReset() {
    const probe = new Tilemap(this.levelData);
    this.respawnPoint = { ...probe.playerSpawn };
    // Boss Rush：整關重來（進關／暫停選單重試）時清空戰績；死亡走 reset() 會保留戰績。
    this.rush = this.levelData.bossRush
      ? { defeated: new Set(), mode: 'hub', current: null }
      : null;
    this.reset();
  }

  reset() {
    this.map = new Tilemap(this.levelData);
    this.map.game = this;
    this.frozenMagmaPools = new Map();
    this.frozenMagmaJets = new Map();
    this.player = new Player(this);
    this.enemies = this.map.enemySpawns.map((s) => {
      const e = new ENEMY_TYPES[this.theme][s.type](s);
      e._home = { ...s };
      return e;
    });
    this.traps = this.map.trapSpawns.map((s) => new IcicleTrap(s));
    const bossCfg = this.levelData.bossConfig || {};
    this.boss = this.map.bossSpawn ? new BOSS_TYPES[bossCfg.style || 'bat'](this.map.bossSpawn, bossCfg) : null;
    this.playerBullets = [];
    this.enemyBullets = [];
    this.queuedPlayerBullets = [];
    this.queuedEnemyBullets = [];
    this.pickups = this.map.pickupSpawns.map((s) => new HealthPickup(s.x + TILE / 2, s.y + TILE, s.kind));
    this.particles = [];
    this.camera = { x: 0, y: 0 };
    this.state = 'ready';     // ready | play | pause | weaponMenu | dead | intro | victory
    this.stateTimer = 0;
    this.introPhase = null;   // slide | shadowDrop | shadowPose | fill
    this.introT = 0;
    this.bossActive = false;
    this.inputLocked = true;
    this.frame = 0;
    this.worldT = 0;
    this.hitStop = 0;
    this.shakeT = 0;
    this.readyT = READY_FRAMES;
    this.victoryT = 0;
    this.weakFlashT = 0;
    this.timeStopT = 0;
    this.playerTimeStopT = 0;
    this.timeStopSource = null;
    this.stageStopCooldown = 240;
    this.stageStopWarnT = 0;
    this.stageStopCount = 0;
    this.rushReturnT = 0;
    // Boss Rush 傳送房：重建膠囊、回到大廳模式（保留已擊敗戰績）。
    if (this.levelData && this.levelData.bossRush) {
      if (!this.rush) this.rush = { defeated: new Set(), mode: 'hub', current: null };
      this.theme = this.levelData.theme;
      this.rush.mode = 'hub';
      this.rush.current = null;
      this.capsules = this.buildRushCapsules();
    } else {
      this.capsules = null;
    }
    _worldFrame = 0;
    this.updateCamera(true);
  }

  // ── Boss Rush（最後決戰）傳送房 ──
  buildRushCapsules() {
    const floorY = (this.map.rows - 2) * TILE;   // 地面頂緣
    return RUSH_CAPSULE_COLS.map((col, i) => ({
      idx: i,
      boss: RUSH_BOSSES[i],
      col,
      rect: { x: col * TILE, y: floorY - 4 * TILE, w: 2 * TILE, h: 4 * TILE },
    }));
  }

  rushPortalRect() {
    const floorY = (this.map.rows - 2) * TILE;
    return { x: RUSH_PORTAL_COL * TILE, y: floorY - 4 * TILE, w: 2 * TILE, h: 4 * TILE };
  }

  rushAllCleared() {
    return !!this.rush && this.rush.defeated.size >= RUSH_BOSSES.length;
  }

  updateRushHub() {
    // 站在膠囊前按「↑」進入該 Boss 戰（可任選順序）；全部擊敗後於中央通道按「↑」進最終 Boss。
    if (!Input.pressed('up')) return;
    const pb = this.player.hurtbox;
    for (const cap of this.capsules) {
      if (this.rush.defeated.has(cap.idx)) continue;
      if (aabbOverlap(pb, cap.rect)) { this.startRushFight(cap.idx); return; }
    }
    if (this.rushAllCleared() && aabbOverlap(pb, this.rushPortalRect())) this.enterFinalBoss();
  }

  startRushFight(idx) {
    const cfg = RUSH_BOSSES[idx];
    this.map = new Tilemap({ map: buildRushArenaMap(cfg.arenaRow), theme: cfg.theme });
    this.map.game = this;
    this.map.doorClosed = true;
    this.theme = cfg.theme;
    // 生成復刻 Boss：數值與弱點都同原版，只是直接進入狂暴、血條立即滿。
    const boss = new BOSS_TYPES[cfg.style](this.map.bossSpawn, cfg);
    boss.hpShown = BOSS_HP;
    boss.rage = true;
    if (boss.shadowClone) boss.startTransition(this, 3); // 暗影複製體＝直接進第三（最狂暴）階段
    else boss.setState('idle');
    this.boss = boss;
    // 玩家移到競技場入口，短暫無敵避免生成即被打。
    const ps = this.map.playerSpawn;
    this.player.x = ps.x + (TILE - this.player.w) / 2;
    this.player.y = ps.y + TILE - this.player.h;
    this.player.vx = 0; this.player.vy = 0; this.player.facing = 1;
    this.player.frozenT = 0; this.player.burnT = 0; this.player.invulnTimer = 48;
    this.playerBullets = []; this.enemyBullets = [];
    this.queuedPlayerBullets = []; this.queuedEnemyBullets = [];
    this.pickups = []; this.particles = []; this.enemies = []; this.traps = [];
    this.timeStopT = 0; this.playerTimeStopT = 0; this.timeStopSource = null;
    this.rush.mode = 'fight'; this.rush.current = idx;
    this.rushReturnT = 0;
    this.bossActive = true;
    this.state = 'play';
    this.inputLocked = false;
    SFX.play('door'); this.shake(6);
    this.updateCamera(true);
  }

  returnToHub() {
    const idx = this.rush.current;
    this.map = new Tilemap(this.levelData);   // 回到傳送房
    this.map.game = this;
    this.theme = this.levelData.theme;
    this.capsules = this.buildRushCapsules();
    this.boss = null;
    this.bossActive = false;
    this.playerBullets = []; this.enemyBullets = [];
    this.queuedPlayerBullets = []; this.queuedEnemyBullets = [];
    this.pickups = []; this.particles = []; this.enemies = []; this.traps = [];
    this.rushReturnT = 0;
    this.timeStopT = 0; this.playerTimeStopT = 0; this.timeStopSource = null;
    this.rush.mode = 'hub'; this.rush.current = null;
    // 站回剛清空（已變暗）的膠囊前，方便前往下一個。
    const centerCol = (idx != null ? RUSH_CAPSULE_COLS[idx] + 1 : 2);
    this.player.x = centerCol * TILE - this.player.w / 2;
    this.player.y = (this.map.rows - 2) * TILE - this.player.h;
    this.player.vx = 0; this.player.vy = 0;
    this.player.frozenT = 0; this.player.burnT = 0; this.player.invulnTimer = 30;
    this.state = 'play'; this.inputLocked = false;
    if (this.rushAllCleared()) { SFX.play('charged'); this.shake(8); }
    this.updateCamera(true);
  }

  enterFinalBoss() {
    // 最終 Boss 稍後補上：先給一個過場提示，避免流程卡住。
    this.state = 'rushclear';
    this.victoryT = 0;
    this.inputLocked = true;
    this.bossActive = false;
    this.enemyBullets = [];
    SFX.play('bossDie');
    this.shake(10);
  }

  shake(n) { this.shakeT = Math.max(this.shakeT, n); }

  magmaPoolForCol(col) {
    if (!this.levelData.lavaTide || this.bossActive) return null;
    const floorRow = this.map.rows - 2;
    const doorCol = this.map.doorX === null ? this.map.cols : Math.floor(this.map.doorX / TILE);
    if (col < 0 || col >= doorCol || this.map.charAt(col, floorRow) !== '.' ||
        this.map.charAt(col, floorRow + 1) !== '.') return null;
    let start = col, end = col;
    while (start > 0 && this.map.charAt(start - 1, floorRow) === '.' && this.map.charAt(start - 1, floorRow + 1) === '.') start--;
    while (end + 1 < doorCol && this.map.charAt(end + 1, floorRow) === '.' && this.map.charAt(end + 1, floorRow + 1) === '.') end++;
    if (end - start + 1 > 6) return null; // 只承認關卡中的小岩漿池，不把大型區域當成可凍結地形
    return { key: `${start}:${end}`, start, end, row: floorRow };
  }

  freezeMagmaPoolAtCol(col, frames = LOCAL_MAGMA_FREEZE_FRAMES) {
    // 漲潮啟動時屬於「大岩漿」，冰流只能融化，不能在上面鋪冰。
    if (lavaSurfaceForState(lavaTideState(this.worldT)) !== null) return false;
    const pool = this.magmaPoolForCol(col);
    if (!pool) return false;
    const old = this.frozenMagmaPools.get(pool.key);
    this.frozenMagmaPools.set(pool.key, { ...pool, t: Math.max(old ? old.t : 0, frames) });
    this.shake(3);
    return true;
  }

  freezeMagmaJet(col, frames = LOCAL_MAGMA_FREEZE_FRAMES) {
    if (!this.levelData.lavaTide || this.bossActive) return false;
    const jet = this.map.jets.find((j) => j.col === col);
    if (!jet) return false;
    const old = this.frozenMagmaJets.get(col);
    this.frozenMagmaJets.set(col, { col, row: jet.row, t: Math.max(old ? old.t : 0, frames) });
    this.shake(3);
    return true;
  }

  isFrozenMagmaPoolCell(col, row) {
    if (!this.frozenMagmaPools) return false;
    for (const pool of this.frozenMagmaPools.values()) {
      if (pool.t > 0 && row === pool.row && col >= pool.start && col <= pool.end) return true;
    }
    return false;
  }

  isFrozenMagmaJet(col) {
    const jet = this.frozenMagmaJets && this.frozenMagmaJets.get(col);
    return !!(jet && jet.t > 0);
  }

  isFrozenMagmaJetCell(col, row) {
    const jet = this.frozenMagmaJets && this.frozenMagmaJets.get(col);
    return !!(jet && jet.t > 0 && row >= jet.row - 2 && row <= jet.row);
  }

  updateFrozenMagma() {
    for (const [key, pool] of this.frozenMagmaPools) {
      if (--pool.t <= 0) this.frozenMagmaPools.delete(key);
    }
    for (const [key, jet] of this.frozenMagmaJets) {
      if (--jet.t <= 0) this.frozenMagmaJets.delete(key);
    }
  }

  isNearCamera(entity, margin = 72) {
    return entity.x + entity.w >= this.camera.x - margin && entity.x <= this.camera.x + SCREEN_W + margin &&
      entity.y + entity.h >= this.camera.y - margin && entity.y <= this.camera.y + SCREEN_H + margin;
  }

  onPlayerDeath() {
    if (this.state === 'dead' || this.state === 'gameover') return;
    this.lives = Math.max(0, this.lives - 1);
    this.timeStopT = 0;
    this.playerTimeStopT = 0;
    this.timeStopSource = null;
    this.state = this.lives > 0 ? 'dead' : 'gameover';
    this.stateTimer = this.lives > 0 ? RESPAWN_DELAY : 0;
  }

  onEnemyKilled(e) {
    SFX.play('enemyDie');
    spawnExplosion(this, e.x + e.w / 2, e.y + e.h / 2);
    if (RNG.next() < EXTRA_LIFE_CHANCE) {
      this.pickups.push(new HealthPickup(e.x + e.w / 2, e.y + e.h / 2, 'life'));
    } else if (RNG.next() < Difficulty.dropChance()) {
      // 已有 Boss 武器時,一半機率掉武器彈藥
      const kind = this.unlockedWeapons().length > 1 && RNG.next() < 0.5 ? 'ammo' : 'hp';
      this.pickups.push(new HealthPickup(e.x + e.w / 2, e.y + e.h / 2, kind));
    }
  }

  onBossDefeated(boss) {
    SFX.play('bossDie');
    this.timeStopT = 0;
    this.playerTimeStopT = 0;
    this.timeStopSource = null;
    this.enemyBullets = [];
    this.bossCorpse = { x: boss.x, y: boss.y, w: boss.w, h: boss.h, shadow: !!boss.shadowClone };
    // 復刻戰：不進勝利畫面、不給武器；固定掉落大回血 + 大彈藥各一，稍後自動返回傳送房。
    if (this.rush && this.rush.mode === 'fight') {
      this.rush.defeated.add(this.rush.current);
      this.bossActive = false;
      if (boss.shadowClone) spawnShadowCollapse(this, this.bossCorpse, 42);
      else spawnExplosion(this, boss.x + boss.w / 2, boss.y + boss.h / 2, true);
      const dropX = boss.x + boss.w / 2, dropY = boss.y + boss.h;
      this.pickups.push(new HealthPickup(dropX - 9, dropY, 'full'));
      this.pickups.push(new HealthPickup(dropX + 9, dropY, 'fullAmmo'));
      this.rushReturnT = RUSH_RETURN_FRAMES;
      return;
    }
    this.state = 'victory';   // 勝利定格
    this.victoryT = 0;
    this.inputLocked = true;
    if (boss.shadowClone) spawnShadowCollapse(this, this.bossCorpse, 42);
  }

  update() {
    this.frame++;
    if (Input.pressed('mute')) SFX.toggleMute();
    Music.update(this.musicTrack());
    if (this.state === 'select') { _worldFrame = this.frame; this.updateSelect(); return; }
    if (this.hitStop > 0) { this.hitStop--; return; } // 命中定格:全畫面凍結
    if (this.shakeT > 0) this.shakeT--;
    if (this.weakFlashT > 0) this.weakFlashT--;

    if (this.state === 'intro' ||
        (this.state === 'play' && this.timeStopT <= 0 && this.playerTimeStopT <= 0)) this.worldT++;
    _worldFrame = this.worldT;

    if (this.state === 'play' && Input.pressed('pause')) {
      this.state = 'pause'; this.inputLocked = true; this.pauseCursor = 0; SFX.play('tick'); return;
    }

    if (Input.pressed('reset') && this.levelData && this.state !== 'gameover') { this.fullReset(); return; }

    switch (this.state) {
      case 'ready':  this.updateReady(); break;
      case 'play':   this.updatePlay(); break;
      case 'pause':  this.updatePause(); break;
      case 'weaponMenu': this.updateWeaponMenu(); break;
      case 'dead':
        for (const pt of this.particles) pt.update();
        this.particles = this.particles.filter((p) => !p.dead);
        if (--this.stateTimer <= 0) this.reset();
        break;
      case 'gameover':
        this.stateTimer++;
        for (const pt of this.particles) pt.update();
        this.particles = this.particles.filter((p) => !p.dead);
        if (this.stateTimer > 55 && (Input.pressed('jump') || Input.pressed('shoot'))) {
          this.lives = STARTING_LIVES;
          this.returnToSelect();
        }
        break;
      case 'intro':  this.updateIntro(); break;
      case 'victory': this.updateVictory(); break;
      case 'rushclear': this.updateRushClear(); break;
    }
  }

  updateRushClear() {
    this.victoryT++;
    for (const pt of this.particles) pt.update();
    this.particles = this.particles.filter((p) => !p.dead);
    // 最終 Boss 尚未實作：按跳躍先回選關畫面（不標記通關）。
    if (this.victoryT > 90 && Input.pressed('jump')) { this.returnToSelect(); SFX.play('pickup'); }
  }

  musicTrack() {
    if (this.state === 'pause' || this.state === 'weaponMenu' || this.state === 'dead' || this.state === 'gameover') return null;
    if (this.state === 'select') return 'select';
    if (this.state === 'victory') return 'victory';
    if (this.bossActive || this.state === 'intro') return 'boss';
    return this.theme;
  }

  updateReady() {
    // 只讓角色安全落到出生平台；敵人、陷阱和關卡週期完全凍結。
    const p = this.player;
    p.animT++;
    p.vy = Math.min(p.vy + GRAVITY, MAX_FALL);
    const res = moveWithCollision(p, this.map);
    p.grounded = res.grounded;
    this.updateCamera(true);
    if (--this.readyT <= 0) {
      this.readyT = 0;
      this.state = 'play';
      this.inputLocked = false;
    }
  }

  updatePause() {
    const options = 5;
    if (Input.pressed('up')) { this.pauseCursor = (this.pauseCursor + options - 1) % options; SFX.play('tick'); }
    if (Input.pressed('down')) { this.pauseCursor = (this.pauseCursor + 1) % options; SFX.play('tick'); }
    if (Input.pressed('pause')) { this.state = 'play'; this.inputLocked = false; SFX.play('tick'); return; }
    if (Input.pressed('jump') || Input.pressed('shoot')) {
      if (this.pauseCursor === 0) { this.state = 'play'; this.inputLocked = false; }
      else if (this.pauseCursor === 1) this.fullReset();
      else if (this.pauseCursor === 2) { SFX.toggleMute(); return; }
      else if (this.pauseCursor === 3) { Input.toggleSwap(); SFX.play('wswitch'); return; }
      else this.returnToSelect();
      SFX.play('charged');
    }
  }

  updateWeaponMenu() {
    const list = this.unlockedWeapons();
    if (Input.pressed('up') || Input.pressed('left')) {
      this.weaponMenuCursor = (this.weaponMenuCursor + list.length - 1) % list.length; SFX.play('tick');
    }
    if (Input.pressed('down') || Input.pressed('right')) {
      this.weaponMenuCursor = (this.weaponMenuCursor + 1) % list.length; SFX.play('tick');
    }
    if (Input.pressed('pause')) { this.state = 'play'; this.inputLocked = false; return; }
    if (Input.pressed('jump') || Input.pressed('shoot') || Input.pressed('weapon')) {
      this.weaponIdx = this.weaponMenuCursor;
      this.player.chargeT = 0; this.player.chargedNotified = false;
      this.state = 'play'; this.inputLocked = false;
      SFX.play('wswitch');
    }
  }

  spawnCourseTire(reverse = false) {
    const spr = SPRITES.bossMissile;
    const mid = this.camera.x + SCREEN_W / 2;
    let fromLeft = this.player.x + this.player.w / 2 >= mid;
    if (reverse) fromLeft = !fromLeft;
    const x = fromLeft ? this.camera.x + 5 : this.camera.x + SCREEN_W - spr.w - 5;
    const y = (this.map.rows - 2) * TILE - spr.h;
    const tire = new Bullet(x, y, fromLeft ? 3.5 : -3.5, 0, 'bossMissile', {
      damage: 4, groundHug: true, life: 110, timeProof: true, courseTire: true,
    });
    this.enemyBullets.push(tire);
    SFX.play('bigShot');
    return tire;
  }

  // 賽道事件：黃燈先提示起跳，紅燈停時的同一刻從地面滾入輪胎。
  updateTimeSurge() {
    if (!this.levelData.timeSurges || !this.levelData.raceTires || this.bossActive || this.introPhase !== null) return;
    if (this.map.doorX !== null && this.player.x > this.map.doorX - 80) {
      this.stageStopWarnT = 0;
      return;
    }
    if (this.timeStopT > 0 || this.playerTimeStopT > 0) return;
    if (this.stageStopWarnT > 0) {
      this.stageStopWarnT--;
      if (this.stageStopWarnT === 0) {
        const variance = hash32(this.levelData.seed + this.stageStopCount * 97);
        this.timeStopT = 88 + (variance % 17);
        this.timeStopSource = 'stage';
        this.player.invulnTimer = 0; // 停時不是無敵：開始瞬間清除舊受擊閃爍
        this.spawnCourseTire((this.stageStopCount & 1) !== 0);
        this.stageStopCount++;
        this.stageStopCooldown = 230 + (hash32(variance + 31) % 121);
        this.shake(4);
        SFX.play('charged');
      }
      return;
    }
    if (--this.stageStopCooldown <= 0) {
      this.stageStopWarnT = TIME_SURGE_WARN_FRAMES;
      SFX.play('tick');
    }
  }

  updatePlay() {
    this.updateTimeSurge();
    const enemyTimeStop = this.timeStopT > 0;
    if (enemyTimeStop) {
      this.timeStopT--;
      this.player.animT++; // 敵方停時：玩家的位置、輸入與無敵計時都凍結
    } else {
      this.player.update(this);
    }
    if (this.state !== 'play') return; // 玩家可能死在自己的 update 裡
    // 玩家可能剛在上面的 input 處啟動能力，因此必須在 player.update 後再取值。
    const playerTimeStop = this.playerTimeStopT > 0;
    if (playerTimeStop) this.playerTimeStopT--;
    if (!enemyTimeStop && !playerTimeStop) this.updateFrozenMagma();

    // ── Boss Rush（最後決戰）：傳送房巡查 / 復刻戰勝利停留 ──
    if (this.rush && !enemyTimeStop && !playerTimeStop) {
      if (this.rush.mode === 'hub') {
        this.updateRushHub();
        if (this.state !== 'play' || this.rush.mode !== 'hub') return; // 已進膠囊或通道
      } else if (this.rush.mode === 'fight' && this.rushReturnT > 0) {
        if (--this.rushReturnT <= 0) { this.returnToHub(); return; }
      }
    }

    // Boss 門觸發
    if (!enemyTimeStop && !playerTimeStop && !this.bossActive && this.introPhase === null && this.map.doorX !== null &&
        this.player.x + this.player.w > this.map.doorX + 10) {
      this.stageStopWarnT = 0;
      this.enemyBullets = this.enemyBullets.filter((b) => !b.courseTire);
      this.state = 'intro';
      this.introPhase = 'slide';
      this.inputLocked = true;
      SFX.play('door');
      return;
    }

    for (const e of this.enemies) {
      if (!this.isNearCamera(e)) continue;
      if (playerTimeStop) continue;
      if (e.frozenT > 0) { // 冰波凍結:整隻停格
        e.frozenT--;
        if (e.frozenT === 0) e.thawGrace = 24; // 解凍瞬間短暫無害(玩家可能正站在上面)
        continue;
      }
      if (e.thawGrace > 0) e.thawGrace--;
      e.update(this);
    }
    if (!playerTimeStop) for (const tr of this.traps) if (this.isNearCamera(tr, 48)) tr.update(this);
    if (!playerTimeStop && this.boss && this.bossActive) {
      this.boss.update(this);
    } else if (playerTimeStop && this.boss && this.bossActive) {
      // AI 與位置凍結，但受擊冷卻仍按玩家的行動時間流逝，否則整段停時只能傷到 Boss 一次。
      if (this.boss.hitCd > 0) this.boss.hitCd--;
      if (this.boss.flashTimer > 0) this.boss.flashTimer--;
      if (this.boss.weakT > 0) this.boss.weakT--;
    }
    // 火焰噴射柱(熔岩關):噴發中碰到就受傷
    if (this.map.jets.length && !this.player.dead && this.player.invulnTimer <= 0) {
      for (const j of this.map.jets) {
        if (!this.isFrozenMagmaJet(j.col) && jetState(j.col, this.worldT) === 'on' &&
            aabbOverlap(this.player.hurtbox, jetRect(j.col, j.row))) {
          this.player.hurt(this, j.col * TILE + 8, 4);
          break;
        }
      }
    }
    // 熔岩漲潮(熔岩關):淹沒期間待在低處會持續受灼傷
    if (this.levelData.lavaTide && !this.player.dead && this.player.invulnTimer <= 0) {
      const lavaState = lavaTideState(this.worldT);
      const surfaceY = lavaSurfaceForState(lavaState);
      if (surfaceY !== null && this.player.x < this.map.doorX && this.player.y + this.player.h > surfaceY) {
        this.player.hurt(this, this.player.x, LAVA_TIDE_DMG);
      }
    }
    if (!enemyTimeStop) for (const b of this.playerBullets) b.update(this);
    if (!playerTimeStop) for (const b of this.enemyBullets) b.update(this);
    // 子彈死亡時衍生的藤苗(佇列避免迭代中修改陣列)
    if (this.queuedPlayerBullets.length) {
      this.playerBullets.push(...this.queuedPlayerBullets);
      this.queuedPlayerBullets = [];
    }
    if (this.queuedEnemyBullets.length) {
      this.enemyBullets.push(...this.queuedEnemyBullets);
      this.queuedEnemyBullets = [];
    }
    if (!enemyTimeStop && !playerTimeStop) {
      for (const p of this.pickups) p.update(this);
      for (const pt of this.particles) pt.update();
    }

    // 玩家子彈 vs 雜兵 / Boss(閃電鏢貫通;種子命中即爆開)
    for (const b of this.playerBullets) {
      if (enemyTimeStop) break;
      if (b.dead) continue;
      for (const e of this.enemies) {
        if (e.dead || b.hitOnce.has(e) || !b.overlaps(e)) continue;
        e.takeHit(this, b.damage);
        if (b.chain && !b.chainedDone) { b.chainedDone = true; chainLightning(this, e, b.damage); }
        if (b.freeze && !e.dead) { e.frozenT = FREEZE_FRAMES; SFX.play('freeze'); } // 冰波凍結
        if (b.pierce) { b.hitOnce.add(e); continue; }
        if (b.sprouts) b.explode(this); else b.dead = true;
        break;
      }
      if (!b.dead && this.boss && this.bossActive && !this.boss.dead &&
          typeof this.boss.blocksProjectile === 'function' && this.boss.blocksProjectile(b)) {
        b.dead = true;
        if (typeof this.boss.onShieldBlock === 'function') this.boss.onShieldBlock();
        spawnExplosion(this, b.x + b.w / 2, b.y + b.h / 2);
        SFX.play('flame');
        continue;
      }
      if (!b.dead && this.boss && this.bossActive && !this.boss.dead && b.overlaps(this.boss)) {
        this.boss.takeHit(this, b.damage, b.weapon, b);
        if (b.sprouts) b.explode(this); else b.dead = true; // 貫通彈打 Boss 也只算一次
      }
    }

    // 環繞火盾本身也有攻擊判定；共用短冷卻，避免每影格重複燒傷同一目標。
    if (this.player.fireShieldT > 0 && this.player.fireShieldHitCd <= 0) {
      const orbs = this.player.fireShieldRects();
      let shieldHit = false;
      for (const e of this.enemies) {
        if (e.dead || !orbs.some((orb) => aabbOverlap(orb, e))) continue;
        e.takeHit(this, 2);
        shieldHit = true;
        break;
      }
      if (!shieldHit && this.boss && this.bossActive && !this.boss.dead &&
          orbs.some((orb) => aabbOverlap(orb, this.boss))) {
        const hpBefore = this.boss.hp;
        this.boss.takeHit(this, 2, 'fire');
        shieldHit = this.boss.hp < hpBefore;
      }
      if (shieldHit) {
        this.player.fireShieldHitCd = 18;
        SFX.play('flame');
      }
    }

    // 敵彈 vs 玩家(無敵期間穿過;落雷警告階段無傷害)
    for (const b of this.enemyBullets) {
      if (b.dead || b.warnT > 0 || this.player.dead) continue;
      if (this.player.fireShieldT > 0 && this.player.fireShieldHits > 0 &&
          aabbOverlap(b, this.player.fireShieldBounds())) {
        b.dead = true;
        this.player.fireShieldHits--;
        if (this.player.fireShieldHits <= 0) this.player.fireShieldT = 0;
        spawnExplosion(this, b.x + b.w / 2, b.y + b.h / 2);
        SFX.play('flame');
        continue;
      }
      if (this.player.invulnTimer <= 0 && b.overlaps(this.player.hurtbox)) {
        b.dead = true;
        if (b.freezePlayer) {
          // 冰凍彈:不扣血,直接凍住(連打按鍵掙脫)
          if (this.player.frozenT <= 0) {
            this.player.frozenT = PLAYER_FREEZE_FRAMES;
            this.player.climbing = false;
            SFX.play('freeze');
          }
        } else {
          this.player.hurt(this, b.x + b.w / 2, b.damage);
          if (b.burn) { this.player.burnT = PLAYER_BURN_FRAMES; SFX.play('flame'); }
        }
      }
    }
    // 接觸傷害(凍結中與剛解凍的敵人無害——凍住的可以放心踩)
    // 注意 frozenT 可能是 undefined(從未被凍過),必須用 !(x > 0) 判斷
    for (const e of this.enemies) {
      if (!e.dead && !(e.frozenT > 0) && !(e.thawGrace > 0) &&
          !this.player.dead && aabbOverlap(e, this.player.hurtbox)) {
        this.player.hurt(this, e.x + e.w / 2, e.contactDamage);
      }
    }
    if (this.boss && this.bossActive && !this.boss.dead && !(this.boss.transitionT > 0) && !this.player.dead &&
        aabbOverlap(this.boss, this.player.hurtbox)) {
      this.player.hurt(this, this.boss.x + this.boss.w / 2, DMG_BOSS_CONTACT);
    }
    if (this.boss && this.bossActive && !this.boss.dead && !this.player.dead &&
        typeof this.boss.hazardRects === 'function' &&
        this.boss.hazardRects().some((r) => aabbOverlap(r, this.player.hurtbox))) {
      this.player.hurt(this, this.boss.x + this.boss.w / 2, 4);
    }

    this.enemies = this.enemies.filter((e) => !e.dead);
    this.traps = this.traps.filter((t) => !t.dead);
    this.playerBullets = this.playerBullets.filter((b) => !b.dead);
    this.enemyBullets = this.enemyBullets.filter((b) => !b.dead);
    this.pickups = this.pickups.filter((p) => !p.dead);
    this.particles = this.particles.filter((p) => !p.dead);

    if (enemyTimeStop && this.timeStopT <= 0) this.timeStopSource = null;
    if (playerTimeStop && this.playerTimeStopT <= 0) this.timeStopSource = null;

    this.updateCamera(false);
  }

  // Boss 進場:鏡頭滑進房間 → 玩家自動走入 → 門關閉 → 血條逐格填滿
  updateIntro() {
    const roomCamX = this.map.widthPx - SCREEN_W;
    if (this.introPhase === 'slide') {
      // 玩家自動走入
      this.player.vx = PLAYER_RUN_SPEED;
      this.player.facing = 1;
      this.player.vy = Math.min(this.player.vy + GRAVITY, MAX_FALL);
      const res = moveWithCollision(this.player, this.map);
      this.player.grounded = res.grounded;
      this.player.animT++;
      if (this.player.x > this.map.doorX + 40) this.player.vx = 0;
      // 鏡頭滑動(垂直關卡同時滑向 Boss 房高度)
      this.camera.x = Math.min(this.camera.x + 3, roomCamX);
      const roomCamY = this.bossCamY();
      this.camera.y += Math.max(-4, Math.min(4, roomCamY - this.camera.y));
      if (this.camera.x >= roomCamX && Math.abs(this.camera.y - roomCamY) < 1 &&
          this.player.x > this.map.doorX + 36) {
        this.map.doorClosed = true;
        this.player.vx = 0;
        if (this.boss && this.boss.shadowClone) {
          // 暗影複製體由畫面上方落下，再與玩家同姿勢停頓一秒。
          this.introPhase = 'shadowDrop';
          this.introT = 0;
          this.boss.y = 48;
          this.boss.vx = 0; this.boss.vy = 0; this.boss.grounded = false;
        } else {
          this.introPhase = 'fill';
          this.boss && (this.boss.hpShown = 0);
        }
      }
    } else if (this.introPhase === 'shadowDrop') {
      this.player.vx = 0;
      this.boss.animT++;
      const r = this.boss.moveLikePlayer(this);
      if (r.grounded) {
        this.boss.vx = 0;
        this.boss.facePlayer(this);
        this.introPhase = 'shadowPose';
        this.introT = 60;
        SFX.play('land');
        this.shake(5);
      }
    } else if (this.introPhase === 'shadowPose') {
      this.player.vx = 0;
      this.player.animT++;
      this.boss.animT++;
      this.boss.facePlayer(this);
      if (--this.introT <= 0) {
        this.introPhase = 'fill';
        this.boss.hpShown = 0;
      }
    } else if (this.introPhase === 'fill') {
      if (this.boss) {
        this.boss.animT++;
        if (this.worldT % 3 === 0 && this.boss.hpShown < BOSS_HP) {
          this.boss.hpShown++;
          SFX.play('tick');
        }
        if (this.boss.hpShown >= BOSS_HP) {
          this.state = 'play';
          this.inputLocked = false;
          this.bossActive = true;
          this.boss.setState('idle');
        }
      } else {
        this.state = 'play'; this.inputLocked = false;
      }
    }
  }

  updateSelect() {
    const available = [0, 1, 2, 3];
    if (this.fortressUnlocked()) available.push(4);
    if (this.shadowUnlocked()) available.push(5);
    if (this.cleared.has(5)) available.push(6);   // 最後決戰：通關鏡像要塞後開放
    if (!available.includes(this.selCursor)) this.selCursor = 0;
    let delta = 0;
    if (Input.pressed('left') || Input.pressed('up')) delta = -1;
    if (Input.pressed('right') || Input.pressed('down')) delta = 1;
    if (delta) {
      const at = available.indexOf(this.selCursor);
      this.selCursor = available[(at + delta + available.length) % available.length];
      SFX.play('tick');
    }
    if (Input.pressed('weapon')) {
      Input.toggleSwap();
      SFX.play('wswitch');
    }
    if (Input.pressed('jump') || Input.pressed('shoot')) {
      SFX.play('charged');
      this.startStage(this.selCursor);
    }
  }

  fortressUnlocked() {
    return [0, 1, 2, 3].every((i) => this.cleared.has(i));
  }

  shadowUnlocked() {
    return this.fortressUnlocked() && this.cleared.has(4);
  }

  updateVictory() {
    this.victoryT++;
    if (this.victoryT === 130) SFX.play('weaponGet'); // 獲得武器音效
    // 勝利後按跳躍 → 標記通關(解鎖武器),回選關畫面
    if (this.victoryT > 160 && Input.pressed('jump')) {
      this.cleared.add(this.stageIndex);
      this.saveProgress();
      this.returnToSelect();
      SFX.play('pickup');
      return;
    }
    // 勝利定格:一切凍結,只有爆炸粒子
    if (this.victoryT < 120 && this.victoryT % 9 === 0 && this.bossCorpse) {
      const c = this.bossCorpse;
      if (c.shadow) spawnShadowCollapse(this, c, 7);
      else spawnExplosion(this, c.x + RNG.next() * c.w, c.y + RNG.next() * c.h, true);
    }
    for (const pt of this.particles) pt.update();
    this.particles = this.particles.filter((p) => !p.dead);
  }

  // Boss 房鏡頭鎖定高度:由房間地板反推(水平關卡恆為 0)
  bossCamY() {
    const maxY = Math.max(0, this.map.heightPx - SCREEN_H);
    return Math.max(0, Math.min(this.map.bossFloorY + 2 * TILE - SCREEN_H, maxY));
  }

  updateCamera(snap) {
    const maxX = Math.max(0, this.map.widthPx - SCREEN_W);
    const maxY = Math.max(0, this.map.heightPx - SCREEN_H);
    const pcx = this.player.x + this.player.w / 2;
    const pcy = this.player.y + this.player.h / 2;
    if (this.bossActive || this.introPhase === 'fill') {
      this.camera.x = maxX;
      this.camera.y = this.bossCamY();
      return;
    }
    if (snap) {
      this.camera.x = Math.max(0, Math.min(pcx - SCREEN_W / 2, maxX));
      this.camera.y = Math.max(0, Math.min(pcy - SCREEN_H / 2, maxY));
    } else {
      const sx = pcx - this.camera.x;
      if (sx < CAMERA_DEAD_LEFT) this.camera.x = pcx - CAMERA_DEAD_LEFT;
      else if (sx > CAMERA_DEAD_RIGHT) this.camera.x = pcx - CAMERA_DEAD_RIGHT;
      this.camera.x = Math.max(0, Math.min(this.camera.x, maxX));
      const sy = pcy - this.camera.y;
      if (sy < CAMERA_DEAD_TOP) this.camera.y = pcy - CAMERA_DEAD_TOP;
      else if (sy > CAMERA_DEAD_BOTTOM) this.camera.y = pcy - CAMERA_DEAD_BOTTOM;
      this.camera.y = Math.max(0, Math.min(this.camera.y, maxY));
    }
  }

  // 洛克人式選關畫面:Boss 大頭照面板 + 游標
  drawSelect(ctx) {
    const t = worldFrame();
    const fortressOpen = this.fortressUnlocked();
    const shadowOpen = this.shadowUnlocked();
    ctx.fillStyle = '#0a0a22'; ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
    ctx.fillStyle = 'rgba(60,70,140,0.18)';
    for (let x = 0; x < SCREEN_W; x += 16) ctx.fillRect(x, 0, 1, SCREEN_H);
    for (let y = 0; y < SCREEN_H; y += 16) ctx.fillRect(0, y, SCREEN_W, 1);
    this.drawText(ctx, 'SELECT STAGE', SCREEN_W / 2, 18);
    this.drawText(ctx, 'LIVES ' + this.lives, 31, 18);

    // 前四關維持 2×2；Boss 放大後改用 1 倍肖像，避免裁切。
    for (let i = 0; i < 4; i++) {
      const lv = LEVELS[i], pw = 74, ph = 58;
      const px = 24 + (i % 2) * 134;
      const py = 30 + ((i / 2) | 0) * 68;
      ctx.fillStyle = '#000018'; ctx.fillRect(px, py, pw, ph);
      const sel = i === this.selCursor;
      ctx.fillStyle = sel ? (((t >> 3) & 1) ? '#f8d820' : '#f8f8f8') : '#3a3a5a';
      ctx.fillRect(px - 2, py - 2, pw + 4, 2); ctx.fillRect(px - 2, py + ph, pw + 4, 2);
      ctx.fillRect(px - 2, py, 2, ph); ctx.fillRect(px + pw, py, 2, ph);
      const name = lv.bossConfig.sprite, spr = SPRITES[name];
      drawSprite(ctx, name, px + ((pw - spr.w) >> 1), py + 3, {
        frame: sel && ((t >> 4) & 1) ? 'idle2' : 'idle1',
      });
      this.drawText(ctx, lv.name, px + pw / 2, py + ph - 3);
      if (this.cleared.has(i)) this.drawText(ctx, 'CLEAR', px + pw / 2, py + 12);
    }

    // 要塞兩關依序解鎖：先時間賽道，再進入暗影核心。
    {
      const lv = LEVELS[4], px = 14, py = 166, pw = 108, ph = 48;
      ctx.fillStyle = fortressOpen ? '#080c20' : '#101018'; ctx.fillRect(px, py, pw, ph);
      const sel = fortressOpen && this.selCursor === 4;
      ctx.fillStyle = sel ? (((t >> 3) & 1) ? '#f8d820' : '#f8f8f8') : (fortressOpen ? '#6078a8' : '#303038');
      ctx.fillRect(px - 2, py - 2, pw + 4, 2); ctx.fillRect(px - 2, py + ph, pw + 4, 2);
      ctx.fillRect(px - 2, py, 2, ph); ctx.fillRect(px + pw, py, 2, ph);
      const spr = SPRITES[lv.bossConfig.sprite];
      if (fortressOpen) drawSprite(ctx, lv.bossConfig.sprite, px + 6, py + ((ph - spr.h) >> 1), {
        frame: sel && ((t >> 4) & 1) ? 'idle2' : 'idle1',
      });
      this.drawText(ctx, 'CHRONO', px + 75, py + 18);
      this.drawText(ctx, this.cleared.has(4) ? 'CLEAR' : (fortressOpen ? 'FORT 1' : 'LOCKED'), px + 75, py + 35);
    }
    {
      const px = 134, py = 166, pw = 108, ph = 48;
      ctx.fillStyle = shadowOpen ? '#100a20' : '#101018'; ctx.fillRect(px, py, pw, ph);
      const sel = shadowOpen && this.selCursor === 5;
      ctx.fillStyle = sel ? (((t >> 3) & 1) ? '#a848b8' : '#f8f8f8') : (shadowOpen ? '#604878' : '#303038');
      ctx.fillRect(px - 2, py - 2, pw + 4, 2); ctx.fillRect(px - 2, py + ph, pw + 4, 2);
      ctx.fillRect(px - 2, py, 2, ph); ctx.fillRect(px + pw, py, 2, ph);
      if (shadowOpen) {
        ctx.save();
        ctx.translate(px + 8, py + 9); ctx.scale(2, 2);
        drawSprite(ctx, 'player', 0, 0, { frame: 'idle', remap: SHADOW_REMAP });
        ctx.restore();
      }
      this.drawText(ctx, 'MIRROR', px + 76, py + 18);
      this.drawText(ctx, this.cleared.has(5) ? 'CLEAR' : (shadowOpen ? 'FORT 2' : 'LOCKED'), px + 76, py + 35);
    }

    // 最後決戰（Boss Rush）：通關鏡像要塞後，於底部顯示可選長條。
    if (this.cleared.has(5)) {
      const bx = 14, by = 214, bw = 228, bh = 17;
      ctx.fillStyle = '#1e1230'; ctx.fillRect(bx, by, bw, bh);
      const sel = this.selCursor === 6;
      ctx.fillStyle = sel ? (((t >> 3) & 1) ? '#f85868' : '#f8f8f8') : '#7a3a7a';
      ctx.fillRect(bx - 2, by - 2, bw + 4, 2); ctx.fillRect(bx - 2, by + bh, bw + 4, 2);
      ctx.fillRect(bx - 2, by, 2, bh); ctx.fillRect(bx + bw, by, 2, bh);
      this.drawText(ctx, 'FINAL FORTRESS - BOSS RUSH', SCREEN_W / 2, by + 6);
    } else {
      this.drawText(ctx, 'ARROWS: SELECT  JUMP: START', SCREEN_W / 2, 224);
    }
    this.drawText(ctx, 'Q: SWAP Z/X  ' + (Input.swapped ? 'SWAPPED' : 'NORMAL'), SCREEN_W / 2, 238);
  }

  draw(ctx) {
    if (this.state === 'select') { this.drawSelect(ctx); return; }
    ctx.save();
    if (this.shakeT > 0) {
      const s = hash32(this.worldT * 17 + this.shakeT * 31);
      ctx.translate((s & 3) - 2, ((s >> 3) & 3) - 2);
    }

    drawBackground(ctx, this.camera.x, this.theme);
    ctx.save();
    // 世界層整體垂直位移:所有實體照舊以世界 y 繪製,鏡頭 y 由此統一處理
    ctx.translate(0, -Math.round(this.camera.y));
    this.map.draw(ctx, this.camera);
    this.drawFrozenMagmaStructures(ctx, this.camera);
    if (this.rush && this.rush.mode === 'hub') this.drawRush(ctx);
    for (const p of this.pickups) p.draw(ctx, this.camera);
    for (const tr of this.traps) tr.draw(ctx, this.camera);
    for (const e of this.enemies) {
      e.draw(ctx, this.camera);
      if (e.frozenT > 0) { // 凍結中:覆蓋冰藍;快解凍時閃爍警告
        if (e.frozenT < 30 && (e.frozenT >> 2) & 1) continue;
        ctx.fillStyle = 'rgba(160,232,248,0.55)';
        ctx.fillRect(Math.round(e.x - this.camera.x) - 1, Math.round(e.y) - 1, e.w + 2, e.h + 2);
      }
    }
    if (this.boss && (this.bossActive || (this.introPhase && this.introPhase !== 'slide')) && this.state !== 'victory') {
      this.boss.draw(ctx, this.camera);
    }
    if (this.state === 'ready' && this.readyT > 38) {
      const remap = this.currentWeaponId() === 'buster' ? null : {
        '#00a8f0': WEAPONS[this.currentWeaponId()].color,
        '#0060c0': WEAPONS[this.currentWeaponId()].color2,
        '#80d0ff': WEAPONS[this.currentWeaponId()].color,
      };
      drawSprite(ctx, 'player', this.player.x - this.camera.x, this.player.y,
        { frame: 'idle', remap });
    } else {
      this.player.draw(ctx, this.camera);
    }
    for (const b of this.playerBullets) b.draw(ctx, this.camera);
    for (const b of this.enemyBullets) b.draw(ctx, this.camera);
    for (const pt of this.particles) pt.draw(ctx, this.camera);

    // 二段式熔岩：第一次只淹底層，停留後再次警告才升到高位。
    if (this.levelData.lavaTide) {
      const st = lavaTideState(this.worldT);
      const lavaW = Math.max(0, Math.min(SCREEN_W, this.map.doorX - this.camera.x));
      const surfaceY = lavaSurfaceForState(st);
      if (surfaceY !== null && lavaW > 0) {
        const t = this.worldT;
        // 大型漲潮永遠維持熔岩，不受冰武器影響。
        ctx.fillStyle = 'rgba(248,56,0,0.75)';
        ctx.fillRect(0, surfaceY, lavaW, SCREEN_H - surfaceY);
        ctx.fillStyle = ((t >> 3) & 1) ? '#f8a838' : '#f8d820';
        for (let x = 0; x < lavaW; x += 8) {
          ctx.fillRect(x, surfaceY - (((x + (t >> 1)) >> 3) & 1) * 2, 8, 3);
        }
      }
      if ((st === 'warnLow' || st === 'warnHigh') && lavaW > 0) {
        ctx.fillStyle = '#f87838'; // 岩漿冒泡預警
        for (let i = 0; i < 10; i++) {
          const s = hash32(i + (this.worldT >> 3));
          const x = s % Math.max(1, lavaW);
          const baseY = st === 'warnHigh' ? LAVA_LOW_SURFACE_Y - 2 : 232;
          ctx.fillRect(x, baseY - (s >> 8) % 10, 2, 2);
        }
      }
    }

    ctx.restore();
    ctx.restore();
    if (this.boss && this.boss.shadowClone && this.boss.transitionT > 0 && ((this.boss.transitionT >> 2) & 1)) {
      ctx.fillStyle = this.boss.phase === 2 ? 'rgba(96,64,144,0.28)' : 'rgba(200,72,96,0.3)';
      ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
    }
    this.drawHud(ctx);

    const bossStopWarning = this.bossActive && this.state === 'play' && this.boss &&
      this.boss.state === 'windup' && this.boss.pending === 'timeStop';
    const courseStopWarning = !this.bossActive && this.stageStopWarnT > 0;
    if (courseStopWarning || (bossStopWarning && this.boss.stopPattern === 'low')) {
      // 地面輪胎突進：用三個向上箭頭提示玩家在紅燈前起跳。
      const px = Math.round(this.player.x + this.player.w / 2 - this.camera.x);
      ctx.fillStyle = ((this.frame >> 2) & 1) ? '#f83800' : '#f8d820';
      for (const dx of [-18, 0, 18]) {
        ctx.fillRect(px + dx - 1, 181, 3, 13);
        ctx.fillRect(px + dx - 5, 181, 11, 3);
        ctx.fillRect(px + dx - 3, 178, 7, 3);
        ctx.fillRect(px + dx - 1, 175, 3, 3);
      }
      ctx.fillStyle = 'rgba(248,56,0,0.22)'; ctx.fillRect(0, 202, SCREEN_W, 7);
    }
    if (this.timeStopT > 0) {
      ctx.fillStyle = 'rgba(80,120,180,0.24)'; ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
    } else if (this.playerTimeStopT > 0) {
      ctx.fillStyle = 'rgba(216,232,248,0.2)'; ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
    }
    this.drawTrafficLight(ctx);

    if (this.state === 'ready' && (this.readyT >> 3) & 1) {
      this.drawText(ctx, 'READY', SCREEN_W / 2, 114);
      this.drawText(ctx, this.levelData.name, SCREEN_W / 2, 130);
    }
    // Boss 進場名牌：血條填充階段以橫幅揭示 Boss 名。
    if (this.state === 'intro' && this.boss &&
        (this.introPhase === 'fill' || this.introPhase === 'shadowPose')) {
      const name = BOSS_NAMES[(this.levelData.bossConfig || {}).style] || 'BOSS';
      const by = 40;
      ctx.fillStyle = 'rgba(8,6,18,0.85)'; ctx.fillRect(0, by, SCREEN_W, 18);
      ctx.fillStyle = '#f83800'; ctx.fillRect(0, by, SCREEN_W, 1); ctx.fillRect(0, by + 17, SCREEN_W, 1);
      ctx.fillStyle = '#f8d820'; ctx.fillRect(0, by + 1, SCREEN_W, 1);
      this.drawText(ctx, name, SCREEN_W / 2, by + 6);
    }
    if (this.weakFlashT > 0 && (this.weakFlashT >> 2) & 1) {
      this.drawText(ctx, 'WEAKNESS!', SCREEN_W / 2, 92);
    }
    if (this.state === 'victory') {
      if (this.victoryT > 100) {
        this.drawText(ctx, 'VICTORY!', SCREEN_W / 2, 104);
        const wid = this.levelData.weapon;
        if (this.victoryT > 130 && wid) {
          this.drawText(ctx, 'YOU GOT: ' + WEAPONS[wid].label, SCREEN_W / 2, 124);
        } else if (this.victoryT > 130 && this.levelData.penultimate) {
          this.drawText(ctx, 'SHADOW CORE DESTROYED', SCREEN_W / 2, 124);
        }
        if (this.victoryT > 160) this.drawText(ctx, 'PRESS JUMP TO CONTINUE', SCREEN_W / 2, 144);
      }
    }
    // ── Boss Rush（最後決戰）介面 ──
    if (this.rush && this.rush.mode === 'hub' && this.state === 'play') {
      this.drawText(ctx, 'FINAL FORTRESS', SCREEN_W / 2, 12);
      this.drawText(ctx, 'CLEARED ' + this.rush.defeated.size + '/' + RUSH_BOSSES.length, SCREEN_W / 2, 24);
      const pb = this.player.hurtbox;
      let labeled = false;
      for (const cap of this.capsules) {           // 站在膠囊上時揭示 Boss 名與操作提示
        if (!aabbOverlap(pb, cap.rect)) continue;
        const sx = cap.rect.x + cap.rect.w / 2 - this.camera.x;
        if (this.rush.defeated.has(cap.idx)) this.drawText(ctx, 'DEFEATED', sx, cap.rect.y - 8);
        else {
          this.drawText(ctx, cap.boss.name, sx, cap.rect.y - 14);
          if ((this.frame >> 3) & 1) this.drawText(ctx, 'UP: FIGHT', sx, cap.rect.y - 4);
        }
        labeled = true; break;
      }
      if (!labeled && this.rushAllCleared()) {      // 中央通道提示
        const pr = this.rushPortalRect();
        if (aabbOverlap(pb, pr)) {
          if ((this.frame >> 3) & 1) this.drawText(ctx, 'UP: FINAL BOSS', pr.x + pr.w / 2 - this.camera.x, pr.y - 8);
        } else if ((this.frame >> 3) & 1) {
          this.drawText(ctx, 'PATH OPEN', pr.x + pr.w / 2 - this.camera.x, pr.y - 8);
        }
      }
    }
    if (this.rush && this.rush.mode === 'fight' && this.rushReturnT > 0) {
      this.drawText(ctx, 'CHAMBER CLEAR', SCREEN_W / 2, 92);
      this.drawText(ctx, 'GRAB SUPPLIES', SCREEN_W / 2, 106);
      if ((this.frame >> 3) & 1) this.drawText(ctx, 'RETURNING...', SCREEN_W / 2, 126);
    }
    if (this.state === 'rushclear') {
      ctx.fillStyle = 'rgba(8,6,18,0.72)'; ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
      this.drawText(ctx, 'BOSS RUSH CLEAR!', SCREEN_W / 2, 92);
      this.drawText(ctx, 'FINAL BATTLE', SCREEN_W / 2, 114);
      this.drawText(ctx, 'COMING SOON', SCREEN_W / 2, 126);
      if (this.victoryT > 90 && ((this.frame >> 3) & 1)) this.drawText(ctx, 'PRESS JUMP', SCREEN_W / 2, 152);
    }
    if (this.state === 'gameover') {
      this.drawPanel(ctx, 46, 72, 164, 96);
      this.drawText(ctx, 'GAME OVER', SCREEN_W / 2, 102);
      this.drawText(ctx, 'LIVES 0', SCREEN_W / 2, 125);
      if (this.stateTimer > 55 && (this.stateTimer >> 4) & 1) {
        this.drawText(ctx, 'PRESS JUMP', SCREEN_W / 2, 150);
      }
    }
    if (this.state === 'pause') this.drawPause(ctx);
    if (this.state === 'weaponMenu') this.drawWeaponMenu(ctx);
    if (SFX.isMuted()) this.drawText(ctx, 'MUTE', 232, 10);
  }

  drawPanel(ctx, x, y, w, h) {
    ctx.fillStyle = 'rgba(0,0,20,0.94)'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#f8f8f8';
    ctx.fillRect(x, y, w, 2); ctx.fillRect(x, y + h - 2, w, 2);
    ctx.fillRect(x, y, 2, h); ctx.fillRect(x + w - 2, y, 2, h);
    ctx.fillStyle = '#303878';
    ctx.fillRect(x + 3, y + 3, w - 6, 2); ctx.fillRect(x + 3, y + h - 5, w - 6, 2);
  }

  drawPause(ctx) {
    this.drawPanel(ctx, 42, 30, 172, 182);
    this.drawText(ctx, 'PAUSED', 128, 52);
    const options = [
      'RESUME',
      'RESTART STAGE',
      'SOUND: ' + (SFX.isMuted() ? 'OFF' : 'ON'),
      'Z/X: ' + (Input.swapped ? 'SWAPPED' : 'NORMAL'),
      'RETURN TO SELECT',
    ];
    options.forEach((label, i) => {
      if (i === this.pauseCursor) this.drawText(ctx, '>', 59, 79 + i * 25);
      this.drawText(ctx, label, 132, 79 + i * 25);
    });
  }

  drawWeaponMenu(ctx) {
    this.drawPanel(ctx, 34, 18, 188, 214);
    this.drawText(ctx, 'WEAPON SELECT', 128, 38);
    const list = this.unlockedWeapons();
    list.forEach((id, i) => {
      const y = 54 + i * 25;
      if (i === this.weaponMenuCursor) this.drawText(ctx, '>', 52, y);
      ctx.fillStyle = WEAPONS[id].color; ctx.fillRect(62, y - 8, 10, 10);
      this.drawText(ctx, WEAPONS[id].label, 126, y);
      const ammo = id === 'buster' ? WEAPON_AMMO_MAX : this.ammo[id];
      ctx.fillStyle = '#282830'; ctx.fillRect(76, y + 5, 104, 4);
      ctx.fillStyle = WEAPONS[id].color; ctx.fillRect(76, y + 5, Math.round(104 * ammo / WEAPON_AMMO_MAX), 4);
    });
    this.drawText(ctx, 'JUMP/FIRE: EQUIP', 128, 216);
  }

  // 洛克人式直條血量:28 格由下往上
  drawEnergyBar(ctx, x, hp, color) {
    ctx.fillStyle = '#000000';
    ctx.fillRect(x - 1, 15, 10, 58);
    for (let i = 0; i < 28; i++) {
      ctx.fillStyle = i < hp ? color : '#282830';
      ctx.fillRect(x, 72 - i * 2, 8, 1);
    }
    ctx.fillStyle = '#f8f8f8';
    ctx.fillRect(x - 1, 15, 10, 1); ctx.fillRect(x - 1, 73, 10, 1);
    ctx.fillRect(x - 1, 15, 1, 59); ctx.fillRect(x + 9, 15, 1, 59);
  }

  // Boss Rush 傳送房：6 個膠囊（已擊敗者熄滅）＋ 中央通道（全部擊敗後開啟）。
  drawRush(ctx) {
    const cam = this.camera.x, t = this.worldT;
    const glow = { bat: '#00c0f0', kong: '#48d848', wraith: '#88d8f8', djinn: '#f87838', chrono: '#f8d820', shadow: '#b060e8' };
    for (const cap of this.capsules) {
      const x = Math.round(cap.rect.x - cam), y = cap.rect.y, w = cap.rect.w, h = cap.rect.h;
      const done = this.rush.defeated.has(cap.idx);
      const col = glow[cap.boss.style] || '#00c0f0';
      ctx.fillStyle = done ? '#242430' : '#3a3a56'; ctx.fillRect(x, y, w, h);          // 外殼
      ctx.fillStyle = done ? '#15151d' : '#1c1c34'; ctx.fillRect(x + 3, y + 4, w - 6, h - 8); // 玻璃管
      ctx.fillStyle = done ? '#2a2a38' : '#5a5a80';                                    // 頂座 / 底座
      ctx.fillRect(x - 1, y - 2, w + 2, 4); ctx.fillRect(x - 1, y + h - 3, w + 2, 5);
      if (done) {
        ctx.fillStyle = '#50506a';
        for (let i = -6; i <= 6; i += 2) {
          ctx.fillRect(x + (w >> 1) + i - 1, y + (h >> 1) + i - 1, 2, 2);
          ctx.fillRect(x + (w >> 1) + i - 1, y + (h >> 1) - i - 1, 2, 2);
        }
        continue;
      }
      const spr = SPRITES[cap.boss.sprite];                                            // 內部 Boss 剪影
      if (spr) {
        const scale = Math.min(2, (w - 6) / spr.w, (h - 10) / spr.h);
        const frame = cap.boss.style === 'shadow' ? 'idle' : (((t >> 4) & 1) ? 'idle1' : 'idle2');
        const remap = cap.boss.style === 'shadow' ? SHADOW_REMAP : null;
        ctx.save();
        ctx.translate(x + w / 2 - (spr.w * scale) / 2, y + h - 6 - spr.h * scale);
        if (scale !== 1) ctx.scale(scale, scale);
        drawSprite(ctx, cap.boss.sprite, 0, 0, { frame, remap });
        ctx.restore();
      }
      ctx.save();                                                                      // 前方染色玻璃 + 脈動
      ctx.globalAlpha = 0.14 + 0.09 * (((t >> 2) & 3) / 3);
      ctx.fillStyle = col; ctx.fillRect(x + 3, y + 4, w - 6, h - 8);
      ctx.restore();
      ctx.fillStyle = col; ctx.fillRect(x + 2, y + 3, w - 4, 1);
      if ((t >> 3) & 1) { ctx.fillRect(x + 2, y + 4, 1, h - 8); ctx.fillRect(x + w - 3, y + 4, 1, h - 8); }
    }
    const pr = this.rushPortalRect();                                                  // 中央通道
    const px = Math.round(pr.x - cam), py = pr.y, pw = pr.w, ph = pr.h;
    const open = this.rushAllCleared();
    ctx.fillStyle = open ? '#3a2060' : '#1a1a26'; ctx.fillRect(px - 2, py - 2, pw + 4, ph + 4);
    if (open) {
      ctx.save();
      ctx.globalAlpha = 0.32 + 0.2 * (((t >> 2) & 3) / 3);
      ctx.fillStyle = '#c060f8'; ctx.fillRect(px, py, pw, ph);
      ctx.restore();
      ctx.fillStyle = '#f0c0ff';
      for (let i = 0; i < 5; i++) ctx.fillRect(px + 4 + ((i * 6) % (pw - 8)), py + ((t * 2 + i * 20) % ph), 2, 4);
      ctx.fillStyle = '#c060f8'; ctx.fillRect(px, py, pw, 2); ctx.fillRect(px, py + ph - 2, pw, 2);
    } else {
      ctx.fillStyle = '#3a3a52';
      for (let ry = 0; ry < ph; ry += 6) ctx.fillRect(px, py + ry, pw, 4);
      ctx.fillStyle = '#6a2a2a'; ctx.fillRect(px + (pw >> 1) - 3, py + (ph >> 1) - 3, 6, 6);
    }
  }

  drawHud(ctx) {
    this.drawEnergyBar(ctx, 16, this.player.hp, '#f8d820');
    // 選了 Boss 武器時,旁邊顯示該武器彈藥條(武器色)
    const wid = this.currentWeaponId();
    if (wid !== 'buster') this.drawEnergyBar(ctx, 30, this.ammo[wid], WEAPONS[wid].color);
    drawSprite(ctx, 'extraLife', 46, 16, { frame: 'default' });
    bitmapText(ctx, 'X' + this.lives, 70, 25, '#f8f8f8');
    if (this.boss && (this.bossActive || this.introPhase === 'fill')) {
      const hp = this.state === 'intro' ? this.boss.hpShown : this.boss.hp;
      this.drawEnergyBar(ctx, 234, hp, '#f83800');
    }
  }

  trafficSignalPhase() {
    if (this.timeStopT > 0 && this.timeStopSource !== 'player') return 'red';
    const bossWarn = this.bossActive && this.state === 'play' && this.boss &&
      this.boss.state === 'windup' && this.boss.pending === 'timeStop';
    if (this.stageStopWarnT > 0 || bossWarn) {
      const remain = bossWarn
        ? Math.max(1, CHRONO_STOP_WARN_FRAMES - this.boss.stateT)
        : this.stageStopWarnT;
      if (remain <= 18 && ((this.frame >> 2) & 1) === 0) return 'red';
      return 'yellow';
    }
    return 'green';
  }

  drawTrafficLight(ctx) {
    if (!this.levelData.timeSurges || !['ready', 'play', 'intro'].includes(this.state)) return;
    const phase = this.trafficSignalPhase();
    const x = SCREEN_W / 2 - 18, y = 6;
    ctx.fillStyle = '#080a0c'; ctx.fillRect(x, y, 36, 13);
    ctx.fillStyle = '#707078';
    ctx.fillRect(x, y, 36, 1); ctx.fillRect(x, y + 12, 36, 1);
    ctx.fillRect(x, y, 1, 13); ctx.fillRect(x + 35, y, 1, 13);
    const lamps = [
      { name: 'red', x: x + 4, on: '#f83800', off: '#481008' },
      { name: 'yellow', x: x + 15, on: '#f8d820', off: '#484008' },
      { name: 'green', x: x + 26, on: '#00d848', off: '#084818' },
    ];
    for (const lamp of lamps) {
      ctx.fillStyle = phase === lamp.name ? lamp.on : lamp.off;
      ctx.fillRect(lamp.x, y + 3, 6, 7);
      if (phase === lamp.name) { ctx.fillStyle = '#f8f8f8'; ctx.fillRect(lamp.x + 1, y + 4, 2, 2); }
    }
  }

  drawFrozenMagmaStructures(ctx, camera) {
    for (const pool of this.frozenMagmaPools.values()) {
      const sx = pool.start * TILE - camera.x;
      const y = pool.row * TILE;
      const w = (pool.end - pool.start + 1) * TILE;
      if (sx + w < 0 || sx > SCREEN_W) continue;
      const warning = pool.t < 60 && ((this.frame >> 2) & 1);
      ctx.fillStyle = warning ? '#68a8c8' : '#68c8e8'; ctx.fillRect(sx, y, w, TILE);
      ctx.fillStyle = '#e8f8ff'; ctx.fillRect(sx, y, w, 3);
      ctx.fillStyle = '#285880'; ctx.fillRect(sx, y + 13, w, 3);
      for (let x = sx + 7; x < sx + w; x += 16) {
        ctx.fillRect(x, y + 4, 2, 6); ctx.fillRect(x + 2, y + 8, 5, 2);
      }
    }
    for (const jet of this.frozenMagmaJets.values()) {
      const sx = jet.col * TILE - camera.x;
      const y = (jet.row - 2) * TILE;
      if (sx + TILE < 0 || sx > SCREEN_W) continue;
      const warning = jet.t < 60 && ((this.frame >> 2) & 1);
      ctx.fillStyle = warning ? '#68a8c8' : '#68c8e8'; ctx.fillRect(sx, y, TILE, TILE * 3);
      ctx.fillStyle = '#e8f8ff'; ctx.fillRect(sx, y, TILE, 3);
      ctx.fillStyle = '#285880';
      for (let yy = y + 12; yy < y + TILE * 3; yy += 16) {
        ctx.fillRect(sx + 2, yy, 12, 2); ctx.fillRect(sx + 6, yy - 5, 2, 7);
      }
    }
  }

  drawText(ctx, text, cx, y) {
    bitmapText(ctx, text, cx + 1, y + 1, '#000');
    bitmapText(ctx, text, cx, y, '#f8f8f8');
  }
}

/* ================================================================
 * MODULE: main — canvas、整數倍縮放、固定 60fps 迴圈
 * ================================================================ */
(function () {
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // 觸控裝置:下方預留虛擬按鍵高度;桌面只留提示列
  const UI_RESERVE_DESKTOP = 24, UI_RESERVE_TOUCH = 186;
  function fitCanvas() {
    const reserve = TouchUI.active ? UI_RESERVE_TOUCH : UI_RESERVE_DESKTOP;
    let scale = Math.min(
      Math.floor(innerWidth / SCREEN_W),
      Math.floor((innerHeight - reserve) / SCREEN_H)
    );
    // 手機直向常常連 1 倍都放不下(或只能 1 倍太小)→ 允許非整數縮放
    if (TouchUI.active && scale < 2) {
      scale = Math.min(innerWidth / SCREEN_W, (innerHeight - reserve) / SCREEN_H);
    }
    scale = Math.max(scale, 0.75);
    canvas.style.width = Math.round(SCREEN_W * scale) + 'px';
    canvas.style.height = Math.round(SCREEN_H * scale) + 'px';
  }
  TouchUI.init();
  addEventListener('resize', fitCanvas);
  fitCanvas();

  Input.init();
  const game = new Game();

  // ── 測試掛鉤(headless 驗證用;不影響正常遊玩)
  window.__game = game;
  window.__touch = TouchUI;
  window.__pause = false;
  window.__step = (n = 1) => { for (let i = 0; i < n; i++) { game.update(); Input.endFrame(); } };
  window.__key = (code, down) => {
    if (down) { Input._down.add(code); Input._pressed.add(code); }
    else Input._down.delete(code);
  };

  const STEP = 1000 / 60;
  let last = performance.now();
  let acc = 0;

  function frame(now) {
    acc += now - last;
    last = now;
    if (acc > 100) acc = 100;
    if (!window.__pause) {
      while (acc >= STEP) {
        game.update();
        Input.endFrame();
        acc -= STEP;
      }
    } else {
      acc = 0;
    }
    game.draw(ctx);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
