function validateLevels(levels) {
  const known = new Set(Object.keys(TILE_PROPS));
  levels.forEach((lv, li) => {
    if (!lv.map.length) throw new Error(`Level ${li} has no map rows`);
    const width = lv.map[0].length;
    let players = 0, bosses = 0, doors = 0;
    lv.map.forEach((row, ri) => {
      if (row.length !== width) throw new Error(`${lv.name}: row ${ri} is ${row.length}, expected ${width}`);
      for (const ch of row) {
        if (!known.has(ch)) throw new Error(`${lv.name}: unknown tile '${ch}'`);
        if (ch === 'P') players++;
        if (ch === 'X') bosses++;
        if (ch === 'D') doors++;
      }
    });
    if (lv.bossRush) {
      // Boss Rush 傳送房：只需要玩家出生點；Boss 房與門是進膠囊後即時生成。
      if (players !== 1 || bosses !== 0) {
        throw new Error(`${lv.name}: boss rush hub expects 1 player and no boss tile`);
      }
    } else if (players !== 1 || bosses !== 1 || doors < 1) {
      throw new Error(`${lv.name}: expected 1 player, 1 boss and at least 1 door`);
    }
  });
}

// 亂數種子獨立設定，不改寫地圖幾何。冰峰為垂直關卡(鏡頭上下捲動)，其餘為水平房間。
LEVELS.forEach((level, index) => { level.seed = 0x1f123bb5 ^ (index * 0x9e3779b9); });
validateLevels(LEVELS);

/* ================================================================
 * MODULE: entities — 子彈 / 玩家 / 雜兵 / 道具 / 粒子
 * ================================================================ */
class Bullet {
  constructor(x, y, vx, vy, sprite, opts = {}) {
    const spr = SPRITES[sprite];
    this.x = x; this.y = y; this.w = spr.w; this.h = spr.h;
    this.vx = vx; this.vy = vy;
    this.sprite = sprite;
    this.damage = opts.damage || 1;
    this.big = !!opts.big;
    this.groundHug = !!opts.groundHug; // 震波/藤苗:貼地滑行,撞牆才消失
    this.gravity = opts.gravity || 0;  // 拋物線(種子/孢子/椰子)
    this.warnT = opts.warn || 0;       // 落雷:警告階段(不動、無傷害)
    this.pierce = !!opts.pierce;       // 貫通(閃電鏢)
    this.weapon = opts.weapon || null; // 武器種類(Boss 弱點判定)
    this.sprouts = !!opts.sprouts;     // 落地爆開成 2 株藤苗
    this.freeze = !!opts.freeze;       // 命中凍結敵人(冰波)
    this.magmaChill = !!opts.magmaChill; // 冰流可凍結小岩漿池與岩漿柱
    this.surfaceCrawl = !!opts.surfaceCrawl; // 沿地面延伸，遇牆轉為垂直向上
    this.crawlFacing = opts.crawlFacing || (vx < 0 ? -1 : 1);
    this.crawlMode = opts.startFalling ? 'fall' : 'horizontal'; // 空中施放先落地
    this.crawlSpeed = opts.crawlSpeed || Math.max(1, Math.abs(vx));
    this.chain = !!opts.chain;         // 落雷命中後隨機傳導鄰近敵人
    this.tint = opts.tint || null;     // 覆蓋色（暗影複製體的暗黑武器）
    this.noTerrain = !!opts.noTerrain; // 天降閃電：貫穿地形（不會卡在天花板/平台）
    this.iceTrail = [];
    this.trailLast = null;
    this.freezePlayer = !!opts.freezePlayer; // 命中冰凍玩家(冰霜妖靈)
    this.burn = !!opts.burn;           // 命中附加燒傷(熔爐魔神)
    this.timeProof = !!opts.timeProof; // 時間王飛彈：停時期間仍會移動
    this.courseTire = !!opts.courseTire;
    this.homing = opts.homing || 0;    // 追蹤加速度(雪花)
    this.maxSpeed = opts.maxSpeed || 2;
    this.bounce = opts.bounce || 0;    // 剩餘彈跳次數(熔岩火球)
    this.fromPlayer = !!opts.fromPlayer;
    this.life = opts.life || 0;        // >0 時倒數到期消失(藤苗)
    this.hitOnce = new Set();          // 貫通彈:同一目標只判一次
    this.dead = false;
    this.t = 0;
  }

  // 死亡 + 落地爆開藤苗(玩家種子與 Boss 種子共用)
  explode(game) {
    if (this.dead) return;
    this.dead = true;
    spawnExplosion(game, this.x + this.w / 2, this.y + this.h / 2);
    if (!this.sprouts) return;
    const fy = this.y + this.h - SPRITES.sprout.h;
    const queue = this.fromPlayer ? game.queuedPlayerBullets : game.queuedEnemyBullets;
    for (const dir of [-1, 1]) {
      queue.push(new Bullet(this.x + dir * 6, fy, dir * 1.7, 0, 'sprout', {
        damage: this.damage, groundHug: true, life: 110, // 更持久、更快的貼地藤苗
        weapon: this.weapon, fromPlayer: this.fromPlayer, tint: this.tint || undefined,
      }));
    }
  }

  iceBurst(game, steam = false) {
    const cx = this.x + this.w / 2, cy = this.y + this.h / 2;
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      game.particles.push(new Particle(cx, cy, Math.cos(a) * 1.2, Math.sin(a) * 1.2 - 0.3,
        24, steam ? (i & 1 ? '#f8f8f8' : '#b8d8e8') : (i & 1 ? '#e8f8ff' : '#68e8f8'), 2));
    }
  }

  meltIce(game) {
    if (this.dead) return;
    this.dead = true;
    this.iceBurst(game, true);
    SFX.play('flame');
  }

  recordIceTrail() {
    const cx = this.x + this.w / 2, cy = this.y + this.h / 2;
    if (this.trailLast && Math.hypot(cx - this.trailLast.x, cy - this.trailLast.y) < 5) return;
    const node = { x: this.x, y: this.y, mode: this.crawlMode };
    this.iceTrail.push(node);
    if (this.iceTrail.length > 64) this.iceTrail.shift();
    this.trailLast = { x: cx, y: cy };
  }

  overlaps(target) {
    if (aabbOverlap(this, target)) return true;
    if (!this.surfaceCrawl) return false;
    return this.iceTrail.some((node) => aabbOverlap({ x: node.x + 2, y: node.y + 2, w: this.w - 4, h: this.h - 4 }, target));
  }

  updateSurfaceCrawler(game) {
    const map = game.map;
    const dir = this.crawlFacing;
    const speed = this.crawlSpeed;
    this.recordIceTrail();

    // 大型漲潮岩漿只會融掉冰流，絕對不建立全畫面冰層。
    if (game.levelData.lavaTide && !game.bossActive) {
      const surface = lavaSurfaceForState(lavaTideState(game.worldT));
      if (surface !== null && this.y + this.h >= surface) { this.meltIce(game); return; }
      for (const jet of map.jets) {
        if (!aabbOverlap(this, jetRect(jet.col, jet.row))) continue;
        const wasFrozen = game.isFrozenMagmaJet(jet.col);
        if (game.freezeMagmaJet(jet.col) && !wasFrozen) {
          this.iceBurst(game);
          SFX.play('freeze');
        }
      }
    }

    if (this.crawlMode === 'fall') { // 空中施放：先落到地面，再開始貼地延伸
      this.y += 4;
      const col = Math.floor((this.x + this.w / 2) / TILE);
      const footRow = Math.floor((this.y + this.h) / TILE);
      if (map.solidAtCell(col, footRow)) {
        this.y = footRow * TILE - this.h;
        this.crawlMode = 'horizontal';
        this.vy = 0;
      } else if (this.y > map.heightPx + 32) {
        this.dead = true;
      }
      this.recordIceTrail();
      return;
    }
    if (this.crawlMode === 'horizontal') {
      const nextX = this.x + dir * speed;
      const frontX = dir > 0 ? nextX + this.w : nextX;
      const midY = this.y + this.h / 2;
      const wallCol = Math.floor(frontX / TILE);
      const wallRow = Math.floor(midY / TILE);
      if (map.solidAtCell(wallCol, wallRow)) {
        // 撞牆不消失，貼住牆面後轉成垂直冰流。
        this.x = dir > 0 ? wallCol * TILE - this.w : (wallCol + 1) * TILE;
        this.crawlMode = 'up';
        this.vx = 0; this.vy = -speed;
      } else {
        this.x = nextX;
        const col = Math.floor((this.x + this.w / 2) / TILE);
        const footRow = Math.floor((this.y + this.h + 1) / TILE);
        if (map.solidAtCell(col, footRow)) {
          this.y = footRow * TILE - this.h;
        } else if (map.solidAtCell(col, footRow + 1)) {
          this.y = (footRow + 1) * TILE - this.h;
        } else if (game.freezeMagmaPoolAtCol(col)) {
          this.y = (map.rows - 2) * TILE - this.h;
          this.iceBurst(game);
          SFX.play('freeze');
        } else {
          this.meltIce(game);
          return;
        }
      }
    } else { // 沿牆向上，越過牆頂後再恢復水平延伸
      const nextY = this.y - speed;
      const centerCol = Math.floor((this.x + this.w / 2) / TILE);
      if (map.solidAtCell(centerCol, Math.floor(nextY / TILE))) {
        this.dead = true;
        return;
      }
      const sideX = dir > 0 ? this.x + this.w + 1 : this.x - 1;
      const sideCol = Math.floor(sideX / TILE);
      const sideRow = Math.floor((nextY + this.h / 2) / TILE);
      if (map.solidAtCell(sideCol, sideRow)) {
        this.y = nextY;
      } else if (map.solidAtCell(sideCol, sideRow + 1)) {
        this.y = (sideRow + 1) * TILE - this.h;
        this.x = dir > 0 ? sideCol * TILE : (sideCol + 1) * TILE - this.w;
        this.crawlMode = 'horizontal';
        this.vx = dir * speed; this.vy = 0;
      } else {
        this.dead = true;
        return;
      }
    }

    this.recordIceTrail();
    const cx = this.x + this.w / 2, cy = this.y + this.h / 2;
    if (cx < game.camera.x - 32 || cx > game.camera.x + SCREEN_W + 32 ||
        cy < game.camera.y - 32 || cy > game.camera.y + SCREEN_H + 32) {
      this.dead = true;
    }
  }

  update(game) {
    this.t++;
    if (this.warnT > 0) {
      this.warnT--;
      return;
    } // 預警中:鎖定玩家但尚未落下
    if (this.life > 0 && --this.life <= 0) { this.dead = true; return; }
    if (this.surfaceCrawl) { this.updateSurfaceCrawler(game); return; }
    // 追蹤(雪花):朝玩家緩慢轉向,限最高速
    if (this.homing && !game.player.dead) {
      const px = game.player.x + game.player.w / 2, py = game.player.y + game.player.h / 2;
      const hx = this.x + this.w / 2, hy = this.y + this.h / 2;
      const d = Math.hypot(px - hx, py - hy) || 1;
      this.vx += ((px - hx) / d) * this.homing;
      this.vy += ((py - hy) / d) * this.homing;
      const sp = Math.hypot(this.vx, this.vy);
      if (sp > this.maxSpeed) { this.vx *= this.maxSpeed / sp; this.vy *= this.maxSpeed / sp; }
    }
    if (this.gravity) this.vy = Math.min(this.vy + this.gravity, MAX_FALL + 2);
    this.x += this.vx; this.y += this.vy;

    // 彈跳火球:落地反彈,次數用完才爆
    if (this.gravity && this.bounce > 0 && this.vy > 0) {
      const frow = Math.floor((this.y + this.h) / TILE);
      const fcol = Math.floor((this.x + this.w / 2) / TILE);
      if (game.map.solidAtCell(fcol, frow)) {
        this.y = frow * TILE - this.h;
        this.vy = -3.4;
        this.bounce--;
        return;
      }
    }

    const cx = this.x + this.w / 2, cy = this.y + this.h / 2;
    if (this.groundHug) {
      // 真正貼地：撞牆或遇到斷崖消失；可順著一格內的小落差往下。
      const fx = this.vx > 0 ? this.x + this.w : this.x;
      if (game.map.solidAtCell(Math.floor(fx / TILE), Math.floor(cy / TILE))) {
        this.dead = true;
      } else {
        const col = Math.floor(cx / TILE);
        const footRow = Math.floor((this.y + this.h + 1) / TILE);
        if (game.map.solidAtCell(col, footRow)) {
          this.y = footRow * TILE - this.h;
        } else if (game.map.solidAtCell(col, footRow + 1)) {
          this.y = (footRow + 1) * TILE - this.h;
        } else {
          this.dead = true;
        }
      }
    } else if (!this.noTerrain && game.map.solidAtCell(Math.floor(cx / TILE), Math.floor(cy / TILE))) {
      if (this.sprouts) this.explode(game);
      else if (this.gravity) { this.dead = true; spawnExplosion(game, cx, cy); }
      else this.dead = true;
    }
    if (cx < game.camera.x - 24 || cx > game.camera.x + SCREEN_W + 24 ||
        cy < game.camera.y - 32 || cy > game.camera.y + SCREEN_H + 32) this.dead = true;
  }

  draw(ctx, camera) {
    if (this.warnT > 0) { // 落雷警告:落點上方閃爍标记
      const sx = Math.round(this.x + this.w / 2 - camera.x);
      if ((this.warnT >> 2) & 1) return;
      ctx.fillStyle = '#f8d820';
      ctx.fillRect(sx - 3, 4, 6, 3); ctx.fillRect(sx - 1, 7, 2, 5);
      ctx.fillStyle = 'rgba(248,216,32,0.25)';
      ctx.fillRect(sx - 1, 12, 2, SCREEN_H - 40);
      return;
    }
    if (this.surfaceCrawl) {
      // 結晶化的冰霜脊：底冰 + 主體 + 交錯的冰晶尖 + 閃光
      const c0 = this.tint ? '#241640' : '#356ea8';  // 深
      const c1 = this.tint ? '#4a2c70' : '#78c0e8';  // 主體
      const c2 = this.tint ? '#7a5aa8' : '#c0ecff';  // 霜白
      const c3 = this.tint ? '#c0a8e8' : '#ffffff';  // 閃光
      for (let i = 0; i < this.iceTrail.length; i++) {
        const node = this.iceTrail[i];
        const sx = Math.round(node.x - camera.x), sy = Math.round(node.y);
        const seed = (i * 7 + (this.t >> 3)) & 3;
        if (node.mode === 'up') {
          ctx.fillStyle = c0; ctx.fillRect(sx + 3, sy, 6, 10);
          ctx.fillStyle = c1; ctx.fillRect(sx + 4, sy, 4, 10);
          ctx.fillStyle = c2; ctx.fillRect(sx + 5, sy + (seed & 1 ? 1 : 3), 2, 4);
          if (seed === 0) { ctx.fillStyle = c3; ctx.fillRect(sx + 5, sy + 2, 1, 1); }
        } else {
          ctx.fillStyle = c0; ctx.fillRect(sx, sy + 6, 12, 4);       // 底冰
          ctx.fillStyle = c1; ctx.fillRect(sx, sy + 4, 12, 3);       // 主體
          ctx.fillStyle = c2;
          ctx.fillRect(sx + 2, sy + 4, 8, 1);                        // 霜線
          ctx.fillRect(sx + seed * 3, sy + 1, 2, 4);                 // 交錯冰晶尖
          if ((i & 1) === 0) { ctx.fillStyle = c3; ctx.fillRect(sx + seed * 3, sy + 1, 1, 1); }
        }
      }
    }
    const spr = SPRITES[this.sprite];
    const frames = Object.keys(spr.frames);
    const frame = frames.length > 1 ? frames[(this.t >> 2) % frames.length] : frames[0];
    drawSprite(ctx, this.sprite, this.x - camera.x, this.y, { frame, flip: this.vx < 0, override: this.tint || undefined });
  }
}

class HealthPickup {
  constructor(x, y, kind = 'hp') {
    this.kind = kind; // 'hp' 回血 | 'full' 全回復 | 'ammo' 武器彈藥 | 'fullAmmo' 全彈藥 | 'life' 額外生命
    const big = kind === 'full' || kind === 'fullAmmo';
    const art = kind === 'life' ? SPRITES.extraLife : big ? SPRITES.healBig : SPRITES.heal;
    this.w = art.w;
    this.h = art.h;
    this.x = x - this.w / 2; this.y = y - this.h;
    this.vx = 0; this.vy = -1.5;
    this.life = big ? 999999 : 400;
    this.dead = false;
  }
  update(game) {
    this.life--;
    if (this.life <= 0) { this.dead = true; return; }
    this.vy = Math.min(this.vy + GRAVITY, MAX_FALL);
    moveWithCollision(this, game.map);
    if (!this.dead && aabbOverlap(this, game.player) && !game.player.dead) {
      if (this.kind === 'life') {
        game.lives = Math.min(9, game.lives + 1);
        this.dead = true;
        SFX.play('weaponGet');
      } else if (this.kind === 'ammo') this.dead = game.addAmmo(8);
      else if (this.kind === 'full') { game.player.heal(PLAYER_MAX_HP); this.dead = true; }
      else if (this.kind === 'fullAmmo') { game.ammo = game.fullAmmo(); this.dead = true; SFX.play('weaponGet'); }
      else { game.player.heal(HEAL_AMOUNT); this.dead = true; }
    }
  }
  draw(ctx, camera) {
    if (this.life < 120 && (this.life >> 2) & 1) return; // 快消失時閃爍
    if (this.kind === 'life') {
      drawSprite(ctx, 'extraLife', this.x - camera.x, this.y, { frame: 'default' });
    } else if (this.kind === 'full') {
      drawSprite(ctx, 'healBig', this.x - camera.x, this.y, { frame: (worldFrame() >> 3) & 1 ? 'f1' : 'f2' });
    } else if (this.kind === 'fullAmmo') {
      drawSprite(ctx, 'healBig', this.x - camera.x, this.y, { frame: (worldFrame() >> 3) & 1 ? 'f1' : 'f2', override: '#f8d820' });
    } else {
      drawSprite(ctx, this.kind === 'ammo' ? 'healAmmo' : 'heal',
        this.x - camera.x, this.y, { frame: (this.life >> 3) & 1 ? 'f1' : 'f2' });
    }
  }
}

class Particle {
  constructor(x, y, vx, vy, life, color, size = 2) {
    Object.assign(this, { x, y, vx, vy, life, color, size, dead: false });
  }
  update() {
    this.x += this.vx; this.y += this.vy; this.vy += 0.1;
    if (--this.life <= 0) this.dead = true;
  }
  draw(ctx, camera) {
    ctx.fillStyle = this.color;
    ctx.fillRect(Math.round(this.x - camera.x), Math.round(this.y), this.size, this.size);
  }
}

function spawnExplosion(game, cx, cy, big = false) {
  const n = big ? 14 : 7;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const sp = big ? 1.8 : 1.2;
    game.particles.push(new Particle(
      cx, cy, Math.cos(a) * sp, Math.sin(a) * sp - 0.5,
      20 + (i % 3) * 8, ['#f8f858', '#f83800', '#fca044'][i % 3], big ? 3 : 2
    ));
  }
}

// 落雷傳導：命中敵人後，隨機朝鄰近 1~2 隻敵人放電（運氣決定隻數）。
function chainLightning(game, source, damage) {
  const sx = source.x + source.w / 2, sy = source.y + source.h / 2;
  const jumps = 1 + (RNG.next() < 0.5 ? 1 : 0);
  const targets = game.enemies
    .filter((e) => !e.dead && e !== source)
    .map((e) => ({ e, d: Math.hypot((e.x + e.w / 2) - sx, (e.y + e.h / 2) - sy) }))
    .filter((o) => o.d < 72)
    .sort((a, b) => a.d - b.d)
    .slice(0, jumps);
  for (const { e } of targets) {
    e.takeHit(game, Math.max(1, damage - 1));
    const ex = e.x + e.w / 2, ey = e.y + e.h / 2;
    for (let i = 0; i <= 5; i++) {
      const t = i / 5;
      game.particles.push(new Particle(sx + (ex - sx) * t, sy + (ey - sy) * t,
        (RNG.next() - 0.5) * 0.6, (RNG.next() - 0.5) * 0.6, 10, i & 1 ? '#f8f858' : '#ffffff', 1));
    }
    SFX.play('zap');
  }
}

function spawnShadowCollapse(game, rect, amount = 18) {
  const colors = ['#181820', '#301840', '#604078', '#a848b8', '#f83800'];
  for (let i = 0; i < amount; i++) {
    const x = rect.x + 1 + RNG.next() * Math.max(1, rect.w - 2);
    const y = rect.y + RNG.next() * rect.h;
    const a = RNG.next() * Math.PI * 2;
    const sp = 0.6 + RNG.next() * 1.8;
    game.particles.push(new Particle(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 0.8,
      28 + (i % 5) * 7, colors[i % colors.length], i % 4 === 0 ? 2 : 1));
  }
}

class Player {
  constructor(game) {
    this.game = game;
    this.w = 12; this.h = 14;
    this.useLadderTops = true;
    this.respawn();
  }
  respawn() {
    const p = this.game.respawnPoint;
    this.x = p.x + (TILE - this.w) / 2;
    this.y = p.y + TILE - this.h;
    this.vx = 0; this.vy = 0;
    this.facing = 1;
    this.hp = PLAYER_MAX_HP;
    this.grounded = false;
    this.climbing = false;
    this.jumping = false;
    this.springing = false;
    this.coyoteT = 0;
    this.jumpBufferT = 0;
    this.invulnTimer = 0;
    this.hurtTimer = 0;
    this.frozenT = 0;        // 被冰凍:定住,連打按鍵掙脫(冰霜妖靈)
    this.burnT = 0;          // 燒傷:每 60 影格掉 1 血,不會燒死(熔爐魔神)
    this.chargeT = 0;
    this.chargedNotified = false;
    this.shootAnimT = 0;
    this.fireShieldT = 0;
    this.fireShieldHits = 0;
    this.fireShieldHitCd = 0;
    this.slideT = 0;
    this.landingT = 0;
    this.animT = 0;
    this.dead = false;
  }
  get canControl() { return this.hurtTimer <= 0 && this.frozenT <= 0 && !this.dead && !this.game.inputLocked; }
  get hurtbox() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }

  heal(n) { this.hp = Math.min(PLAYER_MAX_HP, this.hp + n); SFX.play('pickup'); }

  fireShieldRects() {
    if (this.fireShieldT <= 0 || this.fireShieldHits <= 0) return [];
    const boxes = [];
    const cx = this.x + this.w / 2, cy = this.y + this.h / 2;
    for (let i = 0; i < Math.min(FIRE_SHIELD_HITS, this.fireShieldHits); i++) {
      const a = this.animT * 0.12 + i * Math.PI / 2;
      boxes.push({
        x: Math.round(cx + Math.cos(a) * 15 - SPRITES.fireOrb.w / 2),
        y: Math.round(cy + Math.sin(a) * 11 - SPRITES.fireOrb.h / 2),
        w: SPRITES.fireOrb.w, h: SPRITES.fireOrb.h,
      });
    }
    return boxes;
  }

  fireShieldBounds() {
    // 四顆火焰之間仍視為完整護盾，避免細小子彈剛好從視覺縫隙穿過。
    return { x: this.x - 10, y: this.y - 8, w: this.w + 20, h: this.h + 16 };
  }

  drawFireShield(ctx, camera) {
    if (this.fireShieldT <= 0) return;
    const frame = (this.animT >> 2) & 1 ? 'f1' : 'f2';
    for (const orb of this.fireShieldRects()) {
      drawSprite(ctx, 'fireOrb', orb.x - camera.x, orb.y, { frame });
    }
  }

  fireSmall(weapon = 'buster') {
    const alive = this.game.playerBullets.filter((b) => !b.dead && b.sprite === 'bulletSmall').length;
    if (alive >= BULLET_MAX) return;
    const bx = this.facing > 0 ? this.x + this.w - 1 : this.x - SPRITES.bulletSmall.w + 1;
    this.game.playerBullets.push(new Bullet(bx, this.y + 5, this.facing * BULLET_SPEED, 0, 'bulletSmall',
      { damage: 1, weapon, fromPlayer: true }));
    this.shootAnimT = SHOOT_ANIM;
    SFX.play('shoot');
  }
  fireCharged() {
    const alive = this.game.playerBullets.filter((b) => !b.dead && b.weapon === 'buster').length;
    if (alive >= BULLET_MAX) return;
    const bx = this.facing > 0 ? this.x + this.w - 2 : this.x - SPRITES.bulletBig.w + 2;
    this.game.playerBullets.push(new Bullet(bx, this.y + 2, this.facing * CHARGE_SPEED, 0, 'bulletBig',
      { damage: 3, big: true, weapon: 'buster', fromPlayer: true }));
    this.shootAnimT = SHOOT_ANIM;
    SFX.play('bigShot');
  }

  // 依目前選擇的武器發射(Boss 武器消耗彈藥、各自有畫面上限)
  fireWeapon() {
    const id = this.game.currentWeaponId();
    if (id === 'buster') return this.fireSmall();
    const w = WEAPONS[id];
    // TIME STOP 啟動後，玩家仍可用手砲射擊；啟動瞬間本身不產生子彈。
    if (id === 'time' && this.game.playerTimeStopT > 0) return this.fireSmall('time');
    if (id === 'time' && this.game.timeStopT > 0) { SFX.play('empty'); return; }
    if (id === 'fire' && this.fireShieldT > 0) { SFX.play('empty'); return; }
    if (this.game.ammo[id] < w.cost) { SFX.play('empty'); return; }
    if (id === 'time') {
      this.game.ammo[id] -= w.cost;
      this.game.playerTimeStopT = PLAYER_TIME_STOP_FRAMES;
      this.game.timeStopSource = 'player';
      this.shootAnimT = SHOOT_ANIM;
      this.game.shake(5);
      SFX.play('charged');
      return;
    }
    const alive = this.game.playerBullets.filter((b) => !b.dead && b.weapon === id).length;
    if (alive >= w.cap) return;
    this.game.ammo[id] -= w.cost;
    if (id === 'bolt') {
      // 落雷:與城市 Boss 同款的天降閃電——鎖定前方最近敵人／Boss 的欄位落下，
      // 貫穿整條垂直線，命中時隨機傳導 1~2 隻鄰近敵人。
      let tx = this.x + this.w / 2 + this.facing * 40, best = Infinity;
      const targets = this.game.enemies.slice();
      if (this.game.bossActive && this.game.boss && !this.game.boss.dead) targets.push(this.game.boss);
      for (const e of targets) {
        if (e.dead) continue;
        const dx = (e.x + e.w / 2) - (this.x + this.w / 2);
        if ((this.facing > 0 ? dx > 0 : dx < 0) && Math.abs(dx) < 190 && Math.abs(dx) < best) {
          best = Math.abs(dx); tx = e.x + e.w / 2;
        }
      }
      tx = Math.max(8, Math.min(tx, this.game.map.widthPx - 8));
      this.game.playerBullets.push(new Bullet(tx - SPRITES.boltStrike.w / 2, 4, 0, 12, 'boltStrike',
        { damage: 3, pierce: true, chain: true, noTerrain: true, weapon: 'bolt', fromPlayer: true }));
      SFX.play('zap');
    } else if (id === 'seed') {
      // 種子炸彈:拋物線,落地爆出貼地藤苗——傷害提高、藤苗更持久（見 explode）。
      const bx = this.facing > 0 ? this.x + this.w - 2 : this.x - 4;
      this.game.playerBullets.push(new Bullet(bx, this.y, this.facing * 2.4, -4.2, 'seed',
        { damage: 3, gravity: 0.22, sprouts: true, weapon: 'seed', fromPlayer: true }));
      SFX.play('lob');
    } else if (id === 'ice') {
      // 冰流:貼地延伸（縮短為一小段）；空中施放時先落到地面再開始延伸。
      const bx = this.facing > 0 ? this.x + this.w - 2 : this.x - SPRITES.iceWave.w + 2;
      this.game.playerBullets.push(new Bullet(bx, this.y + this.h - SPRITES.iceWave.h,
        this.facing * 2.1, 0, 'iceWave', {
          damage: 1, life: 70, freeze: true, pierce: true, magmaChill: true,
          surfaceCrawl: true, crawlFacing: this.facing, crawlSpeed: 2.1,
          startFalling: !this.grounded, weapon: 'ice', fromPlayer: true,
        }));
      SFX.play('freeze');
    } else if (id === 'fire') {
      // 火盾:四顆火焰環繞角色，各可攔下一發敵彈，接觸敵人也會造成傷害。
      this.fireShieldT = FIRE_SHIELD_FRAMES;
      this.fireShieldHits = FIRE_SHIELD_HITS;
      this.fireShieldHitCd = 0;
      SFX.play('flame');
    }
    this.shootAnimT = SHOOT_ANIM;
  }

  update(game) {
    if (this.dead) return;
    const map = game.map;
    if (this.invulnTimer > 0) this.invulnTimer--;
    if (this.hurtTimer > 0) this.hurtTimer--;
    if (this.shootAnimT > 0) this.shootAnimT--;
    if (this.fireShieldT > 0) {
      this.fireShieldT--;
      if (this.fireShieldT <= 0) this.fireShieldHits = 0;
    }
    if (this.fireShieldHitCd > 0) this.fireShieldHitCd--;
    if (this.landingT > 0) this.landingT--;
    this.animT++;

    // 冰凍狀態:定住不能動,連打任意鍵加速掙脫
    if (this.frozenT > 0) {
      this.frozenT--;
      if (Input.pressed('left') || Input.pressed('right') ||
          Input.pressed('jump') || Input.pressed('shoot')) {
        this.frozenT = Math.max(0, this.frozenT - 3);
      }
      this.vx = 0;
    }
    // 燒傷狀態:定期扣血(最低留 1 血,不會直接燒死)
    if (this.burnT > 0) {
      this.burnT--;
      if (this.burnT % 60 === 0 && this.hp > 1) {
        this.hp--;
        SFX.play('tick');
        spawnExplosion(game, this.x + this.w / 2, this.y + 2);
      }
    }

    // ── 射擊與武器:按下發射;蓄力僅限 BUSTER;Q/Tab 切換武器
    if (this.canControl && this.slideT <= 0) {
      if (Input.pressed('weapon')) this.game.openWeaponMenu();
      if (Input.pressed('shoot')) this.fireWeapon();
      const isBuster = this.game.currentWeaponId() === 'buster';
      if (Input.held('shoot') && isBuster) {
        this.chargeT++;
        if (this.chargeT === CHARGE_FRAMES && !this.chargedNotified) {
          SFX.play('charged'); this.chargedNotified = true;
        }
      } else {
        if (this.chargeT >= CHARGE_FRAMES && isBuster) this.fireCharged();
        this.chargeT = 0; this.chargedNotified = false;
      }
    } else if (!Input.held('shoot')) {
      this.chargeT = 0; this.chargedNotified = false;
    }

    // ── 攀爬狀態
    if (this.climbing) {
      this.updateClimb(game);
      return;
    }

    // 經典滑鏟：按住下＋跳躍。滑行期間方向鎖定，撞牆或離地即提早結束。
    if (this.slideT > 0) {
      this.updateSlide(game);
      return;
    }
    if (this.canControl && this.grounded && Input.held('down') && Input.pressed('jump')) {
      this.slideT = PLAYER_SLIDE_FRAMES;
      this.vx = this.facing * PLAYER_SLIDE_SPEED;
      this.vy = 0;
      this.jumping = false;
      this.jumpBufferT = 0;
      SFX.play('slide');
      this.updateSlide(game);
      return;
    }

    // ── 一般移動:定速跑
    if (this.canControl) {
      let dir = 0;
      if (Input.held('left')) dir -= 1;
      if (Input.held('right')) dir += 1;
      // 冰面(冰山關):加速度 + 慣性滑行;其他地面維持定速
      const onIce = this.grounded && map.propsAt(
        Math.floor((this.x + this.w / 2) / TILE),
        Math.floor((this.y + this.h + 1) / TILE)
      ).ice;
      if (dir !== 0) {
        if (onIce) {
          this.vx = Math.max(-PLAYER_RUN_SPEED, Math.min(PLAYER_RUN_SPEED, this.vx + dir * ICE_ACCEL));
        } else {
          this.vx = dir * PLAYER_RUN_SPEED;
        }
        this.facing = dir;
      } else if (onIce) {
        this.vx *= ICE_FRICTION;
        if (Math.abs(this.vx) < 0.05) this.vx = 0;
      } else {
        this.vx = 0;
      }

      // 跳躍:按越久越高(放開截斷上升速度),初速固定 → 高度有上限
      // 手感:落地前按跳會暫存(預輸入);離開邊緣幾影格內仍可起跳(coyote)
      if (Input.pressed('jump')) this.jumpBufferT = JUMP_BUFFER_FRAMES;
      else if (this.jumpBufferT > 0) this.jumpBufferT--;
      if (this.jumpBufferT > 0 && (this.grounded || this.coyoteT > 0)) {
        this.vy = PLAYER_JUMP_VY;
        this.jumping = true;
        this.jumpBufferT = 0;
        this.coyoteT = 0;
        SFX.play('jump');
      }
      // 進入梯子
      const cx = this.x + this.w / 2;
      if (Input.held('up') && map.charAtPx(cx, this.y + this.h / 2) === 'H') {
        this.startClimb(map, cx);
      } else if (Input.held('down') && this.grounded &&
                 map.charAtPx(cx, this.y + this.h + 2) === 'H') {
        this.startClimb(map, cx);
        this.y += 8; // 進入梯子往下鑽(讓身體中心落入梯格,避免立即脫離)
      }
    }
    if (this.jumping && this.vy < PLAYER_JUMP_CUT && !Input.held('jump')) {
      this.vy = PLAYER_JUMP_CUT; // 可變跳高
    }

    this.vy = Math.min(this.vy + GRAVITY, MAX_FALL);
    const res = moveWithCollision(this, map);
    if (res.grounded && !this.grounded) { SFX.play('land'); this.landingT = 5; }
    this.grounded = res.grounded;
    if (this.grounded) {
      this.jumping = false;
      this.springing = false;
      this.coyoteT = COYOTE_FRAMES;
    } else if (this.jumping || this.springing) {
      this.coyoteT = 0; // 主動起跳/彈跳中不得再用 coyote 二段跳
    } else if (this.coyoteT > 0) {
      this.coyoteT--;
    }

    // 冰凍的敵人 = 安全平台:可以踩上去(頂部單向)
    if (!this.climbing && this.vy >= 0) {
      for (const e of game.enemies) {
        if (e.frozenT > 0 && !e.dead &&
            this.x + this.w > e.x + 1 && this.x < e.x + e.w - 1) {
          const feet = this.y + this.h;
          if (feet >= e.y - 2 && feet <= e.y + 6) {
            this.y = e.y - this.h;
            this.vy = 0;
            if (!this.grounded) SFX.play('land');
            this.grounded = true;
            this.jumping = false;
            this.springing = false;
            this.coyoteT = COYOTE_FRAMES;
          }
        }
      }
    }

    // 腳下 tile 的關卡機制:輸送帶(城市)/ 彈跳蘑菇(叢林)
    if (this.grounded) {
      const under = map.propsAt(
        Math.floor((this.x + this.w / 2) / TILE),
        Math.floor((this.y + this.h + 1) / TILE)
      );
      if (under.belt) nudgeX(this, map, under.belt * CONVEYOR_SPEED);
      if (under.spring) {
        // (蘑菇彈跳同原本)
        // 大彈跳:不受跳躍截斷影響(springing 而非 jumping)
        this.vy = SPRING_VY;
        this.grounded = false;
        this.springing = true;
        this.jumping = false;
        this.coyoteT = 0;
        SFX.play('boing');
      }
    }

    // 城市陣風:不定期左右吹,空中吹得更兇
    if (game.levelData.wind && !this.climbing) {
      const wf = windForce(game.worldT);
      if (wf !== 0) nudgeX(this, map, wf * (this.grounded ? 0.85 : 1.3));
    }

    this.checkHazards(game);
  }

  startClimb(map, cx) {
    this.climbing = true;
    this.jumping = false;
    this.vx = 0; this.vy = 0;
    const col = Math.floor(cx / TILE);
    this.x = col * TILE + (TILE - this.w) / 2; // 吸附梯子中線
    this.grounded = false;
  }

  updateSlide(game) {
    this.slideT--;
    this.vx = this.facing * PLAYER_SLIDE_SPEED;
    this.vy = Math.min(this.vy + GRAVITY, MAX_FALL);
    const r = moveWithCollision(this, game.map);
    this.grounded = r.grounded;
    if (r.hitWall || !this.grounded || this.slideT <= 0) {
      this.slideT = 0;
      if (r.hitWall) this.vx = 0;
    }
    this.checkHazards(game);
  }

  updateClimb(game) {
    const map = game.map;
    let dy = 0;
    if (this.canControl) {
      if (Input.held('up')) dy = -PLAYER_CLIMB_SPEED;
      else if (Input.held('down')) dy = PLAYER_CLIMB_SPEED;
      if (Input.held('left')) this.facing = -1;
      if (Input.held('right')) this.facing = 1;
      if (Input.pressed('jump')) { this.climbing = false; this.vy = 0; return; }
    }
    if (dy !== 0) this.animT++;
    this.y += dy;

    const cx = this.x + this.w / 2;
    const centerRow = Math.floor((this.y + this.h / 2) / TILE);
    const col = Math.floor(cx / TILE);

    if (dy < 0 && map.charAt(col, centerRow) !== 'H') {
      // 爬到頂:站上梯頂
      this.y = (centerRow + 1) * TILE - this.h;
      this.climbing = false;
      this.grounded = true;
    } else if (dy > 0) {
      // 爬到底:踩到實心地面就站好
      const footRow = Math.floor((this.y + this.h) / TILE);
      if (map.solidAtCell(col, footRow)) {
        this.y = footRow * TILE - this.h;
        this.climbing = false;
        this.grounded = true;
      } else if (map.charAt(col, centerRow) !== 'H') {
        this.climbing = false; // 梯子懸空段掉出 → 恢復自由落體
      }
    }
    this.checkHazards(game);
  }

  checkHazards(game) {
    // 掉出關卡仍即死；尖刺改為最大生命一半(14)傷害，並沿用受擊無敵時間。
    let onSpike = false, spikeX = this.x + this.w / 2;
    game.map.eachOverlapping(this, (p, col) => {
      if (p.deadly) { onSpike = true; spikeX = col * TILE + TILE / 2; return true; }
      return false;
    });
    if (this.y > game.map.heightPx + 16) { this.die(game); return; }
    if (onSpike && this.invulnTimer <= 0) { this.hurt(game, spikeX, SPIKE_DAMAGE); return; }
    // 檢查點:水平關卡看「越過 x」;垂直關卡看「爬到該高度以上」
    for (const cp of game.map.checkpoints) {
      const reached = game.map.vertical
        ? this.y + this.h <= cp.y + TILE
        : this.x + this.w / 2 >= cp.x;
      const better = game.map.vertical ? cp.y < game.respawnPoint.y : cp.x > game.respawnPoint.x;
      if (reached && better) game.respawnPoint = { x: cp.x, y: cp.y };
    }
  }

  hurt(game, sourceX, dmg) {
    if (this.invulnTimer > 0 || this.dead || game.state !== 'play') return;
    this.hp -= Difficulty.dmg(dmg);   // 難度倍率：所有來源傷害統一縮放
    if (this.hp <= 0) { this.hp = 0; this.die(game); return; }
    SFX.play('hurt');
    this.invulnTimer = INVULN_FRAMES;
    this.hurtTimer = HURT_LOCK_FRAMES;
    this.climbing = false;
    this.slideT = 0;
    const away = (this.x + this.w / 2) < sourceX ? -1 : 1;
    this.vx = away * KNOCKBACK_VX;
    this.vy = KNOCKBACK_VY;
    this.grounded = false;
  }

  die(game) {
    if (this.dead) return;
    this.dead = true;
    SFX.play('die');
    spawnExplosion(game, this.x + this.w / 2, this.y + this.h / 2, true);
    game.onPlayerDeath();
  }

  draw(ctx, camera) {
    if (this.dead) return;
    if (this.invulnTimer > 0 && (this.invulnTimer >> 2) & 1) {
      this.drawFireShield(ctx, camera); // 玩家閃爍時火盾仍保持可見
      return;
    }

    let frame;
    if (this.hurtTimer > 0) frame = 'hurt';
    else if (this.slideT > 0) frame = 'slide';
    else if (this.climbing) frame = 'climb';
    else if (!this.grounded) frame = 'jump';
    else if (this.vx !== 0) frame = ['run1', 'run2', 'run3', 'run2'][(this.animT >> 3) & 3]; // 跑步 3 幀循環
    else frame = 'idle';

    // 攀爬動畫:左右鏡像交替
    const flip = this.climbing ? ((this.animT >> 3) & 1) === 1 : this.facing < 0;
    // 蓄力完成:週期閃白
    const override = (this.chargeT >= CHARGE_FRAMES && (this.animT >> 2) & 1) ? '#b8f8ff'
                   : (this.chargeT > 20 && (this.animT & 7) === 0) ? '#5878a8' : null;
    // 洛克人式換裝:非 BUSTER 武器換配色
    const wid = this.game.currentWeaponId();
    const remap = wid === 'buster' ? null : {
      '#00a8f0': WEAPONS[wid].color,
      '#0060c0': WEAPONS[wid].color2,
      '#80d0ff': WEAPONS[wid].color,
    };

    const x = this.x - camera.x;
    const drawY = this.y;
    drawSprite(ctx, 'player', x, drawY, { frame, flip, override, remap });
    this.drawFireShield(ctx, camera);
    // 冰凍:冰塊封住(掙脫接近時閃爍)
    if (this.frozenT > 0) {
      if (!(this.frozenT < 15 && (this.frozenT >> 1) & 1)) {
        ctx.fillStyle = 'rgba(160,232,248,0.6)';
        ctx.fillRect(Math.round(x), Math.round(drawY), SPRITES.player.w, SPRITES.player.h);
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.fillRect(Math.round(x) + 2, Math.round(drawY) + 2, 3, 3);
      }
    }
    // 燒傷:身上竄小火苗
    if (this.burnT > 0) {
      const t = this.animT;
      ctx.fillStyle = (t >> 2) & 1 ? '#f87838' : '#f8d820';
      ctx.fillRect(Math.round(x) + ((t >> 3) & 1) * 10 + 3, Math.round(drawY) - 3, 3, 4);
      ctx.fillRect(Math.round(x) + 13 - ((t >> 2) & 1) * 7, Math.round(drawY) + 9, 2, 3);
    }
  }
}

// ── 城市雜兵 1:巡邏射擊型 ──────────────────────────────
class Walker {
  constructor(spawn) {
    this.sprite = 'walker';
    this.w = 14; this.h = 14;
    this.x = spawn.x + (TILE - this.w) / 2;
    this.y = spawn.y + TILE - this.h;
    this.vx = 0; this.vy = 0;
    this.dir = -1;
    this.hp = WALKER_HP;
    this.contactDamage = DMG_WALKER_CONTACT;
    this.grounded = false;
    this.shootTimer = Difficulty.cd(WALKER_CD);
    this.flashTimer = 0;
    this.animT = 0;
    this.dead = false;
  }
  update(game) {
    this.animT++;
    if (this.flashTimer > 0) this.flashTimer--;
    if (this.shootTimer > 0) this.shootTimer--;

    this.vx = this.grounded ? this.dir * WALKER_SPEED : 0;
    this.vy = Math.min(this.vy + GRAVITY, MAX_FALL);
    const res = moveWithCollision(this, game.map);
    this.grounded = res.grounded;
    if (res.hitWall) this.dir *= -1;

    if (this.grounded) {
      // 輸送帶也會推動雜兵
      const under = game.map.propsAt(
        Math.floor((this.x + this.w / 2) / TILE),
        Math.floor((this.y + this.h + 1) / TILE)
      );
      if (under.belt) nudgeX(this, game.map, under.belt * CONVEYOR_SPEED);

      const frontX = this.dir > 0 ? this.x + this.w + 1 : this.x - 1;
      const footRow = Math.floor((this.y + this.h - 1) / TILE);
      const frontCol = Math.floor(frontX / TILE);
      const frontProps = game.map.propsAt(frontCol, footRow);
      const noGround = !game.map.solidAtCell(frontCol, footRow + 1);
      // 尖刺或 Boss 門前折返(不走進 Boss 房)
      if (noGround || frontProps.deadly || frontProps.door) this.dir *= -1;
    }

    const p = game.player;
    if (!p.dead && this.shootTimer <= 0) {
      const dx = (p.x + p.w / 2) - (this.x + this.w / 2);
      const dy = (p.y + p.h / 2) - (this.y + this.h / 2);
      if (Math.abs(dx) < WALKER_RANGE && Math.abs(dy) < 40) {
        this.dir = dx < 0 ? -1 : 1;
        const bx = this.dir > 0 ? this.x + this.w - 1 : this.x - SPRITES.bulletEnemy.w + 1;
        game.enemyBullets.push(new Bullet(bx, this.y + 4, this.dir * ENEMY_BULLET_SPEED, 0, 'bulletEnemy', { damage: DMG_ENEMY_BULLET }));
        this.shootTimer = Difficulty.cd(WALKER_CD);
      }
    }
  }
  takeHit(game, dmg) {
    this.hp -= dmg;
    this.flashTimer = 6;
    if (this.hp <= 0) { this.dead = true; game.onEnemyKilled(this); }
  }
  draw(ctx, camera) {
    const frame = this.flashTimer > 0 ? 'flash' : ((this.animT >> 3) & 1 ? 'walk1' : 'walk2');
    drawSprite(ctx, this.sprite, this.x - camera.x, this.y, { frame, flip: this.dir < 0 });
  }
}

// ── 城市雜兵 2:定點朝玩家直射砲台 ──────────────────────
class Turret {
  constructor(spawn) {
    this.sprite = 'turret';
    this.w = 16; this.h = 12;
    this.x = spawn.x;
    this.y = spawn.y + TILE - this.h;
    this.vx = 0; this.vy = 0;
    this.hp = TURRET_HP;
    this.contactDamage = DMG_WALKER_CONTACT;
    this.shootTimer = Difficulty.cd((TURRET_CD / 2) | 0);
    this.openT = 0;
    this.flashTimer = 0;
    this.dead = false;
  }
  update(game) {
    if (this.flashTimer > 0) this.flashTimer--;
    if (this.shootTimer > 0) this.shootTimer--;
    if (this.openT > 0) this.openT--;

    const p = game.player;
    if (p.dead || this.shootTimer > 0) return;
    const cx = this.x + this.w / 2, cy = this.y + this.h / 2;
    const dx = (p.x + p.w / 2) - cx, dy = (p.y + p.h / 2) - cy;
    const dist = Math.hypot(dx, dy);
    if (dist < TURRET_RANGE && dist > 4) {
      // 三連散射：中央直射玩家、上下各偏一發，較難乾淨閃過。
      const base = Math.atan2(dy, dx);
      for (const off of [-0.26, 0, 0.26]) {
        game.enemyBullets.push(new Bullet(cx - 2, cy - 2,
          Math.cos(base + off) * ENEMY_BULLET_SPEED, Math.sin(base + off) * ENEMY_BULLET_SPEED,
          'bulletEnemy', { damage: DMG_ENEMY_BULLET }));
      }
      this.shootTimer = Difficulty.cd(TURRET_CD);
      this.openT = 34;
    }
  }
  takeHit(game, dmg) {
    this.hp -= dmg;
    this.flashTimer = 6;
    if (this.hp <= 0) { this.dead = true; game.onEnemyKilled(this); }
  }
  draw(ctx, camera) {
    const frame = this.flashTimer > 0 ? 'flash' : (this.openT > 0 ? 'open' : 'closed');
    drawSprite(ctx, this.sprite, this.x - camera.x, this.y, { frame });
  }
}

// ── 城堡雜兵：停時期間仍會獵殺玩家，攻擊間隔也比前四關更短 ──
class ClockGuard extends Walker {
  constructor(spawn) {
    super(spawn);
    this.sprite = 'clockGuard';
    this.w = SPRITES.clockGuard.w; this.h = SPRITES.clockGuard.h;
    this.x = spawn.x + (TILE - this.w) / 2;
    this.y = spawn.y + TILE - this.h;
    this.hp = 4;
    this.contactDamage = 5;
    this.shootTimer = 48;
  }
  update(game) {
    super.update(game);
    if (this.shootTimer === WALKER_CD) this.shootTimer = 68;
  }
}

class ClockTurret {
  constructor(spawn) {
    this.sprite = 'clockTurret';
    this.w = SPRITES.clockTurret.w; this.h = SPRITES.clockTurret.h;
    this.x = spawn.x + (TILE - this.w) / 2;
    this.y = spawn.y + TILE - this.h;
    this.vx = 0; this.vy = 0;
    this.dir = -1;                 // 觸發時只設定一次，之後絕不轉向
    this.hp = 5;
    this.contactDamage = 5;
    this.state = 'perched';        // perched → windup → slide → fall → rush
    this.stateT = 0;
    this.flashTimer = 0;
    this.animT = 0;
    this.frozenT = 0;
    this.thawGrace = 0;
    this.dead = false;
  }
  update(game) {
    this.animT++;
    this.stateT++;
    if (this.flashTimer > 0) this.flashTimer--;
    const p = game.player;

    if (this.state === 'perched') {
      this.vx = 0; this.vy = 0;
      const dx = (p.x + p.w / 2) - (this.x + this.w / 2);
      const playerBelow = p.y + p.h / 2 > this.y + this.h / 2;
      if (!p.dead && playerBelow && Math.abs(dx) < 190) {
        this.dir = dx < 0 ? -1 : 1; // 此後保持同一方向，即使玩家跑到另一側也不追轉
        this.state = 'windup'; this.stateT = 0;
        SFX.play('tick');
      }
      return;
    }

    if (this.state === 'windup') {
      this.vx = 0; this.vy = 0;
      if (this.stateT >= 20) {
        this.state = 'slide'; this.stateT = 0;
        this.vx = this.dir * 2.35;
        SFX.play('bigShot');
      }
      return;
    }

    if (this.state === 'slide') {
      this.x += this.dir * 2.35;
      const frontX = this.dir > 0 ? this.x + this.w - 2 : this.x + 2;
      const supportRow = Math.floor((this.y + this.h + 2) / TILE);
      if (!game.map.solidAtCell(Math.floor(frontX / TILE), supportRow)) {
        this.state = 'fall'; this.stateT = 0; this.vy = 0.8;
      }
      return;
    }

    if (this.state === 'fall') {
      this.vx = this.dir * 2.55;
      this.vy = Math.min(this.vy + GRAVITY, MAX_FALL);
      const res = moveWithCollision(this, game.map);
      if (res.grounded) {
        this.state = 'rush'; this.stateT = 0;
        this.vx = this.dir * 3.25; this.vy = 0;
      } else if (res.hitWall) {
        this.crash(game);
      }
      return;
    }

    // 落地後維持觸發時的方向高速衝過畫面；撞牆直接報廢，不會回頭追玩家。
    this.vx = this.dir * 3.25;
    this.vy = Math.min(this.vy + GRAVITY, MAX_FALL);
    const res = moveWithCollision(this, game.map);
    if (res.hitWall || this.x + this.w < game.camera.x - 40 || this.x > game.camera.x + SCREEN_W + 40) {
      this.crash(game);
    }
  }
  crash(game) {
    if (this.dead) return;
    this.dead = true;
    spawnExplosion(game, this.x + this.w / 2, this.y + this.h / 2);
    SFX.play('enemyDie');
  }
  takeHit(game, dmg) {
    this.hp -= dmg;
    this.flashTimer = 6;
    if (this.hp <= 0) { this.dead = true; game.onEnemyKilled(this); }
  }
  draw(ctx, camera) {
    let frame = this.state === 'perched' ? 'closed' : 'open';
    if (this.state === 'windup' && ((this.stateT >> 2) & 1)) frame = 'closed';
    if (this.flashTimer > 0) frame = 'flash';
    const bob = this.state === 'windup' && ((this.stateT >> 1) & 1) ? -1 : 0;
    drawSprite(ctx, this.sprite, this.x - camera.x, this.y + bob, { frame, flip: this.dir < 0 });
  }
}

// ── 叢林雜兵 1:衝撞甲蟲(不射擊,近身衝刺)──────────────
class JungleBeetle {
  constructor(spawn) {
    this.sprite = 'walkerJungle';
    this.w = 14; this.h = 14;
    this.x = spawn.x + (TILE - this.w) / 2;
    this.y = spawn.y + TILE - this.h;
    this.vx = 0; this.vy = 0;
    this.dir = -1;
    this.hp = WALKER_HP;
    this.contactDamage = DMG_WALKER_CONTACT;
    this.grounded = false;
    this.state = 'patrol'; // patrol → windup(前搖閃爍)→ charge(衝撞)→ tired
    this.stateT = 0;
    this.chargeCd = 60;
    this.flashTimer = 0;
    this.animT = 0;
    this.dead = false;
  }
  // 前方是斷崖 / 尖刺 / Boss 門?
  edgeAhead(game) {
    const frontX = this.dir > 0 ? this.x + this.w + 1 : this.x - 1;
    const footRow = Math.floor((this.y + this.h - 1) / TILE);
    const frontCol = Math.floor(frontX / TILE);
    const p = game.map.propsAt(frontCol, footRow);
    return !game.map.solidAtCell(frontCol, footRow + 1) || p.deadly || p.door;
  }
  update(game) {
    this.animT += this.state === 'charge' ? 2 : 1; // 衝刺時腳步加倍
    if (this.flashTimer > 0) this.flashTimer--;
    if (this.chargeCd > 0) this.chargeCd--;
    this.stateT++;
    const p = game.player;

    switch (this.state) {
      case 'patrol': {
        this.vx = this.grounded ? this.dir * WALKER_SPEED : 0;
        // 玩家在同一水平線且夠近 → 前搖後衝撞
        if (this.grounded && this.chargeCd <= 0 && !p.dead) {
          const dx = (p.x + p.w / 2) - (this.x + this.w / 2);
          const dy = (p.y + p.h / 2) - (this.y + this.h / 2);
          if (Math.abs(dx) < 96 && Math.abs(dy) < 14) {
            this.dir = dx < 0 ? -1 : 1;
            this.vx = 0;
            this.state = 'windup'; this.stateT = 0;
          }
        }
        break;
      }
      case 'windup':
        this.vx = 0;
        if (this.stateT >= 20) { this.state = 'charge'; this.stateT = 0; }
        break;
      case 'charge':
        this.vx = this.dir * 2.3;
        if (this.stateT > 55 || (this.grounded && this.edgeAhead(game))) {
          this.state = 'tired'; this.stateT = 0; this.vx = 0;
        }
        break;
      case 'tired':
        this.vx = 0;
        if (this.stateT >= 35) { this.state = 'patrol'; this.chargeCd = 90; }
        break;
    }

    this.vy = Math.min(this.vy + GRAVITY, MAX_FALL);
    const res = moveWithCollision(this, game.map);
    this.grounded = res.grounded;
    if (res.hitWall) {
      if (this.state === 'charge') { this.state = 'tired'; this.stateT = 0; }
      this.dir *= -1;
    }
    if (this.state === 'patrol' && this.grounded && this.edgeAhead(game)) this.dir *= -1;
  }
  takeHit(game, dmg) {
    this.hp -= dmg;
    this.flashTimer = 6;
    if (this.hp <= 0) { this.dead = true; game.onEnemyKilled(this); }
  }
  draw(ctx, camera) {
    // 前搖:閃白警告
    const warn = this.state === 'windup' && ((this.stateT >> 2) & 1);
    const frame = (this.flashTimer > 0 || warn) ? 'flash' : ((this.animT >> 3) & 1 ? 'walk1' : 'walk2');
    drawSprite(ctx, this.sprite, this.x - camera.x, this.y, { frame, flip: this.dir < 0 });
  }
}

// ── 熔岩雜兵 1:滾動地雷(鎖定衝刺,爆成四向火球)──────
class RollerMine {
  constructor(spawn) {
    this.sprite = 'rollerMine';
    this.w = 14; this.h = 14;
    this.x = spawn.x + (TILE - this.w) / 2;
    this.y = spawn.y + TILE - this.h;
    this.vx = 0; this.vy = 0;
    this.dir = -1;
    this.hp = WALKER_HP - 1;
    this.contactDamage = DMG_WALKER_CONTACT;
    this.grounded = false;
    this.state = 'patrol'; // patrol → armed(閃爍鎖定)→ roll(加速滾向玩家)→ 爆炸
    this.stateT = 0;
    this.rollSpeed = 0;
    this.flashTimer = 0;
    this.animT = 0;
    this.dead = false;
  }
  edgeAhead(game) {
    const frontX = this.dir > 0 ? this.x + this.w + 1 : this.x - 1;
    const footRow = Math.floor((this.y + this.h - 1) / TILE);
    const frontCol = Math.floor(frontX / TILE);
    const p = game.map.propsAt(frontCol, footRow);
    return !game.map.solidAtCell(frontCol, footRow + 1) || p.deadly || p.door;
  }
  boom(game, withDrop) {
    if (this.dead) return;
    this.dead = true;
    // 四向火球
    for (const [vx, vy] of [[1.7, -1.2], [-1.7, -1.2], [1.1, -2], [-1.1, -2]]) {
      game.queuedEnemyBullets.push(new Bullet(this.x + 4, this.y + 4, vx, vy, 'fireball',
        { damage: 2, gravity: 0.12, life: 70 }));
    }
    SFX.play('flame');
    if (withDrop) game.onEnemyKilled(this);
    else spawnExplosion(game, this.x + this.w / 2, this.y + this.h / 2, true);
  }
  update(game) {
    this.animT += this.state === 'roll' ? 3 : 1;
    if (this.flashTimer > 0) this.flashTimer--;
    this.stateT++;
    const p = game.player;

    switch (this.state) {
      case 'patrol': {
        this.vx = this.grounded ? this.dir * 0.4 : 0;
        if (this.grounded && !p.dead) {
          const dx = (p.x + p.w / 2) - (this.x + this.w / 2);
          const dy = (p.y + p.h / 2) - (this.y + this.h / 2);
          if (Math.abs(dx) < 90 && Math.abs(dy) < 16) {
            this.dir = dx < 0 ? -1 : 1;
            this.vx = 0;
            this.state = 'armed'; this.stateT = 0;
          }
        }
        break;
      }
      case 'armed':
        this.vx = 0;
        if (this.stateT >= 16) { this.state = 'roll'; this.stateT = 0; this.rollSpeed = 1; }
        break;
      case 'roll':
        this.rollSpeed = Math.min(3, this.rollSpeed + 0.08);
        this.vx = this.dir * this.rollSpeed;
        if (this.grounded && this.edgeAhead(game)) { this.boom(game, false); return; }
        if (!p.dead && aabbOverlap(this, p.hurtbox)) { this.boom(game, false); return; }
        break;
    }

    this.vy = Math.min(this.vy + GRAVITY, MAX_FALL);
    const res = moveWithCollision(this, game.map);
    this.grounded = res.grounded;
    if (res.hitWall) {
      if (this.state === 'roll') { this.boom(game, false); return; }
      this.dir *= -1;
    }
    if (this.state === 'patrol' && this.grounded && this.edgeAhead(game)) this.dir *= -1;
  }
  takeHit(game, dmg) {
    this.hp -= dmg;
    this.flashTimer = 6;
    if (this.hp <= 0) this.boom(game, true); // 被打爆也會炸出火球——別貼臉打
  }
  draw(ctx, camera) {
    const warn = this.state === 'armed' && ((this.stateT >> 1) & 1);
    const frame = (this.flashTimer > 0 || warn) ? 'flash' : ((this.animT >> 3) & 1 ? 'walk1' : 'walk2');
    drawSprite(ctx, this.sprite, this.x - camera.x, this.y, { frame, flip: this.dir < 0 });
  }
}

// ── 冰山陷阱:落冰錐(玩家經過下方 → 搖晃 → 墜落)──────
class IcicleTrap {
  constructor(spawn) {
    this.w = 6; this.h = 14;
    this.x = spawn.x + 5;
    this.y = spawn.y;
    this.vy = 0;
    this.state = 'hang'; // hang → shake → fall
    this.shakeT = 0;
    this.contactDamage = 3;
    this.dead = false;
  }
  update(game) {
    const p = game.player;
    if (this.state === 'hang') {
      if (!p.dead &&
          Math.abs((p.x + p.w / 2) - (this.x + this.w / 2)) < 22 &&
          p.y > this.y) {
        this.state = 'shake';
        this.shakeT = 16;
        SFX.play('crack');
      }
    } else if (this.state === 'shake') {
      if (--this.shakeT <= 0) this.state = 'fall';
    } else {
      this.vy = Math.min(this.vy + 0.35, 6);
      this.y += this.vy;
      const row = Math.floor((this.y + this.h) / TILE);
      const col = Math.floor((this.x + this.w / 2) / TILE);
      if (game.map.solidAtCell(col, row) || this.y > game.map.heightPx) {
        this.dead = true;
        spawnExplosion(game, this.x + 3, this.y + this.h - 2);
        SFX.play('crack');
      }
      if (!p.dead && aabbOverlap(this, p.hurtbox)) {
        p.hurt(game, this.x + 3, this.contactDamage);
        this.dead = true;
      }
    }
  }
  draw(ctx, camera) {
    const jx = this.state === 'shake' ? ((this.shakeT & 2) ? 1 : -1) : 0;
    drawSprite(ctx, 'icicleShard', this.x - camera.x + jx, this.y,
      { frame: (worldFrame() >> 3) & 1 ? 'f1' : 'f2' });
  }
}

// 出生點類型 × 關卡主題 → 敵人類別(同字元、不同行為)
const ENEMY_TYPES = {
  city:   { walker: Walker,       turret: Turret },
  jungle: { walker: JungleBeetle, turret: JunglePlant, monkey: TreeMonkey },
  ice:    { walker: IceHopper,    turret: FrostBlower },
  magma:  { walker: RollerMine,   turret: LavaSpitter },
  castle: { walker: ClockGuard,   turret: ClockTurret },
  shadow: {
    cityWalker: Walker, cityTurret: Turret,
    jungleBeetle: JungleBeetle, junglePlant: JunglePlant, treeMonkey: TreeMonkey,
    iceHopper: IceHopper, frostBlower: FrostBlower,
    rollerMine: RollerMine, lavaSpitter: LavaSpitter,
    clockGuard: ClockGuard,
  },
};

/* ================================================================
 * MODULE: boss — 關底 Boss(狀態機:idle / dash / jump / shoot / rest)
 * ================================================================ */
class BossBase {
  constructor(spawn, cfg = {}) {
    this.cfg = Object.assign({ sprite: 'bossBat', weakness: null }, cfg);
    const art = SPRITES[this.cfg.sprite] || SPRITES.bossBat;
    this.w = art.w; this.h = art.h;
    this.x = spawn.x;
    this.y = spawn.y + TILE - this.h;
    this.vx = 0; this.vy = 0;
    this.hp = BOSS_HP;
    this.hpShown = 0;
    this.facing = -1;
    this.grounded = false;
    this.state = 'wait';   // wait → idle → windup → (各自招式) → rest
    this.stateT = 0;
    this.pending = null;
    this.lastAttack = null;
    this.attacksUsed = new Set(); // 驗證用
    this.shotsFired = 0;
    this.rage = false;      // 半血狂暴
    this.weakMult = 2;      // 弱點傷害倍率（Boss Rush 復刻戰會調降）
    this.hitCd = 0;
    this.stunT = 0;
    this.stunLockCd = 0;    // 弱點硬直的重觸冷卻：避免被弱點武器連續定住
    this.weakT = 0;
    this.flashTimer = 0;
    this.animT = 0;
    this.dead = false;
  }
  setState(st) { this.state = st; this.stateT = 0; }
  tick() {
    this.animT++; this.stateT++;
    if (this.hitCd > 0) this.hitCd--;
    if (this.stunT > 0) this.stunT--;
    if (this.stunLockCd > 0) this.stunLockCd--;
    if (this.weakT > 0) this.weakT--;
    if (this.flashTimer > 0) this.flashTimer--;
  }
  facePlayer(game) {
    this.facing = (game.player.x + game.player.w / 2) < (this.x + this.w / 2) ? -1 : 1;
  }
  applyGravity(game) {
    this.vy = Math.min(this.vy + BOSS_GRAVITY, MAX_FALL);
    const r = moveWithCollision(this, game.map);
    this.grounded = r.grounded;
    return r;
  }
  roomLeft(game) { return game.map.widthPx - SCREEN_W; }
  floorY(game) { return game.map.bossFloorY; }
  clampToRoom(game) {
    const L = this.roomLeft(game);
    this.x = Math.max(L + 4, Math.min(this.x, game.map.widthPx - this.w - 4));
    this.y = Math.max(8, this.y);
  }
  checkRage(game) {
    if (!this.rage && this.hp <= BOSS_HP / 2 && this.state !== 'wait') {
      this.rage = true;
      this.flashTimer = 14;
      game.shake(6);
      SFX.play('rage');
    }
  }
  pickAttack(game, options) {
    const pool = options.filter((o) => o !== this.lastAttack);
    this.pending = RNG.pick(pool);
    this.lastAttack = this.pending;
    this.attacksUsed.add(this.pending);
    this.facePlayer(game);
    this.setState('windup'); // 所有招式都有前搖預告
  }
  takeHit(game, dmg, weapon) {
    if (this.hitCd > 0 || this.dead || game.state !== 'play') return;
    const isWeak = weapon && weapon === this.cfg.weakness;
    this.hp -= isWeak ? dmg * this.weakMult : dmg;
    this.hitCd = isWeak ? 18 : 12;
    if (isWeak) {
      // 弱點仍造成 2 倍傷害，但硬直不再每發都刷新——保證 Boss 有反擊窗口。
      if (this.stunLockCd <= 0) { this.stunT = Math.max(this.stunT, 14); this.stunLockCd = 54; }
      this.weakT = 24;
      this.vx = 0;
      game.weakFlashT = 24;
      game.shake(8);
    }
    this.flashTimer = isWeak ? 10 : 5;
    game.hitStop = HITSTOP_FRAMES;
    SFX.play(isWeak ? 'weakHit' : 'bossHit');
    if (this.hp <= 0) {
      this.hp = 0;
      this.dead = true;
      game.onBossDefeated(this);
    }
  }
  frameFor() { return [(this.animT >> 4) & 1 ? 'idle1' : 'idle2', null]; }
  draw(ctx, camera) {
    if (this.dead) return;
    let [frame, override] = this.frameFor();
    if (this.weakT > 0 && (this.weakT >> 1) & 1) { frame = 'flash'; override = '#f8d820'; }
    else if (this.flashTimer > 0) { frame = 'flash'; override = null; }
    drawSprite(ctx, this.cfg.sprite, this.x - camera.x, this.y, { frame, flip: this.facing > 0, override });
  }
}

// ── 機械蝙蝠(城市):全程飛行,俯衝突擊 + 快速落雷 ──────
class VoltBat extends BossBase {
  constructor(spawn, cfg) {
    super(spawn, cfg);
    this.w = SPRITES[this.cfg.sprite].w; this.h = SPRITES[this.cfg.sprite].h;
    this.y = spawn.y;
    this.anchorY = 64;   // 盤旋高度
    this.diveChain = 0;  // 狂暴:連續俯衝
  }
  aimDive(game) {
    const pl = game.player;
    const dx = (pl.x + pl.w / 2) - (this.x + this.w / 2);
    const dy = (pl.y + pl.h / 2) - (this.y + this.h / 2);
    const d = Math.hypot(dx, dy) || 1;
    const sp = this.rage ? 4.6 : 4;
    this.vx = (dx / d) * sp;
    this.vy = Math.max(1.6, (dy / d) * sp);
    this.facing = dx < 0 ? -1 : 1;
  }
  launchAttack(game) {
    if (this.pending === 'dive') {
      this.diveChain = this.rage ? 1 : 0;
      this.aimDive(game);
      this.setState('dive');
      SFX.play('jump');
    } else {
      this.shotsFired = 0;
      this.setState('volley');
    }
  }
  update(game) {
    if (this.dead) return;
    this.tick(); this.checkRage(game);
    if (this.stunT > 0) return;
    const pl = game.player;
    switch (this.state) {
      case 'wait':
        this.y += Math.sin(this.animT / 12) * 0.4;
        break;
      case 'idle': { // 空中盤旋、水平跟蹤玩家
        const tx = pl.x + pl.w / 2 - this.w / 2;
        this.x += Math.max(-1.3, Math.min(1.3, (tx - this.x) * 0.06));
        this.y += (this.anchorY - this.y) * 0.08 + Math.sin(this.animT / 10) * 0.8;
        this.clampToRoom(game);
        this.facePlayer(game);
        if (this.stateT >= (this.rage ? 22 : 34)) this.pickAttack(game, ['dive', 'volley']);
        break;
      }
      case 'windup': // 尖嘯前搖
        if (this.stateT >= (this.rage ? 12 : 18)) this.launchAttack(game);
        break;
      case 'dive': // 俯衝穿過玩家位置直到掠地
        this.x += this.vx; this.y += this.vy;
        this.clampToRoom(game);
        if (this.y + this.h >= this.floorY(game) - 2) {
          this.y = this.floorY(game) - this.h - 2;
          game.shake(5);
          this.setState('swoop');
        }
        break;
      case 'swoop': // 拉起回到空中
        this.x += this.vx * 0.7;
        this.y -= 3.2;
        this.clampToRoom(game);
        if (this.y <= this.anchorY) {
          this.y = this.anchorY;
          if (this.diveChain > 0) { this.diveChain--; this.aimDive(game); this.setState('dive'); SFX.play('jump'); }
          else this.setState('rest');
        }
        break;
      case 'volley': { // 空中放快速落雷(警告時間更短、落速更快)
        this.y += Math.sin(this.animT / 8) * 0.5;
        const maxShots = this.rage ? 4 : 3;
        if (this.stateT % 16 === 0 && this.shotsFired < maxShots) {
          const tx = pl.x + pl.w / 2 - 3;
          game.enemyBullets.push(new Bullet(tx, 14, 0, 8, 'boltStrike', { damage: DMG_BOSS_BULLET, warn: 18, noTerrain: true }));
          SFX.play('thunderWarn');
          this.shotsFired++;
        }
        if (this.shotsFired >= maxShots && this.stateT > 56) this.setState('rest');
        break;
      }
      case 'rest':
        // 每輪攻擊後強制降到手炮射線高度，保留明確且足夠長的反擊窗口。
        // 不再讓飛行 Boss 長時間常駐在玩家無法命中的高度。
        {
          const targetY = this.floorY(game) - this.h - 4;
          const dy = targetY - this.y;
          this.y += Math.max(-4, Math.min(4, dy));
          if (Math.abs(dy) <= 4) this.y = targetY;
          this.facePlayer(game);
          if (this.stateT >= (this.rage ? 52 : 64)) this.setState('idle');
        }
        break;
    }
  }
  frameFor() {
    if (this.state === 'windup') return [this.pending === 'dive' ? 'dash' : 'shoot', ((this.stateT >> 2) & 1) ? '#f8f8f8' : null];
    if (this.state === 'dive' || this.state === 'swoop') return ['dash', null];
    if (this.state === 'volley') return ['shoot', null];
    return [(this.animT >> 3) & 1 ? 'idle1' : 'idle2', null]; // 振翅
  }
}

// ── 機械金剛(叢林):爬上樹平台丟香蕉、跳撲、地面衝撞 ────
class MechaKong extends BossBase {
  constructor(spawn, cfg) {
    super(spawn, cfg);
    this.w = SPRITES[this.cfg.sprite].w; this.h = SPRITES[this.cfg.sprite].h;
    this.perches = null;   // Boss 房裡的樹平台(懶掃描)
    this.throwsLeft = 0;
  }
  findPerches(game) {
    if (this.perches) return this.perches;
    const m = game.map;
    const out = [];
    for (let r = 0; r < 13; r++) {
      let c0 = -1;
      for (let c = Math.max(0, m.cols - 16); c <= m.cols; c++) {
        const isPlat = c < m.cols && m.charAt(c, r) === '=';
        if (isPlat && c0 < 0) c0 = c;
        if (!isPlat && c0 >= 0) {
          out.push({ cx: ((c0 + c) / 2) * TILE, top: r * TILE });
          c0 = -1;
        }
      }
    }
    this.perches = out;
    return out;
  }
  launchAttack(game) {
    const pl = game.player;
    if (this.pending === 'seedbomb') {
      // 種子炸彈：拋物線落地爆出貼地藤苗（對應玩家種子武器）。
      this.facePlayer(game);
      const px = pl.x + pl.w / 2;
      const n = this.rage ? 2 : 1;
      for (let i = 0; i < n; i++) {
        const dx = px - (this.x + this.w / 2) + (i - (n - 1) / 2) * 44;
        const vx = Math.max(-3, Math.min(3, dx / 40));
        game.enemyBullets.push(new Bullet(this.x + this.w / 2 - 3, this.y + 4, vx, -3.4, 'seed',
          { damage: 3, gravity: 0.22, sprouts: true, life: 180 }));
      }
      SFX.play('lob');
      this.setState('rest');
      return;
    }
    if (this.pending === 'climb') {
      // 跳上離玩家較遠的樹(居高臨下丟香蕉)
      const ps = this.findPerches(game);
      const perch = ps.length
        ? ps.reduce((best, q) => Math.abs(q.cx - pl.x) > Math.abs(best.cx - pl.x) ? q : best, ps[0])
        : null;
      if (perch) {
        const dx = perch.cx - (this.x + this.w / 2);
        this.vx = dx / 34;
        this.vy = -8.2;
        this.grounded = false;
        this.setState('climb');
        SFX.play('jump');
        return;
      }
      this.pending = 'charge'; // 沒有樹就退化成衝撞
    }
    if (this.pending === 'charge') {
      this.vx = this.facing * (this.rage ? 3.1 : 2.6);
      this.dashDist = 0;
      this.setState('charge');
    } else { // slam:跳撲砸地落椰子
      this.vy = -8.4;
      this.vx = this.facing * 2.4;
      this.grounded = false;
      this.setState('slam');
      SFX.play('jump');
    }
  }
  update(game) {
    if (this.dead) return;
    this.tick(); this.checkRage(game);
    // 硬直期間仍套用重力，避免被閃電打中時卡在半空／原地不動。
    if (this.stunT > 0) { this.vx = 0; this.applyGravity(game); return; }
    const pl = game.player;
    switch (this.state) {
      case 'wait':
        this.applyGravity(game);
        break;
      case 'idle':
        this.facePlayer(game);
        this.vx = this.facing * 0.6;
        this.applyGravity(game);
        if (this.stateT >= (this.rage ? 20 : 30)) this.pickAttack(game, ['climb', 'charge', 'slam', 'seedbomb']);
        break;
      case 'windup':
        this.vx = 0;
        this.applyGravity(game);
        if (this.stateT >= (this.rage ? 14 : 20)) this.launchAttack(game);
        break;
      case 'climb': { // 飛撲上樹
        const r = this.applyGravity(game);
        if (r.grounded) {
          this.vx = 0;
          this.throwsLeft = this.rage ? 3 : 2;
          this.setState('perch');
        }
        break;
      }
      case 'perch': // 樹上朝玩家丟香蕉
        this.vx = 0;
        this.applyGravity(game);
        this.facePlayer(game);
        if (this.stateT % 20 === 0 && this.throwsLeft > 0) {
          const dx = (pl.x + pl.w / 2) - (this.x + this.w / 2);
          const vx = Math.max(-2.6, Math.min(2.6, dx / 38));
          game.enemyBullets.push(new Bullet(this.x + this.w / 2 - 3, this.y + 4, vx, -2.6, 'banana',
            { damage: DMG_BOSS_BULLET, gravity: 0.22 }));
          SFX.play('lob');
          this.throwsLeft--;
        }
        if (this.throwsLeft <= 0 && this.stateT > 30) {
          // 跳下撲向玩家
          this.facePlayer(game);
          this.vy = -3.5;
          this.vx = this.facing * 2.6;
          this.grounded = false;
          this.setState('drop');
          SFX.play('jump');
        }
        break;
      case 'drop': { // 落地震出雙向震波
        const r = this.applyGravity(game);
        if (r.hitWall) this.vx = 0;
        if (r.grounded && this.vy === 0 && this.y + this.h >= this.floorY(game) - 2) {
          this.vx = 0;
          game.shake(10);
          SFX.play('land');
          const fy = this.y + this.h - SPRITES.shockwave.h;
          game.enemyBullets.push(new Bullet(this.x - 10, fy, -2.6, 0, 'shockwave', { damage: DMG_SHOCKWAVE, groundHug: true }));
          game.enemyBullets.push(new Bullet(this.x + this.w - 2, fy, 2.6, 0, 'shockwave', { damage: DMG_SHOCKWAVE, groundHug: true }));
          this.setState('rest');
        }
        break;
      }
      case 'charge': { // 地面衝撞
        this.vy = Math.min(this.vy + BOSS_GRAVITY, MAX_FALL);
        const r = moveWithCollision(this, game.map);
        this.grounded = r.grounded;
        this.dashDist = (this.dashDist || 0) + Math.abs(this.vx);
        if (r.hitWall || this.dashDist > 230) {
          this.vx = 0;
          game.shake(6);
          this.setState('rest');
        }
        break;
      }
      case 'slam': { // 跳撲砸地 → 震落香蕉雨(鎖定玩家)
        const r = this.applyGravity(game);
        if (r.hitWall) this.vx = 0;
        if (r.grounded && this.vy === 0) {
          this.vx = 0;
          game.shake(12);
          SFX.play('land');
          const px = pl.x + pl.w / 2;
          for (const ox of (this.rage ? [-56, -28, 0, 28, 56] : [-28, 0, 28])) {
            const fx = Math.max(game.camera.x + 8, Math.min(px + ox, game.camera.x + SCREEN_W - 12));
            game.enemyBullets.push(new Bullet(fx - 4, -10, 0, 0.5, 'coconut', { damage: 3, gravity: 0.22 }));
          }
          this.setState('rest');
        }
        break;
      }
      case 'rest':
        this.vx = 0;
        this.applyGravity(game);
        if (this.stateT >= (this.rage ? 16 : 24)) this.setState('idle');
        break;
    }
  }
  frameFor() {
    if (this.state === 'windup') return [this.pending === 'charge' ? 'dash' : 'jump', ((this.stateT >> 2) & 1) ? '#f8f8f8' : null];
    if (this.state === 'charge') return ['dash', null];
    if (this.state === 'perch') return ['shoot', null];
    if (!this.grounded || this.state === 'climb' || this.state === 'slam' || this.state === 'drop') return ['jump', null];
    return [(this.animT >> 4) & 1 ? 'idle1' : 'idle2', null];
  }
}

// ── 冰霜妖靈(冰山):漂浮幽靈,冰凍彈凍住玩家 + 冰錐雨 + 貼身滑翔 ──
class FrostWraith extends BossBase {
  constructor(spawn, cfg) {
    super(spawn, cfg);
    this.w = SPRITES[this.cfg.sprite].w; this.h = SPRITES[this.cfg.sprite].h;
    this.y = spawn.y;
    this.anchorY = 96;
    this.glideY = 0;
  }
  launchAttack(game) {
    const pl = game.player;
    if (this.pending === 'orb') {
      // 冰凍彈:緩慢追蹤,命中凍住玩家(不扣血)——被凍住時最怕後續冰錐
      const n = this.rage ? 2 : 1;
      for (let i = 0; i < n; i++) {
        const dx = (pl.x + pl.w / 2) - (this.x + this.w / 2);
        game.queuedEnemyBullets.push(new Bullet(this.x + 5, this.y + 10 + i * 4,
          Math.sign(dx) * 1.1, 0.4, 'freezeOrb',
          { damage: 0, freezePlayer: true, homing: 0.032, maxSpeed: 1.5, life: 260 }));
      }
      SFX.play('freeze');
      this.setState('rest');
    } else if (this.pending === 'icicles') {
      const px = pl.x + pl.w / 2;
      for (const ox of (this.rage ? [-90, -56, -20, 20, 56, 90] : [-56, -20, 20, 56])) {
        const fx = Math.max(game.camera.x + 8, Math.min(px + ox, game.camera.x + SCREEN_W - 12));
        game.enemyBullets.push(new Bullet(fx - 3, -14, 0, 1, 'icicleShard', { damage: 3, gravity: 0.3 }));
      }
      SFX.play('crack');
      this.setState('rest');
    } else { // glide:降到玩家高度水平掠過
      this.glideY = Math.min(pl.y - 4, this.floorY(game) - this.h - 2);
      this.vx = this.facing * (this.rage ? 4.2 : 3.6);
      this.setState('glide');
    }
  }
  update(game) {
    if (this.dead) return;
    this.tick(); this.checkRage(game);
    if (this.stunT > 0) return;
    const pl = game.player;
    switch (this.state) {
      case 'wait':
        this.y += Math.sin(this.animT / 14) * 0.4;
        break;
      case 'idle': { // 幽靈飄移:緩慢貼近玩家上方
        const tx = pl.x + pl.w / 2 - this.w / 2;
        this.x += Math.max(-0.9, Math.min(0.9, (tx - this.x) * 0.04));
        this.y += (this.anchorY - this.y) * 0.06 + Math.sin(this.animT / 13) * 0.9;
        this.clampToRoom(game);
        this.facePlayer(game);
        if (this.stateT >= (this.rage ? 22 : 32)) this.pickAttack(game, ['orb', 'icicles', 'glide']);
        break;
      }
      case 'windup':
        this.y += Math.sin(this.animT / 6) * 0.7; // 顫動
        if (this.stateT >= (this.rage ? 12 : 18)) this.launchAttack(game);
        break;
      case 'glide': // 沉到玩家高度 → 高速水平掠過
        if (this.y < this.glideY - 2) { this.y += 3; break; }
        this.x += this.vx;
        if (this.x <= this.roomLeft(game) + 4 || this.x >= game.map.widthPx - this.w - 4) {
          this.clampToRoom(game);
          this.setState('rest');
        }
        break;
      case 'rest':
        // 法術或滑翔結束後降到地面射線，讓普通手炮一定有輸出機會。
        {
          const targetY = this.floorY(game) - this.h - 4;
          const dy = targetY - this.y;
          this.y += Math.max(-4, Math.min(4, dy));
          if (Math.abs(dy) <= 4) this.y = targetY;
          this.facePlayer(game);
          if (this.stateT >= (this.rage ? 48 : 60)) this.setState('idle');
        }
        break;
    }
  }
  frameFor() {
    if (this.state === 'windup') return ['shoot', ((this.stateT >> 2) & 1) ? '#f8f8f8' : null];
    if (this.state === 'glide') return ['dash', null];
    return [(this.animT >> 4) & 1 ? 'idle1' : 'idle2', null];
  }
}

// ── 熔爐魔神(熔岩):行走噴火(燒傷)、隕石雨、地裂震波、火焰防護罩 ──
class MagmaDjinn extends BossBase {
  constructor(spawn, cfg) {
    super(spawn, cfg);
    this.w = SPRITES[this.cfg.sprite].w; this.h = SPRITES[this.cfg.sprite].h;
    this.flameT = 0;
    this.fireShieldT = 0;   // 火焰防護罩（對應玩家火盾）
  }
  fireRects() {
    if (this.fireShieldT <= 0) return [];
    const boxes = [];
    const cx = this.x + this.w / 2, cy = this.y + this.h / 2;
    const rx = this.w / 2 + 4, ry = this.h / 2 - 2;
    for (let i = 0; i < 4; i++) {
      const a = this.animT * 0.11 + i * Math.PI / 2;
      boxes.push({
        x: Math.round(cx + Math.cos(a) * rx - SPRITES.fireOrb.w / 2),
        y: Math.round(cy + Math.sin(a) * ry - SPRITES.fireOrb.h / 2),
        w: SPRITES.fireOrb.w, h: SPRITES.fireOrb.h,
      });
    }
    return boxes;
  }
  hazardRects() { return this.fireRects(); }
  blocksProjectile(p) { return this.fireShieldT > 0 && this.fireRects().some((o) => aabbOverlap(o, p)); }
  draw(ctx, camera) {
    super.draw(ctx, camera);
    if (this.fireShieldT > 0) {
      const f = (this.animT >> 2) & 1 ? 'f1' : 'f2';
      for (const o of this.fireRects()) drawSprite(ctx, 'fireOrb', o.x - camera.x, o.y, { frame: f });
    }
  }
  launchAttack(game) {
    if (this.pending === 'fireShield') {
      this.fireShieldT = this.rage ? 300 : 220; // 一段時間的環繞火焰，可擋彈並灼傷貼近的玩家
      SFX.play('flame');
      this.setState('rest');
      return;
    }
    if (this.pending === 'flamethrower') {
      this.flameT = this.rage ? 84 : 64;
      this.setState('flamethrower');
      SFX.play('flame');
    } else if (this.pending === 'meteor') {
      // 朝天噴出火雨,落下時附燒傷
      const n = this.rage ? 6 : 4;
      for (let i = 0; i < n; i++) {
        const vx = -2.4 + (i / (n - 1)) * 4.8;
        game.queuedEnemyBullets.push(new Bullet(this.x + this.w / 2 - 3, this.y - 2,
          vx, -6.5, 'fireball', { damage: 3, gravity: 0.16, burn: true }));
      }
      SFX.play('flame');
      game.shake(4);
      this.setState('rest');
    } else { // wave:重拳砸地,雙向地裂震波
      game.shake(10);
      SFX.play('land');
      const fy = this.floorY(game) - SPRITES.shockwave.h;
      game.enemyBullets.push(new Bullet(this.x - 10, fy, -2.8, 0, 'shockwave', { damage: DMG_SHOCKWAVE, groundHug: true }));
      game.enemyBullets.push(new Bullet(this.x + this.w - 2, fy, 2.8, 0, 'shockwave', { damage: DMG_SHOCKWAVE, groundHug: true }));
      this.setState('rest');
    }
  }
  update(game) {
    if (this.dead) return;
    this.tick(); this.checkRage(game);
    if (this.fireShieldT > 0) this.fireShieldT--;
    if (this.stunT > 0) { this.vx = 0; this.applyGravity(game); return; } // 硬直仍落地
    switch (this.state) {
      case 'wait':
        this.applyGravity(game);
        break;
      case 'idle':
        this.facePlayer(game);
        this.vx = this.facing * 0.5;
        this.applyGravity(game);
        if (this.stateT >= (this.rage ? 20 : 30)) {
          const pool = this.fireShieldT > 0 ? ['flamethrower', 'meteor', 'wave']
                                            : ['flamethrower', 'meteor', 'wave', 'fireShield'];
          this.pickAttack(game, pool);
        }
        break;
      case 'windup':
        this.vx = 0;
        this.applyGravity(game);
        if (this.stateT >= (this.rage ? 14 : 20)) this.launchAttack(game);
        break;
      case 'flamethrower': { // 一邊前進一邊噴出火舌牆(命中燒傷)
        this.vx = this.facing * (this.rage ? 0.8 : 0.6);
        this.applyGravity(game);
        if (this.stateT % 5 === 0) {
          const mx = this.facing > 0 ? this.x + this.w : this.x - 9;
          game.enemyBullets.push(new Bullet(mx, this.y + 6 + ((this.stateT >> 2) % 3) * 4,
            this.facing * 2.4, -0.1 + ((this.stateT % 10) / 25), 'flameJet',
            { damage: 2, burn: true, life: 32 }));
        }
        if (--this.flameT <= 0) { this.vx = 0; this.setState('rest'); }
        break;
      }
      case 'rest':
        this.vx = 0;
        this.applyGravity(game);
        if (this.stateT >= (this.rage ? 16 : 24)) this.setState('idle');
        break;
    }
  }
  frameFor() {
    if (this.state === 'windup') return ['shoot', ((this.stateT >> 2) & 1) ? '#f8f8f8' : null];
    if (this.state === 'flamethrower') return ['dash', null];
    return [(this.animT >> 4) & 1 ? 'idle1' : 'idle2', null];
  }
}

// ── 時間賽車手(賽道一王):紅綠燈停時、輪胎突進、渦輪零件蓄力 ──
class ChronoMarshal extends BossBase {
  constructor(spawn, cfg) {
    super(spawn, cfg);
    this.w = SPRITES[this.cfg.sprite].w; this.h = SPRITES[this.cfg.sprite].h;
    this.shotsLeft = 0;
    this.stopPattern = 'low';
  }
  fireMissile(game, charged = false, duringStop = false) {
    this.facePlayer(game);
    const sprite = charged ? 'bossMissileBig' : 'bossMissile';
    const spr = SPRITES[sprite];
    const x = this.facing > 0 ? this.x + this.w - 2 : this.x - spr.w + 2;
    // 一般狀態的輪胎／引擎零件仍會追蹤，但停時攻擊改用可預判的固定路徑。
    const y = this.y + (charged ? 15 : 18);
    const mx = x + spr.w / 2, my = y + spr.h / 2;
    const px = game.player.x + game.player.w / 2, py = game.player.y + game.player.h / 2;
    const d = Math.hypot(px - mx, py - my) || 1;
    const speed = charged ? 3.25 : 3.55;
    game.enemyBullets.push(new Bullet(x, y, (px - mx) / d * speed, (py - my) / d * speed, sprite, {
      damage: charged ? 6 : 3,
      homing: charged ? 0.04 : 0.022,
      maxSpeed: charged ? 4.5 : 4.0,
      life: charged ? 240 : 180,
      timeProof: duringStop,
    }));
    SFX.play(charged ? 'bigShot' : 'shoot');
  }
  armStopPattern(game) {
    // 不再從天空落下武器；紅燈前起跳即可避開固定高度的地面輪胎。
    this.stopPattern = 'low';
  }
  launchTireRush(game, reverse = false) {
    const spr = SPRITES.bossMissile;
    const L = this.roomLeft(game);
    const mid = L + SCREEN_W / 2;
    let fromLeft = game.player.x + game.player.w / 2 >= mid;
    if (reverse) fromLeft = !fromLeft;
    const x = fromLeft ? L + 5 : game.map.widthPx - spr.w - 5;
    const y = this.floorY(game) - spr.h;
    game.enemyBullets.push(new Bullet(x, y, fromLeft ? 3.6 : -3.6, 0, 'bossMissile', {
      damage: 5, groundHug: true, life: 120, timeProof: true,
    }));
    SFX.play('bigShot');
  }
  launchAttack(game) {
    if (this.pending === 'timeStop') {
      // 時停啟動瞬間抹除玩家既有受擊無敵，不能靠閃爍狀態硬吃整套攻勢。
      game.player.invulnTimer = 0;
      game.timeStopT = this.rage ? 130 : 110;
      game.timeStopSource = 'boss';
      this.shotsLeft = 0;
      this.setState('timeStop');
      if (this.stopPattern === 'low') this.launchTireRush(game);
      game.shake(6);
      SFX.play('charged');
    } else if (this.pending === 'missiles') {
      this.shotsLeft = this.rage ? 7 : 5;
      this.setState('missiles');
    } else {
      this.shotsLeft = this.rage ? 2 : 1;
      this.setState('charge');
      SFX.play('charged');
    }
  }
  update(game) {
    if (this.dead) return;
    this.tick(); this.checkRage(game);
    if (this.stunT > 0) { this.vx = 0; this.applyGravity(game); return; } // 硬直仍落地
    switch (this.state) {
      case 'wait':
        this.applyGravity(game);
        break;
      case 'idle':
        this.facePlayer(game);
        this.vx = this.facing * (this.rage ? 1.15 : 0.85);
        this.applyGravity(game); this.clampToRoom(game);
        if (this.stateT >= (this.rage ? 20 : 30)) {
          // 停時在招式池出現兩次，讓核心能力成為真正威脅，但仍不會連續施放。
          this.pickAttack(game, ['timeStop', 'missiles', 'charge', 'timeStop']);
        }
        break;
      case 'windup': {
        this.vx = 0; this.applyGravity(game);
        if (this.pending === 'timeStop' && this.stateT === 1) this.armStopPattern(game);
        if (this.pending === 'timeStop' && (this.stateT === 1 || this.stateT === 21 || this.stateT === 41)) {
          SFX.play('tick');
        }
        const telegraph = this.pending === 'timeStop' ? CHRONO_STOP_WARN_FRAMES : 18;
        if (this.stateT >= telegraph) this.launchAttack(game);
        break;
      }
      case 'timeStop': { // 玩家凍結時仍會走位，但攻擊軌道已在紅燈前完整揭露
        const pc = game.player.x + game.player.w / 2;
        const bc = this.x + this.w / 2;
        const dx = pc - bc;
        const dist = Math.abs(dx);
        const toward = dx < 0 ? -1 : 1;
        this.facing = toward;
        if (dist < 82) {
          this.vx = -toward * (this.rage ? 1.8 : 1.45); // 太近就後撤
        } else if (dist > 132) {
          this.vx = toward * (this.rage ? 1.55 : 1.25); // 太遠才靠近
        } else {
          const paceToward = ((this.stateT >> 4) & 1) === 0;
          this.vx = (paceToward ? toward : -toward) * (this.rage ? 1.05 : 0.8);
        }
        const r = this.applyGravity(game);
        if (r.hitWall) { this.vx = 0; this.facePlayer(game); }
        this.clampToRoom(game);
        // 狂暴時低輪胎會從另一側再掃一次；只要紅燈前跳起，兩次都會從腳下通過。
        if (this.stopPattern === 'low' && this.rage && this.stateT === 52) this.launchTireRush(game, true);
        if (game.timeStopT <= 0) this.setState('rest');
        break;
      }
      case 'missiles':
        this.facePlayer(game);
        this.vx = this.facing * (this.rage ? 1.1 : 0.7);
        this.applyGravity(game); this.clampToRoom(game);
        if (this.stateT % 11 === 1 && this.shotsLeft > 0) {
          this.fireMissile(game, false, false); this.shotsLeft--;
        }
        if (this.shotsLeft <= 0 && this.stateT > 62) this.setState('rest');
        break;
      case 'charge':
        this.facePlayer(game);
        this.vx = this.facing * 0.35; this.applyGravity(game); this.clampToRoom(game);
        if (this.stateT === (this.rage ? 38 : 48) && this.shotsLeft > 0) {
          this.fireMissile(game, true, false); this.shotsLeft--;
        }
        if (this.rage && this.stateT === 62 && this.shotsLeft > 0) {
          this.fireMissile(game, true, false); this.shotsLeft--;
        }
        if (this.stateT >= (this.rage ? 76 : 68)) this.setState('rest');
        break;
      case 'rest':
        this.vx = 0; this.applyGravity(game);
        if (this.stateT >= (this.rage ? 12 : 20)) this.setState('idle');
        break;
    }
  }
  frameFor() {
    if (this.state === 'charge') return ['charge', ((this.stateT >> 2) & 1) ? '#f8d820' : null];
    if (this.state === 'timeStop') return [Math.abs(this.vx) > 0.4 ? 'dash' : 'charge', ((this.stateT >> 3) & 1) ? '#80a8c0' : null];
    if (this.state === 'missiles' || this.state === 'windup') return ['shoot', null];
    return [(this.animT >> 4) & 1 ? 'idle1' : 'idle2', null];
  }
}

// ── 暗影複製體(要塞二王)：直接共用玩家動作幀與移動參數的三階段鏡像戰 ──
class ShadowClone extends BossBase {
  constructor(spawn, cfg) {
    super(spawn, cfg);
    this.shadowClone = true;
    this.w = SPRITES.player.w; this.h = SPRITES.player.h;
    this.phase = 1;
    this.transitionT = 0;
    this.currentWeapon = 'buster';
    // 火盾改為自動維持的護盾（見 raiseFireShield），不再放進輪替攻擊池。
    this.weaponOrder = ['bolt', 'seed', 'ice', 'time'];
    this.weaponIndex = 0;
    this.phase2ActionCount = 0;
    this.phase3ActionCount = 0;
    this.attackCooldown = 40;
    this.cannonCooldown = 70;
    this.restDuration = 24;
    this.jumpEvadeCd = 0;   // 主動跳躍閃彈的冷卻
    this.pendingAdvance = false;
    this.fireShieldT = 0;
    this.fireShieldHits = 0;   // 環繞火焰剩餘可擋次數（0 = 無盾）
    this.fireShieldCd = 0;     // 被打破後的重生冷卻（約 3 秒）
    this.mirrorTargetX = 0;
    this.mirrorDir = 1;
    this.lastPlayerJump = false;
    this.lastPlayerSlide = false;
    this.queuedPlayerJump = false;
    this.queuedSlideEvade = false;
    this.bigCannonFrames = [];
    this.phaseHistory = [1];
    this.busterInterleave = true;  // 特殊武器之間插入手炮，避免連續特殊顯得刻意
    this.timeShots = 0;            // 停時期間已發射的地面彈數
    this.shuffleWeapons();
  }

  // 每階段開始洗牌武器順序，套路每場、每階段都不同。
  shuffleWeapons() {
    for (let i = this.weaponOrder.length - 1; i > 0; i--) {
      const j = (RNG.next() * (i + 1)) | 0;
      const t = this.weaponOrder[i]; this.weaponOrder[i] = this.weaponOrder[j]; this.weaponOrder[j] = t;
    }
  }

  speedScale() { return this.phase === 3 ? 1.3 : 1; }

  moveLikePlayer(game) {
    this.vy = Math.min(this.vy + GRAVITY, MAX_FALL);
    const r = moveWithCollision(this, game.map);
    this.grounded = r.grounded;
    this.clampToRoom(game);
    return r;
  }

  // 是否有一發接近水平、朝分身逼近且高度相仿的玩家彈值得跳過。
  dodgeIncomingBullet(game) {
    const bc = this.x + this.w / 2, by = this.y + this.h / 2;
    for (const b of game.playerBullets) {
      if (b.dead || Math.abs(b.vy) > 0.6) continue;      // 只閃接近水平的彈
      if (Math.abs((b.y + b.h / 2) - by) > 12) continue; // 高度相近才會打到腳
      const bx = b.x + b.w / 2;
      const closing = bx < bc ? b.vx > 0.5 : b.vx < -0.5;
      if (closing && Math.abs(bx - bc) < 46) return true;
    }
    return false;
  }

  weaponColor() {
    return this.currentWeapon === 'buster' ? '#80e8f8' : WEAPONS[this.currentWeapon].color;
  }

  shootBuster(game, charged = false, aimed = false) {
    this.facePlayer(game);
    const sprite = charged ? 'bulletBig' : 'bulletSmall';
    const spr = SPRITES[sprite];
