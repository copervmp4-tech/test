// 暗影複製體完全共用玩家 sprite，只以調色盤做出黑甲、紫色暗部與紅眼。
const SHADOW_REMAP = {
  '#80d0ff': '#403050',
  '#ffd8a8': '#181018',
  '#204060': '#f83800',
  '#00a8f0': '#181820',
  '#0060c0': '#301840',
};
// 暗影複製體的武器投射物統一染成暗紫色剪影（暗黑武器）。可視需要微調亮度。
const SHADOW_BULLET_TINT = '#6a4a9c';

/* ================================================================
 * MODULE: input — 鍵盤(held / pressed 抽象)
 * ================================================================ */
const Input = {
  bindings: {
    left:  ['ArrowLeft', 'KeyA'],
    right: ['ArrowRight', 'KeyD'],
    up:    ['ArrowUp', 'KeyW'],
    down:  ['ArrowDown', 'KeyS'],
    jump:  ['KeyZ', 'KeyK', 'Space'],
    shoot: ['KeyX', 'KeyJ'],
    weapon: ['KeyQ', 'Tab'],   // 開啟武器選單
    pause: ['Escape', 'Enter'],
    mute: ['KeyM'],
    reset: ['KeyR'],
  },
  _down: new Set(),
  _pressed: new Set(),
  _virtual: new Set(),        // 觸控虛擬按鍵(以動作名稱記錄)
  _virtualPressed: new Set(),
  swapped: false,
  init() {
    try {
      const cfg = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
      this.swapped = !!cfg.swapJumpFire;
    } catch (e) { this.swapped = false; }
    addEventListener('keydown', (e) => {
      SFX.init(); // AudioContext 需要使用者手勢才能啟動
      if (e.repeat) return;
      this._down.add(e.code);
      this._pressed.add(e.code);
      if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','Tab'].includes(e.code)) e.preventDefault();
    });
    addEventListener('keyup', (e) => this._down.delete(e.code));
    addEventListener('blur', () => {
      this._down.clear();
      this._pressed.clear();
      this._virtual.clear();
      this._virtualPressed.clear();
    });
  },
  physicalAction(a) {
    if (!this.swapped) return a;
    if (a === 'jump') return 'shoot';
    if (a === 'shoot') return 'jump';
    return a;
  },
  held(a) {
    const physical = this.physicalAction(a);
    return this._virtual.has(a) || this.bindings[physical].some((k) => this._down.has(k));
  },
  pressed(a) {
    const physical = this.physicalAction(a);
    return this._virtualPressed.has(a) || this.bindings[physical].some((k) => this._pressed.has(k));
  },
  endFrame() { this._pressed.clear(); this._virtualPressed.clear(); },
  toggleSwap() {
    this.swapped = !this.swapped;
    try {
      const cfg = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
      cfg.swapJumpFire = this.swapped;
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(cfg));
    } catch (e) {}
    return this.swapped;
  },

  // 觸控層呼叫:模擬按下/放開一個動作
  setVirtual(action, on) {
    if (on && !this._virtual.has(action)) this._virtualPressed.add(action);
    if (on) this._virtual.add(action); else this._virtual.delete(action);
  },
};

/* ================================================================
 * MODULE: touch-ui — 手機觸控虛擬按鍵(僅在觸控裝置顯示)
 *   左:十字鍵(支援滑動換方向、斜向同按) 右:FIRE / JUMP + R
 *   透過 Input.setVirtual() 餵給輸入層,長按蓄力/長按跳高都可用
 * ================================================================ */
const TouchUI = {
  active: false,
  init() {
    const coarse = matchMedia('(pointer: coarse)').matches || window.__forceTouch;
    if (!coarse) return;
    this.active = true;

    const style = document.createElement('style');
    style.textContent = `
      #hint { display: none; }
      body { justify-content: flex-start; padding-top: 10px; }
      #touch-ui {
        position: fixed; left: 0; right: 0; bottom: 0; height: 168px;
        display: flex; justify-content: space-between; align-items: flex-end;
        padding: 0 14px calc(10px + env(safe-area-inset-bottom, 0px));
        touch-action: none; user-select: none; -webkit-user-select: none;
        pointer-events: none; z-index: 10;
        font-family: monospace;
      }
      #touch-ui > * { pointer-events: auto; }
      #t-dpad {
        position: relative; width: 138px; height: 138px;
        touch-action: none;
      }
      .t-arrow {
        position: absolute; width: 46px; height: 46px;
        background: rgba(120,130,190,.14);
        border: 2px solid rgba(120,130,190,.4);
        border-radius: 8px; box-sizing: border-box;
        color: rgba(200,210,255,.55); font-size: 18px;
        display: flex; align-items: center; justify-content: center;
      }
      .t-arrow.on { background: rgba(248,216,32,.3); border-color: rgba(248,216,32,.8); color: #f8d820; }
      #t-up    { left: 46px; top: 0; }
      #t-down  { left: 46px; bottom: 0; }
      #t-left  { left: 0; top: 46px; }
      #t-right { right: 0; top: 46px; }
      .t-btns { display: flex; align-items: flex-end; gap: 14px; touch-action: none; }
      .t-btn {
        width: 62px; height: 62px; border-radius: 50%;
        background: rgba(120,130,190,.14);
        border: 2px solid rgba(120,130,190,.4);
        box-sizing: border-box;
        color: rgba(200,210,255,.6); font-size: 11px; letter-spacing: 1px;
        display: flex; align-items: center; justify-content: center;
        touch-action: none;
      }
      .t-btn.on { background: rgba(248,216,32,.3); border-color: rgba(248,216,32,.8); color: #f8d820; }
      .t-col { display: flex; flex-direction: column; gap: 10px; margin-bottom: 34px; }
      #t-reset, #t-weapon { width: 40px; height: 40px; font-size: 9px; }
    `;
    document.head.appendChild(style);

    const root = document.createElement('div');
    root.id = 'touch-ui';
    root.innerHTML = `
      <div id="t-dpad">
        <div class="t-arrow" id="t-up">▲</div>
        <div class="t-arrow" id="t-left">◀</div>
        <div class="t-arrow" id="t-right">▶</div>
        <div class="t-arrow" id="t-down">▼</div>
      </div>
      <div class="t-btns">
        <div class="t-col">
          <div class="t-btn" id="t-weapon">WPN</div>
          <div class="t-btn" id="t-reset">MENU</div>
        </div>
        <div class="t-btn" id="t-shoot">FIRE</div>
        <div class="t-btn" id="t-jump">JUMP</div>
      </div>`;
    document.body.appendChild(root);

    // 全域多點觸控：每次觸控事件都用「所有觸點 × 按鈕矩形」重新命中測試，
    // 因此同時按、按住、手指滑動切鈕都可靠（不再依賴單一元素的 targetTouches）。
    const dpad = document.getElementById('t-dpad');
    const arrows = {
      up: document.getElementById('t-up'), down: document.getElementById('t-down'),
      left: document.getElementById('t-left'), right: document.getElementById('t-right'),
    };
    const btns = [
      { el: document.getElementById('t-jump'), action: 'jump' },
      { el: document.getElementById('t-shoot'), action: 'shoot' },
      { el: document.getElementById('t-reset'), action: 'pause' },
      { el: document.getElementById('t-weapon'), action: 'weapon' },
    ];
    const inRect = (r, x, y, pad = 0) =>
      x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad;
    const ACTIONS = ['jump', 'shoot', 'pause', 'weapon', 'left', 'right', 'up', 'down'];
    const refresh = (e) => {
      e.preventDefault(); SFX.init();
      const on = { jump: false, shoot: false, pause: false, weapon: false, left: false, right: false, up: false, down: false };
      const dr = dpad.getBoundingClientRect();
      const dcx = dr.left + dr.width / 2, dcy = dr.top + dr.height / 2;
      for (const t of e.touches) {              // e.touches = 螢幕上所有觸點
        const x = t.clientX, y = t.clientY;
        if (inRect(dr, x, y, 16)) {             // 十字鍵：依相對中心決定方向（含斜向）
          if (x - dcx < -14) on.left = true; else if (x - dcx > 14) on.right = true;
          if (y - dcy < -14) on.up = true; else if (y - dcy > 14) on.down = true;
          continue;
        }
        for (const b of btns) if (inRect(b.el.getBoundingClientRect(), x, y)) on[b.action] = true;
      }
      for (const a of ACTIONS) Input.setVirtual(a, on[a]);
      for (const b of btns) b.el.classList.toggle('on', on[b.action]);
      for (const d of ['left', 'right', 'up', 'down']) arrows[d].classList.toggle('on', on[d]);
    };
    for (const ev of ['touchstart', 'touchmove', 'touchend', 'touchcancel']) {
      root.addEventListener(ev, refresh, { passive: false });
    }
  },
};

/* ================================================================
 * MODULE: sfx — Web Audio 程式合成 NES 風格音效
 * ================================================================ */
const SFX = (() => {
  let ac = null;
  let muted = false;
  let noiseBuffer = null;
  function init() {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) { /* 無聲環境(headless 等)直接靜音 */ }
  }
  // 方波掃頻(NES pulse channel 風味)
  function sweep(f0, f1, dur, vol = 0.12, delay = 0, type = 'square') {
    if (!ac || muted) return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(1, f0), t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  // 雜訊爆音(NES noise channel 風味)
  function noise(dur, vol = 0.2, delay = 0) {
    if (!ac || muted) return;
    const t = ac.currentTime + delay;
    // 白噪音緩衝只建立一次，避免連續爆炸時產生大量 GC。
    if (!noiseBuffer) {
      noiseBuffer = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuffer.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ac.createBufferSource(); s.buffer = noiseBuffer;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(g).connect(ac.destination);
    s.start(t);
  }
  const table = {
    shoot:    () => sweep(880, 240, 0.07, 0.1),
    charged:  () => { sweep(300, 900, 0.12, 0.12); sweep(600, 1200, 0.12, 0.08, 0.06); }, // 蓄力完成
    bigShot:  () => { sweep(1300, 160, 0.22, 0.16); noise(0.08, 0.12); },
    jump:     () => sweep(180, 460, 0.1, 0.1),
    slide:    () => { sweep(240, 110, 0.12, 0.08); noise(0.04, 0.05); },
    hurt:     () => { noise(0.12, 0.2); sweep(420, 90, 0.18, 0.14); },
    die:      () => { noise(0.35, 0.25); sweep(600, 50, 0.5, 0.16); },
    enemyDie: () => { noise(0.12, 0.22); sweep(500, 100, 0.1, 0.1); },
    pickup:   () => { sweep(660, 660, 0.05, 0.1); sweep(990, 990, 0.08, 0.1, 0.055); },
    tick:     () => sweep(1100, 1100, 0.03, 0.09),
    door:     () => sweep(90, 45, 0.5, 0.18),
    bossHit:  () => sweep(220, 110, 0.05, 0.1),
    weakHit:  () => { sweep(140, 1200, 0.16, 0.16); sweep(900, 1800, 0.1, 0.1, 0.05); },
    bossDie:  () => {
      for (let i = 0; i < 6; i++) {
        noise(0.22, 0.2, i * 0.14);
        sweep(900 - i * 130, 50, 0.28, 0.13, i * 0.14);
      }
    },
    land:     () => noise(0.04, 0.07),
    zap:      () => { sweep(1600, 200, 0.09, 0.12); noise(0.04, 0.08); },
    boing:    () => sweep(140, 720, 0.18, 0.14),
    lob:      () => sweep(320, 110, 0.12, 0.1),
    thunderWarn: () => sweep(1400, 1400, 0.04, 0.07),
    wswitch:  () => { sweep(500, 800, 0.05, 0.08); sweep(800, 500, 0.05, 0.06, 0.05); },
    empty:    () => sweep(220, 160, 0.05, 0.06),
    freeze:   () => { sweep(1200, 2000, 0.1, 0.09); sweep(900, 1600, 0.1, 0.07, 0.05); },
    flame:    () => { noise(0.14, 0.16); sweep(300, 90, 0.16, 0.1); },
    crack:    () => { noise(0.08, 0.18); sweep(1800, 600, 0.06, 0.08); },
    rage:     () => { sweep(200, 700, 0.2, 0.14); sweep(200, 700, 0.2, 0.1, 0.12); },
    weaponGet:() => { for (let i = 0; i < 4; i++) sweep(400 + i * 200, 400 + i * 200, 0.1, 0.12, i * 0.09); },
  };
  return {
    init,
    play(name) { try { if (!muted && table[name]) table[name](); } catch (e) {} },
    tone(freq, dur = 0.09, vol = 0.035, type = 'square', delay = 0) {
      try { sweep(freq, freq, dur, vol, delay, type); } catch (e) {}
    },
    toggleMute() { muted = !muted; return muted; },
    isMuted() { return muted; },
  };
})();

/* ================================================================
 * MODULE: music — 影格驅動的晶片音樂，不使用計時器，暫停時自然停止
 * ================================================================ */
const Music = (() => {
  const N = 0;
  const tracks = {
    select: [659, 784, 988, 784, 659, 523, 587, 659, 784, 988, 1175, 988, 784, 659, 587, N],

// 原四王除蝙蝠外統一放大約 18%；蝙蝠已直接重畫為更大的人形尺寸。
function scaleSpriteData(name, factor) {
  const spr = SPRITES[name];
  if (!spr) return;
  spr.w = Math.round(spr.w * factor);
  spr.h = Math.round(spr.h * factor);
  for (const key of Object.keys(spr.frames)) {
    spr.frames[key] = spr.frames[key].map(([x, y, w, h, color]) => [
      Math.round(x * factor), Math.round(y * factor),
      Math.max(1, Math.round(w * factor)), Math.max(1, Math.round(h * factor)), color,
    ]);
  }
}
['bossKong', 'bossWraith', 'bossDjinn'].forEach((name) => scaleSpriteData(name, 1.18));
// 全部 Boss 尺寸統一縮為目前的 0.95 倍（暗影複製體共用玩家 sprite，維持與玩家同尺寸）。
['bossBat', 'bossKong', 'bossWraith', 'bossDjinn', 'bossChrono'].forEach((name) => scaleSpriteData(name, 0.95));

const SPRITE_CACHE = new Map();
function cachedSprite(name, frameName, flip) {
  const key = `${name}:${frameName}:${flip ? 1 : 0}`;
  if (SPRITE_CACHE.has(key)) return SPRITE_CACHE.get(key);
  try {
    const spr = SPRITES[name];
    const c = document.createElement('canvas');
    c.width = spr.w; c.height = spr.h;
    const cctx = c.getContext && c.getContext('2d');
    if (!cctx) return null;
    cctx.imageSmoothingEnabled = false;
    for (const [dx, dy, w, h, color] of spr.frames[frameName]) {
      cctx.fillStyle = color;
      cctx.fillRect(flip ? spr.w - dx - w : dx, dy, w, h);
    }
    SPRITE_CACHE.set(key, c);
    return c;
  } catch (e) { return null; }
}

function drawSprite(ctx, name, x, y, opts = {}) {
  const spr = SPRITES[name];
  const frameName = spr.frames[opts.frame] ? opts.frame : (spr._firstFrame || (spr._firstFrame = Object.keys(spr.frames)[0]));
  const frame = spr.frames[frameName];
  const flip = !!opts.flip;
  x = Math.round(x); y = Math.round(y);
  if (!opts.override && !opts.remap && ctx.drawImage) {
    const cached = cachedSprite(name, frameName, flip);
    if (cached) { ctx.drawImage(cached, x, y); return; }
  }
  for (const [dx, dy, w, h, color] of frame) {
    ctx.fillStyle = opts.override || (opts.remap && opts.remap[color]) || color;
    const rx = flip ? spr.w - dx - w : dx;
    ctx.fillRect(x + rx, y + dy, w, h);
  }
}

  ice:    { base: '#5878a8', top: '#d8e8f8', seam: '#38507c', plat: ['#88b8d8','#d8f0f8','#4878a8','#2c4c6c'], spike: ['#a8d0e8','#f0f8ff'], ladder: ['#6890b8','#c8e0f0'] },
  magma:  { base: '#40282c', top: '#785048', seam: '#241014', plat: ['#584038','#786058','#382820','#f87838'], spike: ['#584048','#f8a838'], ladder: ['#785048','#a87858'] },
  castle: { base: '#252a30', top: '#737b84', seam: '#15191e', plat: ['#3b444d','#aeb7bf','#20262c','#d03424'], spike: ['#707078','#f8f8f8'], ladder: ['#687078','#b8c0c8'] },
  shadow: { base: '#18142c', top: '#605080', seam: '#0a0814', plat: ['#302850','#7860a0','#181028','#a848b8'], spike: ['#504070','#d8c8f8'], ladder: ['#604878','#b890d0'] },
};

const TILE_ART = {
  '#': (ctx, x, y, t, map) => {
    const c = THEME_TILES[map.theme] || THEME_TILES.city;
    ctx.fillStyle = c.base; ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = c.top; ctx.fillRect(x, y, TILE, map.theme === 'jungle' || map.theme === 'ice' ? 3 : 2);
    ctx.fillStyle = c.seam;
    ctx.fillRect(x + 4, y + 7, 2, 2); ctx.fillRect(x + 11, y + 10, 2, 2); ctx.fillRect(x + 2, y + 12, 2, 2);
    if (map.theme === 'magma') { // 岩縫透出的熔光
      ctx.fillStyle = '#a83808';
      ctx.fillRect(x + 7, y + 6, 2, 5); ctx.fillRect(x + 3, y + 9, 4, 2);
    } else if (map.theme === 'castle') { // 賽道地磚：低彩度瀝青，只留少量紅色定位標
      ctx.fillStyle = '#515860'; ctx.fillRect(x, y, TILE, 2);
      ctx.fillStyle = '#343a40'; ctx.fillRect(x + 2, y + 8, 5, 1); ctx.fillRect(x + 10, y + 12, 4, 1);
      ctx.fillStyle = '#a82c24'; ctx.fillRect(x + 12, y + 1, 3, 1);
    } else if (map.theme === 'shadow') { // 要塞內部的紫色電路刻線
      ctx.fillStyle = '#342858'; ctx.fillRect(x + 2, y + 6, 8, 1);
      ctx.fillRect(x + 9, y + 6, 1, 5); ctx.fillRect(x + 9, y + 10, 5, 1);
      ctx.fillStyle = '#a848b8'; ctx.fillRect(x + 3, y + 5, 2, 2);
    }
  },
  '=': (ctx, x, y, t, map) => {
    const p = (THEME_TILES[map.theme] || THEME_TILES.city).plat;
    ctx.fillStyle = p[0]; ctx.fillRect(x, y + 2, TILE, 12);
    ctx.fillStyle = p[1]; ctx.fillRect(x, y + 2, TILE, 3);
    ctx.fillStyle = p[2]; ctx.fillRect(x, y + 12, TILE, 2);
    ctx.fillStyle = p[3]; ctx.fillRect(x + 2, y + 6, 2, 2); ctx.fillRect(x + 12, y + 6, 2, 2);
    if (map.theme === 'castle') { // 高架維修道：灰色鋼板、單一紅色邊線
      ctx.fillStyle = '#3b444d'; ctx.fillRect(x, y + 2, TILE, 12);
      ctx.fillStyle = '#aeb7bf'; ctx.fillRect(x, y + 2, TILE, 2);
      ctx.fillStyle = '#d03424'; ctx.fillRect(x, y + 11, TILE, 2);
      ctx.fillStyle = '#f0f0f0'; ctx.fillRect(x + 3, y + 6, 2, 2); ctx.fillRect(x + 12, y + 6, 2, 2);
    }
  },
  '^': (ctx, x, y, t, map) => {
    const s = (THEME_TILES[map.theme] || THEME_TILES.city).spike;
    ctx.fillStyle = s[0];
    for (const sx of [0, 8]) {
      ctx.fillRect(x + sx + 3, y + 4, 2, 12);
      ctx.fillRect(x + sx + 2, y + 8, 4, 8);
      ctx.fillRect(x + sx + 1, y + 12, 6, 4);
    }
    ctx.fillStyle = s[1];
    ctx.fillRect(x + 3, y + 4, 1, 8); ctx.fillRect(x + 11, y + 4, 1, 8);
  },
  'H': (ctx, x, y, t, map) => {
    const l = (THEME_TILES[map.theme] || THEME_TILES.city).ladder;
    ctx.fillStyle = l[0];
    ctx.fillRect(x + 2, y, 2, TILE); ctx.fillRect(x + 12, y, 2, TILE);
    ctx.fillStyle = l[1];
    ctx.fillRect(x + 2, y + 3, 12, 2); ctx.fillRect(x + 2, y + 11, 12, 2);
  },
  'I': (ctx, x, y) => { // 滑冰面
    ctx.fillStyle = '#a0d0f0'; ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#e8f8ff'; ctx.fillRect(x, y, TILE, 3);
    ctx.fillStyle = '#6898c8'; ctx.fillRect(x, y + 13, TILE, 3);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x + 3, y + 5, 5, 1); ctx.fillRect(x + 9, y + 8, 4, 1);
  },
  'F': (ctx, x, y, t, map, wx) => { // 火焰噴射柱(噴嘴 + 定時火柱)
    const col = wx / TILE;
    if (map.game && map.game.isFrozenMagmaJet(col)) return; // 凍結後由 Game 繪製可踩冰柱
    const st = jetState(col, t);
    ctx.fillStyle = '#584038'; ctx.fillRect(x + 2, y + 8, 12, 8);   // 噴嘴座
    ctx.fillStyle = '#786058'; ctx.fillRect(x + 4, y + 5, 8, 4);
    ctx.fillStyle = '#241014'; ctx.fillRect(x + 6, y + 6, 4, 2);
    if (st === 'warn') { // 預備:小火苗閃爍
      if ((t >> 2) & 1) {
        ctx.fillStyle = '#f8a838'; ctx.fillRect(x + 6, y - 2, 4, 7);
        ctx.fillStyle = '#f8d820'; ctx.fillRect(x + 7, y, 2, 4);
      }
    } else if (st === 'on') { // 噴發:全高火柱
      const fl = (t >> 2) & 1;
      ctx.fillStyle = fl ? '#f87838' : '#f8a838';
      ctx.fillRect(x + 4, y - 32, 8, 38);
      ctx.fillStyle = fl ? '#f8d820' : '#f87838';
      ctx.fillRect(x + 6, y - 28, 4, 32);
      ctx.fillStyle = '#f8f8f8';
      ctx.fillRect(x + 7, y - 20 + (fl ? 4 : 0), 2, 12);
    }
  },
  'B': (ctx, x, y, t, map) => drawYoku(ctx, x, y, map.yokuActive('B'), map.yokuWarning('B'), map.theme),
  'C': (ctx, x, y, t, map) => drawYoku(ctx, x, y, map.yokuActive('C'), map.yokuWarning('C'), map.theme),
  'D': (ctx, x, y, t, map) => {
    const jungle = map.theme === 'jungle'; // 苔石門 / 鋼門
    ctx.fillStyle = map.doorClosed ? (jungle ? '#607058' : '#787880') : (jungle ? '#3c4838' : '#484850');
    ctx.fillRect(x + 2, y, 12, TILE);
    ctx.fillStyle = map.doorClosed ? (jungle ? '#38a028' : '#b0b0b8') : (jungle ? '#245018' : '#606068');
    ctx.fillRect(x + 2, y + 2, 12, 2); ctx.fillRect(x + 2, y + 9, 12, 2);
  },
  'K': () => { /* 檢查點隱藏不顯示：通過時仍會自動記錄（見 Player 檢查點觸發） */ },
  '>': (ctx, x, y, t, map) => drawConveyor(ctx, x, y, t, 1, map.theme),
  '<': (ctx, x, y, t, map) => drawConveyor(ctx, x, y, t, -1, map.theme),
  'S': (ctx, x, y, t) => { // 彈跳蘑菇
    const bob = ((t >> 4) & 1);
    ctx.fillStyle = '#e8d8b0'; ctx.fillRect(x + 6, y + 6, 4, 10);       // 蕈柄
    ctx.fillStyle = '#d82800';
    ctx.fillRect(x + 1, y + 2 + bob, 14, 5); ctx.fillRect(x + 3, y + bob, 10, 3); // 蕈傘
    ctx.fillStyle = '#f8f8f8';
    ctx.fillRect(x + 4, y + 1 + bob, 2, 2); ctx.fillRect(x + 10, y + 2 + bob, 2, 2);
  },
};

function drawConveyor(ctx, x, y, t, dir, theme) {
  const race = theme === 'castle';
  ctx.fillStyle = race ? '#252a30' : '#2a2a3a'; ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = race ? '#596168' : '#484858'; ctx.fillRect(x, y, TILE, race ? 2 : 4);
  if (race) { // 賽道加速區只留一個低彩度方向標，不再鋪滿亮黃色燈點
    const ax = x + 6 + ((((dir > 0 ? t : -t) >> 3) & 1) * dir);
    ctx.fillStyle = '#b55a50';
    ctx.fillRect(ax, y + 6, 3, 4);
    ctx.fillRect(ax + (dir > 0 ? 3 : -2), y + 7, 2, 2);
    ctx.fillStyle = '#15191e'; ctx.fillRect(x, y + 12, TILE, 2);
    return;
  }
  // 流動箭頭(方向 + 動畫)
  const shift = ((dir > 0 ? t : -t) >> 2) % 8;
  ctx.fillStyle = '#f8d820';
  for (let i = -1; i < 3; i++) {
    const ax = x + ((i * 8 + shift + 16) % 16);
    ctx.fillRect(ax, y + 1, 2, 2);
    ctx.fillRect(ax + (dir > 0 ? 2 : -2), y + 1 + 0, 1, 2);
  }
  ctx.fillStyle = '#181820'; ctx.fillRect(x, y + 4, TILE, 1);
}

// 消失方塊主題配色 [面, 亮邊, 暗邊]
const YOKU_COLORS = {
  city:   ['#00b8b8', '#80f8f8', '#006868'],
  jungle: ['#a8c838', '#e8f890', '#4c6810'],
  ice:    ['#b8d8f8', '#ffffff', '#5878a8'],
  magma:  ['#f87838', '#f8d820', '#a83808'],
  castle: ['#d82800', '#f8f8f8', '#181820'],
  shadow: ['#604898', '#d8c8f8', '#241838'],
};
function drawYoku(ctx, x, y, active, warning, theme) {
  if (!active) return;
  if (warning && ((worldFrame() >> 2) & 1)) return; // 消失前閃爍警告
  const c = YOKU_COLORS[theme] || YOKU_COLORS.city;
  ctx.fillStyle = c[0]; ctx.fillRect(x + 1, y + 1, 14, 14);
  ctx.fillStyle = c[1]; ctx.fillRect(x + 1, y + 1, 14, 2); ctx.fillRect(x + 1, y + 1, 2, 14);
  ctx.fillStyle = c[2]; ctx.fillRect(x + 1, y + 13, 14, 2); ctx.fillRect(x + 13, y + 1, 2, 14);
}

const STATIC_TILE_CACHE = new Map();
function cachedTile(ch, theme) {
  if (!'#=^HI'.includes(ch)) return null;
  const key = `${theme}:${ch}`;
  if (STATIC_TILE_CACHE.has(key)) return STATIC_TILE_CACHE.get(key);
  try {
    const c = document.createElement('canvas'); c.width = TILE; c.height = TILE;
    const cctx = c.getContext && c.getContext('2d');
    if (!cctx) return null;
    cctx.imageSmoothingEnabled = false;
    TILE_ART[ch](cctx, 0, 0, 0, { theme });
    STATIC_TILE_CACHE.set(key, c);
    return c;
  } catch (e) { return null; }
}

// 火焰噴射柱時序:各柱以欄位錯開相位(off → warn → on)
function jetState(col, frame) {
  const p = (frame + col * 47) % JET_CYCLE;
  return p >= 130 ? 'on' : p >= 110 ? 'warn' : 'off';
}
// 火柱的傷害範圍(含噴嘴那格,向上兩格)
function jetRect(col, row) {
  return { x: col * TILE + 3, y: (row - 2) * TILE, w: 10, h: 46 };
}

// 熔岩漲潮時序(熔岩關限定,Boss 房不受影響)
function lavaTideState(frame) {
  const p = frame % LAVA_CYCLE;
  if (p >= 520) return 'high';
  if (p >= 460) return 'warnHigh';
  if (p >= 360) return 'low';
  if (p >= 280) return 'warnLow';
  return 'calm';
}

function lavaSurfaceForState(state) {
  if (state === 'high') return LAVA_SURFACE_Y;
  if (state === 'low' || state === 'warnHigh') return LAVA_LOW_SURFACE_Y;
  return null;
}

// 城市陣風:回傳推力(0 = 平靜;每次風向由週期序號決定)
function windForce(frame) {
  const p = frame % WIND_CYCLE;
  if (p < 260) return 0;
  const dir = (hash32((frame / WIND_CYCLE) | 0) & 1) ? 1 : -1;
  const ramp = p < 300 ? (p - 260) / 40 : 1; // 漸強(預兆)
  return dir * WIND_PUSH * ramp;
}

const BG_COLORS = { city: '#080818', jungle: '#061206', ice: '#0c1424', magma: '#180808', castle: '#071018', shadow: '#080612' };
const hash32 = (n) => ((n * 2654435761) >>> 0);

// 遠景剪影帶(視差捲動的偽隨機矩形列)
function drawSilhouettes(ctx, camX, para, spacing, color, yFn) {
  ctx.fillStyle = color;
  const off = Math.floor(camX * para);
  for (let i = -1; i < Math.ceil(SCREEN_W / spacing) + 1; i++) {
    const seed = hash32(Math.floor(off / spacing) + i);
    yFn(i * spacing - (off % spacing), seed);
  }
}

// 環境氛圍粒子:每主題不同(確定性,免狀態)
function drawAmbient(ctx, camX, theme, t) {
  if (theme === 'city') { // 霓虹雨
    ctx.fillStyle = 'rgba(90,130,220,0.4)';
    for (let i = 0; i < 18; i++) {
      const s = hash32(i + 7);
      const x = ((s % 256) + 256 - ((camX * 0.7) % 256) + (t % 97)) % 256;
      const y = ((s >> 8) % 240 + t * (2.4 + (i % 3) * 0.6)) % 244 - 4;
      ctx.fillRect(x | 0, y | 0, 1, 6);
    }
  } else if (theme === 'jungle') { // 螢火蟲
    for (let i = 0; i < 10; i++) {
      const s = hash32(i + 31);
      if (((t + s) >> 5) & 1) continue; // 明滅
      const x = ((s % 256) + Math.sin((t + s) / 60) * 14 - camX * 0.5 % 256 + 512) % 256;
      const y = 40 + ((s >> 9) % 150) + Math.sin((t + s) / 45) * 6;
      ctx.fillStyle = 'rgba(248,248,88,0.8)';
      ctx.fillRect(x | 0, y | 0, 2, 2);
    }
  } else if (theme === 'ice') { // 飄雪
    ctx.fillStyle = 'rgba(232,248,255,0.8)';
    for (let i = 0; i < 22; i++) {
      const s = hash32(i + 13);
      const x = ((s % 256) + Math.sin((t + s) / 50) * 10 - ((camX * 0.6) % 256) + 512) % 256;
      const y = ((s >> 8) % 240 + t * (0.4 + (i % 3) * 0.25)) % 242 - 2;
      ctx.fillRect(x | 0, y | 0, 2, 2);
    }
  } else if (theme === 'magma') { // 上升火星
    for (let i = 0; i < 14; i++) {
      const s = hash32(i + 53);
      const x = ((s % 256) + Math.sin((t + s) / 40) * 6 - ((camX * 0.6) % 256) + 512) % 256;
      const y = 244 - (((s >> 8) % 240 + t * (0.5 + (i % 3) * 0.3)) % 250);
      ctx.fillStyle = (i & 1) ? 'rgba(248,120,56,0.8)' : 'rgba(248,216,32,0.7)';
      ctx.fillRect(x | 0, y | 0, 2, 2);
    }
  } else if (theme === 'castle') { // 稀疏維修燈：保留賽道氣氛但不干擾敵彈判讀
    for (let i = 0; i < 6; i++) {
      const s = hash32(i + 89);
      if (((t + s) >> 5) & 1) continue;
      const x = ((s % 288) - ((camX * 0.28) % 288) + 576) % 288 - 16;
      const y = 70 + ((s >> 8) % 96);
      ctx.fillStyle = (i & 1) ? '#827a48' : '#426878';
      ctx.fillRect(x | 0, y | 0, 3, 2);
    }
  } else if (theme === 'shadow') { // 要塞能源脈衝，維持低密度避免干擾消失方塊
    for (let i = 0; i < 7; i++) {
      const s = hash32(i + 137);
      if (((t + s) >> 4) & 1) continue;
      const x = ((s % 288) - ((camX * 0.18) % 288) + 576) % 288 - 16;
      const y = 44 + ((s >> 8) % 138);
      ctx.fillStyle = (i & 1) ? '#704888' : '#384878';
      ctx.fillRect(x | 0, y | 0, 2, 2);
    }
  }
}

function drawBackground(ctx, camX, theme) {
  ctx.fillStyle = BG_COLORS[theme] || BG_COLORS.city;
  ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
  const t = worldFrame();
  if (theme === 'jungle') {
    drawSilhouettes(ctx, camX, 0.3, 40, '#0e2410', (x, s) => ctx.fillRect(x, 0, 14 + (s % 14), SCREEN_H));
    drawSilhouettes(ctx, camX, 0.5, 28, '#123018', (x, s) => ctx.fillRect(x, 0, 26, 30 + (s % 50)));
    ctx.fillStyle = '#16301c'; ctx.fillRect(0, 208, SCREEN_W, 32);
  } else if (theme === 'ice') {
    drawSilhouettes(ctx, camX, 0.25, 44, '#1a2a48', (x, s) => { const h = 60 + (s % 70); ctx.fillRect(x, 216 - h, 40, h + 24); ctx.fillStyle = '#2a3c5c'; ctx.fillRect(x + 8, 216 - h, 10, 6); ctx.fillStyle = '#1a2a48'; });
    drawSilhouettes(ctx, camX, 0.5, 30, '#26385c', (x, s) => { const h = 30 + (s % 46); ctx.fillRect(x, 224 - h, 26, h + 16); });
    ctx.fillStyle = '#20304c'; ctx.fillRect(0, 220, SCREEN_W, 20);
  } else if (theme === 'magma') {
    drawSilhouettes(ctx, camX, 0.3, 38, '#2a1410', (x, s) => { const h = 50 + (s % 80); ctx.fillRect(x, 210 - h, 30, h + 30); });
    drawSilhouettes(ctx, camX, 0.5, 26, '#3a1c14', (x, s) => { const h = 26 + (s % 44); ctx.fillRect(x, 218 - h, 22, h + 22); });
    // 底部熔岩光(深淵即熔岩)
    ctx.fillStyle = '#a83808'; ctx.fillRect(0, 228, SCREEN_W, 12);
    ctx.fillStyle = ((t >> 3) & 1) ? '#f87838' : '#f8a838';
    ctx.fillRect(0, 228, SCREEN_W, 3);
  } else if (theme === 'castle') { // 夜間賽道：大面積暗色與少量維修區燈，降低視覺噪音
    ctx.fillStyle = '#0d1822'; ctx.fillRect(0, 48, SCREEN_W, 94);
    drawSilhouettes(ctx, camX, 0.2, 58, '#172530', (x, s) => {
      const h = 28 + (s % 22); ctx.fillRect(x, 142 - h, 52, h);
      ctx.fillStyle = '#263642'; ctx.fillRect(x + 5, 126 - (s % 10), 42, 2);
      ctx.fillStyle = '#172530';
    });
    ctx.fillStyle = '#26343e'; ctx.fillRect(0, 142, SCREEN_W, 40);
    ctx.fillStyle = '#46606b';
    for (let x = -((camX >> 2) % 48); x < SCREEN_W; x += 48) ctx.fillRect(x, 150, 8, 2);
    ctx.fillStyle = '#8d969e'; ctx.fillRect(0, 181, SCREEN_W, 2);
    ctx.fillStyle = '#8f2822';
    for (let x = -((camX | 0) % 64); x < SCREEN_W; x += 64) ctx.fillRect(x, 181, 10, 2);
    ctx.fillStyle = '#181c24'; ctx.fillRect(0, 216, SCREEN_W, 24);
  } else if (theme === 'shadow') { // 深藍紫要塞內部：支柱、管線與遠端能源窗
    ctx.fillStyle = '#0e0a20'; ctx.fillRect(0, 34, SCREEN_W, 174);
    const off = -(((camX * 0.22) | 0) % 64);
    for (let x = off - 64; x < SCREEN_W + 64; x += 64) {
      ctx.fillStyle = '#181330'; ctx.fillRect(x, 48, 44, 160);
      ctx.fillStyle = '#292044'; ctx.fillRect(x + 6, 58, 32, 4);
      ctx.fillRect(x + 10, 76, 24, 58);
      ctx.fillStyle = '#443060'; ctx.fillRect(x + 13, 82, 18, 2);
      ctx.fillRect(x + 13, 124, 18, 2);
    }
    ctx.fillStyle = '#211a38'; ctx.fillRect(0, 146, SCREEN_W, 4);
    ctx.fillStyle = '#684078';
    for (let x = -((camX >> 1) % 48); x < SCREEN_W; x += 48) ctx.fillRect(x, 147, 12, 2);
    ctx.fillStyle = '#0b0918'; ctx.fillRect(0, 208, SCREEN_W, 32);
  } else {
    drawSilhouettes(ctx, camX, 0.4, 32, '#141434', (x, s) => ctx.fillRect(x, 200 - (40 + (s % 70)), 24, 110));
    ctx.fillStyle = '#1c1c44'; ctx.fillRect(0, 196, SCREEN_W, 44);
  }
  drawAmbient(ctx, camX, theme, t);
}

  'd': { spawn: 'junglePlant' },
  'e': { spawn: 'treeMonkey' },
  'f': { spawn: 'iceHopper' },
  'g': { spawn: 'frostBlower' },
  'h': { spawn: 'rollerMine' },
  'i': { spawn: 'lavaSpitter' },
  'j': { spawn: 'clockGuard' },
  '+': { pickup: 'full' },     // Boss 門前一次性大型回血
  'X': { spawn: 'boss' },
};

// 消失方塊節奏(兩組交錯,有 30 影格重疊供跳躍)
function yokuPhaseActive(group, frame, cycle = YOKU_CYCLE) {
  const scale = cycle / YOKU_CYCLE;
  const p = frame % cycle;
  const bEnd = Math.round(170 * scale), cStart = Math.round(140 * scale), cWrap = Math.max(6, Math.round(10 * scale));
  return group === 'B' ? p < bEnd : (p >= cStart || p < cWrap);
}
function yokuPhaseWarning(group, frame, cycle = YOKU_CYCLE) {
  const scale = cycle / YOKU_CYCLE;
  const p = frame % cycle;
  return group === 'B' ? p >= Math.round(140 * scale) : (p >= cycle - Math.round(30 * scale));
}

let _worldFrame = 0; // 由 Game 每影格同步,供美術層取用
function worldFrame() { return _worldFrame; }

class Tilemap {
  constructor(levelData) {
    const rows = levelData.map;
    this.rows = rows.length;
    this.cols = rows[0].length;
    this.widthPx = this.cols * TILE;
    this.heightPx = this.rows * TILE;
    // 垂直關卡(高於一個畫面):約定 Boss 房佔據「最上面一個畫面」(rows 0..14),
    // 如此 Boss AI 的畫面座標假設(y 0..240)不需修改;只有房間地板要另外指定。
    this.vertical = this.rows > SCREEN_H / TILE;
    this.bossFloorY = this.vertical ? 13 * TILE : this.heightPx - 2 * TILE;
    this.theme = levelData.theme || 'city';
    this.yokuCycle = levelData.yokuCycle || YOKU_CYCLE;
    this.game = null;          // 由 Game 設定(動態方塊需查詢玩家/時間)
    this.doorClosed = false;

    this.playerSpawn = { x: TILE, y: TILE };
    this.enemySpawns = [];
    this.trapSpawns = [];      // 落冰錐等陷阱
    this.pickupSpawns = [];    // 關卡固定補給
    this.jets = [];            // 火焰噴射柱位置
    this.bossSpawn = null;
    this.checkpoints = [];
    this.doorX = null;         // Boss 觸發線(門的 x)

    this.grid = [];
    for (let r = 0; r < this.rows; r++) {
      const line = [];
      for (let c = 0; c < this.cols; c++) {
        const ch = rows[r][c] || '.';
        const props = TILE_PROPS[ch] || {};
        if (props.spawn === 'player') { this.playerSpawn = { x: c * TILE, y: r * TILE }; line.push('.'); }
        else if (props.spawn === 'boss') { this.bossSpawn = { x: c * TILE, y: r * TILE }; line.push('.'); }
        else if (props.spawn === 'icicle') { this.trapSpawns.push({ x: c * TILE, y: r * TILE }); line.push('.'); }
        else if (props.spawn) { this.enemySpawns.push({ type: props.spawn, x: c * TILE, y: r * TILE }); line.push('.'); }
        else if (props.pickup) { this.pickupSpawns.push({ kind: props.pickup, x: c * TILE, y: r * TILE }); line.push('.'); }
        else {
          if (props.checkpoint) this.checkpoints.push({ x: c * TILE, y: r * TILE });
          if (props.door && this.doorX === null) this.doorX = c * TILE;
          if (props.jet) this.jets.push({ col: c, row: r });
          line.push(ch);
        }
      }
      this.grid.push(line);
    }
  }

  charAt(col, row) {
    if (row < 0 || row >= this.rows) return '.';
    if (col < 0 || col >= this.cols) return '#'; // 左右邊界視為牆
    return this.grid[row][col];
  }
  charAtPx(px, py) { return this.charAt(Math.floor(px / TILE), Math.floor(py / TILE)); }
  propsAt(col, row) { return TILE_PROPS[this.charAt(col, row)] || {}; }

  yokuActive(group) { return yokuPhaseActive(group, worldFrame(), this.yokuCycle); }
  yokuWarning(group) { return this.yokuActive(group) && yokuPhaseWarning(group, worldFrame(), this.yokuCycle); }

  solidAtCell(col, row) {
    if (this.game && (this.game.isFrozenMagmaPoolCell(col, row) || this.game.isFrozenMagmaJetCell(col, row))) {
      return true;
    }
    const ch = this.charAt(col, row);
    const props = TILE_PROPS[ch] || {};
    if (props.solid) return true;
    if (props.door) return this.doorClosed;
    if (props.yoku) {
      if (!this.yokuActive(props.yoku)) return false;
      // 防夾死:方塊出現瞬間玩家「中心」在格內 → 對玩家視為非實心。
      // 注意必須用中心點而非 AABB 重疊——碰撞是先位移再檢查,
      // 落地時腳尖已插入格內幾個像素,用重疊判斷會讓方塊永遠踩不住。
      const p = this.game && this.game.player;
      if (p && !p.dead) {
        const pcx = p.x + p.w / 2, pcy = p.y + p.h / 2;
        if (pcx >= col * TILE && pcx < (col + 1) * TILE &&
            pcy >= row * TILE && pcy < (row + 1) * TILE) return false;
      }
      return true;
    }
    return false;
  }

  // 梯子頂端(該格是梯子且上方不是梯子)可站立
  isLadderTop(col, row) {
    return this.charAt(col, row) === 'H' && this.charAt(col, row - 1) !== 'H';
  }

  eachOverlapping(rect, fn) {
    const c0 = Math.floor(rect.x / TILE), c1 = Math.floor((rect.x + rect.w - 0.001) / TILE);
    const r0 = Math.floor(rect.y / TILE), r1 = Math.floor((rect.y + rect.h - 0.001) / TILE);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      if (fn(this.propsAt(c, r), c, r)) return;
    }
  }

  draw(ctx, camera) {
    const c0 = Math.max(0, Math.floor(camera.x / TILE));
    const c1 = Math.min(this.cols - 1, Math.floor((camera.x + SCREEN_W) / TILE));
    const camY = camera.y || 0;
    const r0 = Math.max(0, Math.floor(camY / TILE));
    const r1 = Math.min(this.rows - 1, Math.floor((camY + SCREEN_H) / TILE));
    const camXr = Math.round(camera.x);
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        const ch = this.grid[r][c];
        const fn = TILE_ART[ch];
        if (fn) {
          const tile = ctx.drawImage && cachedTile(ch, this.theme);
          if (tile) ctx.drawImage(tile, c * TILE - camXr, r * TILE);
          else fn(ctx, c * TILE - camXr, r * TILE, worldFrame(), this, c * TILE);
        }
      }
    }
  }
}

// AABB 位移 + tile 碰撞(先 X 後 Y)。e.useLadderTops = 玩家可站梯頂
function moveWithCollision(e, map) {
  const res = { hitWall: false, grounded: false, hitCeiling: false };
  const ySamples = () => [e.y + 0.5, e.y + e.h / 2, e.y + e.h - 0.5];

  e.x += e.vx;
  if (e.vx > 0) {
    const col = Math.floor((e.x + e.w - 0.001) / TILE);
    for (const sy of ySamples()) {
      if (map.solidAtCell(col, Math.floor(sy / TILE))) {
        e.x = col * TILE - e.w; e.vx = 0; res.hitWall = true; break;
      }
    }
  } else if (e.vx < 0) {
    const col = Math.floor(e.x / TILE);
    for (const sy of ySamples()) {
      if (map.solidAtCell(col, Math.floor(sy / TILE))) {
        e.x = (col + 1) * TILE; e.vx = 0; res.hitWall = true; break;
      }
    }
  }

  const feetBefore = e.y + e.h;
  const xSamples = [e.x + 0.5, e.x + e.w / 2, e.x + e.w - 0.5];
  e.y += e.vy;
  if (e.vy > 0) {
    const row = Math.floor((e.y + e.h - 0.001) / TILE);
    for (const sx of xSamples) {
      const col = Math.floor(sx / TILE);
      const solid = map.solidAtCell(col, row) ||
        // 梯頂 = 單向平台:只有從上方落下才擋(可從下方跳穿)
        (e.useLadderTops && map.isLadderTop(col, row) && feetBefore <= row * TILE + 0.01);
      if (solid) { e.y = row * TILE - e.h; e.vy = 0; res.grounded = true; break; }
    }
  } else if (e.vy < 0) {
    const row = Math.floor(e.y / TILE);
    for (const sx of xSamples) {
      if (map.solidAtCell(Math.floor(sx / TILE), row)) {
        e.y = (row + 1) * TILE; e.vy = 0; res.hitCeiling = true; break;
      }
    }
  }
  return res;
}

function aabbOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// 只做水平位移的碰撞推擠(輸送帶用):不動到 vx/vy 狀態
function nudgeX(e, map, dx) {
  const sVx = e.vx, sVy = e.vy;
  e.vx = dx; e.vy = 0;
  moveWithCollision(e, map);
  e.vx = sVx; e.vy = sVy;
}

/* ================================================================
 * MODULE: level data — 純資料（每關可使用不同的水平長度）
 *   . 空氣  # 磚  = 平台  ^ 尖刺  H 梯子  B/C 消失方塊(兩組節奏)
 *   K 檢查點  D Boss門  P 玩家  W 巡邏兵  T 砲台  X Boss
 *   底部沒有地板的欄位 = 深淵(掉落即死)
 * ================================================================ */
// 賽車關（CHRONO CIRCUIT）：輸送帶賽道 ＋ 一段「必經的立體天橋」。地面賽道中途斷成
// 尖刺深淵，須沿引道梯子爬上高架快速道（帶輸送帶與時鐘守衛）再下橋。既保留競速手感、
// 又加入垂直移動。所有跳躍已用可達性 BFS 驗證。
function buildTimeCitadelMap() {
  const C = 192, R = 15; const g = Array.from({ length: R }, () => Array(C).fill('.'));
  const fill = (r, a, b, ch = '#') => { for (let c = a; c <= b; c++) g[r][c] = ch; };
  const lad = (c, a, b) => { for (let r = a; r <= b; r++) g[r][c] = 'H'; };
  const belt = (a, b, ch, r = 13) => { for (let c = a; c <= b; c++) g[r][c] = ch; };
  const floor = (a, b) => { fill(13, a, b); fill(14, a, b); };
  g[12][2] = 'P';
  // ── 地面賽道前導（0..60）：輸送帶、高架滑行車、時鐘守衛 ──
  floor(0, 60);
  belt(14, 20, '>'); belt(31, 38, '<'); belt(48, 55, '>');
  fill(8, 6, 13, '='); fill(8, 23, 30, '='); fill(8, 40, 47, '=');
  for (const c of [9, 26, 43]) g[7][c] = 'T';       // 高架滑行車
  g[12][18] = 'W'; g[12][35] = 'W'; g[12][52] = 'W'; g[12][28] = '^';
  // ── 立體天橋（地面尖刺深淵 61..103；高架 61..106）──
  fill(13, 61, 103, '^'); fill(14, 61, 103, '#');   // 賽道斷裂＝尖刺深淵
  lad(60, 7, 12);                                    // 引道（底在實地 col60）
  fill(8, 61, 106, '#');                             // 高架快速道
  for (const [a, b, ch] of [[66, 73, '>'], [80, 88, '<'], [94, 101, '>']]) belt(a, b, ch, 8);
  g[7][70] = 'W'; g[7][76] = 'T'; g[7][84] = 'T'; g[7][98] = 'W';
  lad(106, 8, 12);                                   // 下橋引道（底在實地 col106）
  floor(104, 176);                                   // 地面賽道恢復
  // ── 地面賽道收尾（104..176）──
  belt(112, 119, '>'); belt(130, 138, '<'); belt(150, 158, '>');
  fill(8, 120, 127, '='); fill(8, 140, 147, '='); for (const c of [123, 144]) g[7][c] = 'T';
  g[12][116] = 'W'; g[12][134] = 'W'; g[12][154] = 'W'; g[12][160] = '^'; g[12][168] = 'K';
  // ── Boss 門與決鬥房：只移除 Boss 的平台，Boss 直接站地面 ──
  floor(177, 191);
  for (let r = 0; r <= 9; r++) g[r][175] = '#';
  for (let r = 10; r <= 12; r++) g[r][175] = 'D';
  g[12][186] = 'X';
  return g.map((row) => row.join(''));
}

// 蝙蝠關（NEON CITY）：城市屋簷跳躍 ＋ 一段「必經的垂直摩天樓攀爬」。
// 沿防火梯的梯子與外牆平台往上爬到尖塔、跨過高樓群、再下樓；樓與樓之間是街道深淵
// （掉落即死）。所有跳躍都在玩家跳躍包絡內、已用可達性 BFS 驗證。
function buildNeonCityMap() {
  const C = 192, R = 15; const g = Array.from({ length: R }, () => Array(C).fill('.'));
  const fill = (r, a, b, ch = '#') => { for (let c = a; c <= b; c++) g[r][c] = ch; };
  const lad = (c, a, b) => { for (let r = a; r <= b; r++) g[r][c] = 'H'; };
  const bldg = (a, b, top) => { for (let r = top; r <= 14; r++) fill(r, a, b); };
  // ── 屋頂前導（0..60）：高低平緩（起伏 1~2 格）、街道缺口 3 格 ──
  bldg(0, 6, 10);  g[9][3] = 'P';
  bldg(10, 15, 10); g[9][12] = 'W';
  bldg(19, 24, 9);  g[8][22] = 'T';
  bldg(28, 33, 10); g[9][31] = 'W';
  bldg(37, 42, 9);  g[8][40] = 'T';
  bldg(46, 51, 11); g[10][49] = 'W';
  bldg(55, 60, 10); g[9][58] = 'T';
  // ── 摩天樓攀爬（62..102）：梯子＋外牆平台爬到尖塔，跨樓，街道＝掉落即死 ──
  bldg(62, 68, 12); g[11][64] = 'W';

  fill(4, 62, 69, '#'); g[3][66] = 'T';        // 尖塔頂（梯子接到這）
  fill(4, 73, 80, '#'); g[3][76] = 'W';        // 二號塔頂（跨街道 70..72）
  lad(74, 4, 10);                              // 塔內下樓梯
  fill(10, 73, 80, '#'); g[9][78] = 'T';       // 二號塔中層
  bldg(84, 90, 11); g[10][87] = 'W';
  bldg(94, 100, 12); g[11][97] = 'T';
  // ── 屋頂收尾（104..160）：往下跨過中高樓群 ──
  bldg(104, 110, 10); g[9][107] = 'T';
  bldg(114, 119, 9);  g[8][116] = 'W';
  bldg(123, 128, 11); g[10][126] = 'T';
  bldg(132, 137, 10); g[9][135] = 'W';
  bldg(141, 146, 11); g[10][144] = 'T';
  bldg(150, 156, 10); g[9][153] = 'W';
  bldg(160, 173, 12); g[11][166] = 'K';        // 隱藏檢查點
  // ── Boss 房（最後一個畫面平地），蝙蝠在高處生成、全程飛行 ──
  fill(13, 175, 191); fill(14, 175, 191);
  for (let r = 0; r <= 9; r++) g[r][174] = '#';
  for (let r = 10; r <= 12; r++) g[r][174] = 'D';
  g[9][186] = 'X';
  return g.map((row) => row.join(''));
}

function buildShadowFortressMap() {
  // 鏡像要塞：加長約 1.5 倍的對稱前導區＋獨立 Boss 房（最後 16 格）。
  const cols = 216;
  const rows = Array.from({ length: 15 }, () => Array(cols).fill('.'));
  const fill = (row, from, to, ch = '#') => {
    for (let c = from; c <= to; c++) rows[row][c] = ch;
  };
  const floor = (from, to) => { fill(13, from, to); fill(14, from, to); };
  const put = (list) => { for (const [c, r, ch] of list) rows[r][c] = ch; };

  // 要塞天花板只負責建立室內感，不形成新的玩法機關。
  fill(2, 0, cols - 1);
  floor(0, 8);
  rows[12][2] = 'P';

  // ── 第一段：快速 B/C 消失方塊跨深淵。三座固定維修踏板是節奏等待點。──
  put([
    [10,12,'B'],[11,12,'B'],[12,11,'B'],[13,11,'B'],[14,10,'B'],[15,11,'B'],
    [18,12,'C'],[19,11,'C'],[20,10,'C'],[21,10,'C'],[22,11,'C'],[23,12,'C'],
    [26,12,'B'],[27,11,'B'],[28,10,'B'],[29,11,'B'],
    [32,11,'C'],[33,10,'C'],[34,10,'C'],[35,11,'C'],[36,12,'C'],
  ]);
  fill(12, 16, 17, '=');
  fill(12, 24, 25, '=');
  fill(12, 30, 31, '=');

  // ── 第二段：鏡像大廳。地形以第 56 欄為中線左右對稱，呼應「鏡像要塞」主題。──
  //   兩側高台各架一門砲台夾擊；中央尖刺池需靠左 B、右 C 的鏡像消失方塊橋跨越，
  //   中線留一格固定安全踏板，讓玩家能在兩組節奏交界處等待。
  floor(37, 74);
  rows[12][40] = 'K';                                  // 檢查點一
  fill(9, 43, 48, '=');  rows[8][45] = 'b';            // 左高台砲台
  fill(9, 64, 69, '=');  rows[8][66] = 'b';            // 右高台砲台（對第 56 欄鏡射）
  // 加長的中央尖刺池（13 格），上方是左 B、右 C 的鏡像消失方塊橋，
  // 中線與兩側各留一格固定安全踏板，讓玩家能在兩組節奏交界處等待。
  for (let c = 50; c <= 62; c++) rows[12][c] = '^';
  put([
    [50,10,'B'],[51,10,'B'],[52,10,'B'], [54,10,'B'],[55,10,'B'],
    [57,10,'C'],[58,10,'C'], [60,10,'C'],[61,10,'C'],[62,10,'C'],
  ]);
  rows[10][53] = '='; rows[10][56] = '='; rows[10][59] = '=';  // 三座固定安全踏板
  rows[12][42] = 'f';  rows[12][70] = 'f';             // 鏡像冰蛙
  rows[12][49] = 'a';  rows[12][63] = 'a';             // 鏡像地面兵，橋兩端交叉施壓

  // ── 第三段：前五關代表雜兵走廊 ＋ 檢查點二 ＋ 一處小深淵。──
  floor(75, 110);
  rows[12][76] = 'f';
  rows[12][79] = 'a';
  fill(9, 81, 85, '=');   rows[8][83] = 'g';           // 冰晶砲高台
  rows[12][88] = 'c';
  fill(9, 89, 93, '=');   rows[8][91] = 'e';           // 樹猴高台（丟香蕉）
  rows[12][95] = 'K';                                  // 檢查點二
  rows[12][97] = 'd';
  fill(13, 99, 100, '.'); fill(14, 99, 100, '.');      // 小深淵（乾淨兩格跳）
  rows[12][103] = 'h';
  fill(9, 104, 108, '='); rows[8][106] = 'i';          // 熔爐高台
  rows[12][109] = 'j';

  // ── 第四段（全新）：垂直「鏡像豎井」。左側往上爬、右側對稱往下爬，跨越尖刺深淵；
  //   每座平台都站著前五關代表雜兵的暗影分身。取代原本重複的第二座消失方塊深淵。──
  const lad = (c, a, b) => { for (let r = a; r <= b; r++) rows[r][c] = 'H'; };
  floor(111, 115);                                     // 豎井入口小段地面
  fill(13, 116, 179, '^'); fill(14, 116, 179, '#');    // 尖刺深淵（墜落即死）
  floor(180, cols - 1);                                // 豎井出口地面（接第五段與 Boss 房）
  // 左側爬升（梯子＋外牆平台）
  fill(11, 116, 121, '='); rows[10][118] = 'a';        // L1（自地面 115 起跳）
  lad(120, 8, 11);
  fill(8, 123, 128, '=');  rows[7][125] = 'b';         // P2
  lad(127, 5, 8);
  fill(5, 130, 136, '=');  rows[4][133] = 'j';         // P3 頂點
  // 右側對稱下降
  fill(7, 140, 146, '=');  rows[6][143] = 'g';         // P4
  lad(145, 7, 10);
  fill(10, 149, 155, '='); rows[9][152] = 'h';         // P5

}

// 冰山關（FROZEN PEAK）：冰霜妖靈（冰錐雨／滑翔）Boss。必經的「垂直冰煙囪」——沿梯子與

// 冰峰（FROZEN PEAK）：真正的垂直關卡——整座關卡是一口 7 個畫面高的登山井，
// 鏡頭垂直捲動。左半 16 格是攀登路線（之字形岩架＋梯子），右半是山體實心岩；
// 塔頂（最上面一個畫面）右側是 Boss 房，玩家在頂端走進 Boss 門（引擎約定：
// 垂直關卡的 Boss 房必須佔據 rows 0..14，Boss AI 的畫面座標假設才成立）。
function buildFrozenPeakMap() {
  const C = 32, R = 105; // 512×1680 px：2 個畫面寬 × 7 個畫面高

  g[91][10] = 'T';                        // 冰晶砲居高臨下(ice: T=FrostBlower)

// ── 最後決戰：Boss Rush 傳送房 ──
// 一間橫向長廳，地面平坦；6 個傳送膠囊（對應 6 個 Boss）沿地面排列，
// 正中央是通往最終 Boss 的封印通道（全部擊敗後才開啟）。膠囊與通道皆為
// 遊戲物件疊繪，不是實心磚，玩家可自由走過。房間本身沒有門 / Boss 磚，
// Boss 房是進膠囊後即時生成的獨立小競技場（見 buildRushArenaMap）。
function buildFinalFortressMap() {
  const cols = 33, rows = 15;
  const g = Array.from({ length: rows }, () => Array(cols).fill('.'));
  for (let c = 0; c < cols; c++) { g[0][c] = '#'; g[13][c] = '#'; g[14][c] = '#'; }
  for (let r = 0; r < rows; r++) { g[r][0] = '#'; g[r][cols - 1] = '#'; }
  g[12][2] = 'P';   // 玩家由左側進入（正中央留給通道，重生不會誤觸）
  return g.map((row) => row.join(''));
}

// 復刻 Boss 的單畫面競技場（16 格 = 剛好一個畫面，鏡頭鎖死＝原本 Boss 房環境）。
function buildRushArenaMap(bossRow) {
  const cols = 16, rows = 15;
  const g = Array.from({ length: rows }, () => Array(cols).fill('.'));
  for (let c = 0; c < cols; c++) { g[13][c] = '#'; g[14][c] = '#'; }
  g[12][2] = 'P';
  g[bossRow][12] = 'X';
  return g.map((row) => row.join(''));
}
